# cargo-deny configuration
# https://embarkstudios.github.io/cargo-deny/checks/cfg.html
#
# Every check in this file is a **gate**: `cargo deny check` is a required CI
# job and a `warn` here exits 0, which makes a check that reports rather than
# one that enforces. `yanked` and `multiple-versions` were both `warn` and were
# therefore decorative — the only things genuinely gated were advisories,
# licenses, wildcards and sources.

[advisories]
db-path = "~/.cargo/advisory-db"
db-urls = ["https://github.com/RustSec/advisory-db"]
# A yanked crate is one its author withdrew — most often because it is broken or
# unsound. A `--locked` build keeps using it forever, so a warning nobody reads
# is the wrong response. No dependency in `Cargo.lock` is yanked today, so this
# gate is green on arrival.
yanked = "deny"

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "ISC",
  "MPL-2.0",
  "Unicode-3.0",
  "Unicode-DFS-2016",
  "Zlib",
  "CC0-1.0",
]
confidence-threshold = 0.8
# The allow-list is the policy, not an inventory of today's graph. It stays
# `allow` because a policy may legitimately be broader than what is currently
# linked — but the reason it used to give ("the workspace has no third-party
# dependencies") has been false for a long time: `Cargo.lock` carries ~200
# packages and this list is load-bearing. Turning it to `deny` would make every
# dependency *removal* a CI failure, which is the worse trade.

unused-allowed-license = "allow"

[bans]
# Two copies of a crate in one binary means two copies of its types and its
# statics, and a duplicate of something like `getrandom` or `thiserror` costs
# real build time and binary size. Denied, with each surviving duplicate skipped
# **by exact version** and with the reason it cannot be resolved from here — so
# a *new* duplicate fails the job instead of joining a warning nobody reads, and
# so this list shrinks visibly as upstreams catch up. Re-derive it with
# `cargo deny --all-features check bans`.
multiple-versions = "deny"
wildcards = "deny"
highlight = "all"
skip = [
  # The `toml` 0.8-versus-1.x duplication and both `hashbrown`/`foldhash` pairs
  # were skipped here until 2026-08-21 and are gone: every one of them was a
  # second copy that only `crcbl-wgpu`'s dependency tree pulled in, so deleting
  # that crate resolved them upstream-of-us rather than by a skip. `cargo deny`
  # reports an unmatched skip as a warning, which is what caught all five.
  # `getrandom` 0.4 is the workspace's own pin (crcbl-rand's native entropy).
  # 0.2 arrives under a transitive user that has not migrated, and 0.3 under
  # `rand_core`'s `os_rng` feature — which `--all-features` turns on and cargo's
  # feature unification then applies to the copy of `rand_core` that crcbl-rand's
  # `rand_chacha` shares, even though crcbl-rand keeps `os_rng` off. None of
  # these can be resolved from here, so the older two are skipped and 0.4 stands.
  { crate = "getrandom@0.2.17", reason = "transitive; the workspace pins 0.4" },
  { crate = "getrandom@0.3.4", reason = "rand_core's os_rng under --all-features; the workspace pins 0.4" },
  # `r-efi` is getrandom's UEFI backend: 5.x under getrandom 0.3, 6.x under 0.4.
  # The duplicate follows the getrandom one above; skip the older with it.
  { crate = "r-efi@5.3.0", reason = "getrandom 0.3's UEFI backend; 6.x comes from getrandom 0.4" },
  # `thiserror` 1.x survives only under third-party crates; every crate in this
  # workspace uses the 2.0 pin from `[workspace.dependencies]`.
  { crate = "thiserror@1.0.69", reason = "transitive; the workspace pins 2.0" },
  { crate = "thiserror-impl@1.0.69", reason = "transitive; follows thiserror 1.x" },
  { crate = "jni-sys@0.3.1", reason = "transitive; the android backends of cpal/ndk" },
  { crate = "syn@2.0.119", reason = "transitive; proc-macro crates mid-migration to syn 3" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
