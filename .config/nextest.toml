# cargo-nextest configuration — https://nexte.st/docs/configuration/

# Hard per-test timeout. nextest prints SLOW at each period, naming the culprit,
# then SIGKILLs it at 4x. Without this a deadlocked test hangs the whole CI job
# with no signal at all — a sibling project burned >24h of runner time that way
# before adding this line. Raise `period` when GPU/lavapipe render e2e lands at
# P1: a cold software-rasterizer frame is slow, but never 60s slow.
[profile.default]
retries = 0
fail-fast = true
failure-output = "immediate"
status-level = "pass"
slow-timeout = { period = "60s", terminate-after = 4 }

# Used by CI: never retry (a flaky test is a bug, not a retry candidate), run
# the whole suite so one failure does not mask the rest, and emit JUnit XML for
# the test-report artifact. `slow-timeout` is repeated because profiles do not
# inherit it.
[profile.ci]
retries = 0
fail-fast = false
failure-output = "immediate-final"
status-level = "skip"
final-status-level = "flaky"
slow-timeout = { period = "60s", terminate-after = 4 }

[profile.ci.junit]
path = "junit.xml"

# # One vk e2e test runs alone, and this is a quarantine rather than a need
#
# `retire::two_submissions_referencing_one_destroyed_buffer_keep_it_alive`
# **does not require exclusive access**. It is here because running the vk e2e
# suite in parallel — which it now does; `run-vk-e2e.sh` dropped `--no-capture`
# and with it the single thread nextest was silently forcing — reproduces a real
# use-after-free in `crcbl-vk`'s deletion queue at roughly one run in three on
# lavapipe, and there is no fix for it in this change.
#
# What reproduces, verbatim from the layer:
#
#   VUID-vkQueueSubmit2-commandBuffer-03874: VkCommandBuffer [copy to B] was
#   recorded but now has become invalid ... VkBuffer [destroyed, still
#   referenced] was destroyed
#
# then a SIGSEGV inside lavapipe. `VkDevice::submit` extends a parked object's
# retirement key for the command buffers *in that submit* and then calls
# `poll_retire` at the end of it; a command buffer that was recorded against the
# same object and has not been submitted yet is invisible to both. Under load
# submission A completes inside that window and the object is freed while B
# still references it. Serially, A has not finished when submit(B) runs, which
# is the only reason this has ever passed.
#
# So this line restores the timing the test has always relied on. It hides a
# live bug; `docs/backlog.md` carries it with the repro, and this override goes
# when that entry does. Verified: 30 consecutive runs of the test alone are
# green, and the same failure reproduces on a pristine worktree of `e875e44`,
# the commit this sits on, so the parallelism exposed it rather than caused it.
[[profile.default.overrides]]
filter = 'binary_id(crcbl-vk::vk_e2e) and test(=retire::two_submissions_referencing_one_destroyed_buffer_keep_it_alive)'
threads-required = "num-cpus"
