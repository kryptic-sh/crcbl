[package]
name = "crcbl-server"
description = "Crucible authoritative server: fixed-tick simulation and snapshot emission"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# The checks and the store behind a `Flags::SIM` console set: the server
# applies one on its tick boundary, parsed by the console's own kinds so it
# reads exactly the value a client's console checked. Dependency-free, so it
# brings nothing else in.
crcbl-console = { workspace = true }
crcbl-core = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
# The resume-token entropy source. Entropy now comes through `crcbl-rand`
# rather than `getrandom` directly, so this crate names one seam instead of a
# per-target backend: on native it is the OS CSPRNG (getrandom, inside
# crcbl-rand); on `wasm32` it is a host-seeded ChaCha20 CSPRNG that the JS boot
# fills through the `__crcbl_web_seed_entropy` export — no `wasm-bindgen`, no
# `js-sys`, and so no per-target section and no `.cargo/config.toml` here.
crcbl-rand = { workspace = true }

[dev-dependencies]
crcbl-client = { workspace = true }
crcbl-phys = { workspace = true }
glam = { workspace = true }

[lints]
workspace = true
