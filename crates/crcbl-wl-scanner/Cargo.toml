[package]
name = "crcbl-wl-scanner"
description = "Crucible's Wayland protocol code generator: protocol XML in, Rust marshalling code out"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Zero dependencies, on purpose. This crate is a *build* dependency of
# `crcbl-shell`, so anything it pulls in is compiled for the host on every
# clean build of the engine — and an XML dialect this constrained (no
# namespaces, no CDATA, no DTD subset, a fixed element vocabulary) does not
# justify a general-purpose parser. `src/xml.rs` is ~200 lines and is tested
# against the two protocol files we actually ship.

[lints]
workspace = true
