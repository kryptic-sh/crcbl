[package]
name = "crcbl-wgpu"
description = "Crucible wgpu backend — native + WebGPU (Tier B)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# P5.2 (Slice 3) delivers resource mappings and command encoding.
[dependencies]
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }
log = { workspace = true }
wgpu = { version = "30", features = ["spirv"] }
raw-window-handle = "0.6"

# Only the native path blocks: `Instance::create_device` is synchronous and a
# native thread may block on `request_device`. The browser main thread may not,
# which is why wasm32 refuses instead — see the crate docs.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
pollster = "1.0"

[features]
# The suite in `tests/wgpu_e2e.rs`, which needs a real adapter. Feature-gated
# *and* `#[ignore]`d, exactly like `crcbl-vk`'s `vk-e2e`: a plain
# `cargo nextest run --all-features` on a machine with no GPU must stay green,
# and `tests/run-wgpu-e2e.sh` is the only thing that turns them on — and it
# fails when the suite reports zero tests run.
wgpu-e2e = []

[lints]
workspace = true
