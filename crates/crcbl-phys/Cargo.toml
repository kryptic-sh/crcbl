[package]
name = "crcbl-phys"
description = "Crucible physics: queries, forces, CCD"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `crcbl_core::bounds` for the `NaN`-safe lane-wise fold `Aabb::union` needs.
# This used to be a dev-dependency, on the reasoning that the crate reached core
# through the ECS and needed nothing of its own; that stopped being true when the
# BVH's fold was found to discard its accumulator against a `NaN`. It adds no
# crate to the graph, since the ECS already pulls core in.
crcbl-core = { workspace = true }
crcbl-ecs = { workspace = true }
glam = { workspace = true }

[lints]
workspace = true
