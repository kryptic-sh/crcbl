# The simulation's determinism rule, as a lint: no platform transcendental in
# `crcbl-phys`. glibc, Apple's libm, the MSVC runtime and the browser each round
# `sin`, `exp` and the rest in their own way, so a simulation that calls them
# reaches different bits on different targets. The user decided on 2026-09-17
# (`docs/plan/05-physics.md`, "Decision (determinism math, 2026-09-17)") that
# the simulation's transcendentals are constructed in-engine; `crcbl_core::trig`
# is the sine and cosine, and `crcbl_phys::rotation_from_scaled_axis` is the
# rotation built from them.
#
# `mul_add` is here for the other half of the same rule: a fused multiply-add
# rounds once where the two operations round twice, and whether the hardware
# fuses is the target's choice.
#
# A call that must stay says so with `#[expect(clippy::disallowed_methods,
# reason = ...)]`, which names it where a reader will see it. Clippy reads this
# file from the crate's own directory, so it binds this crate and no other.
disallowed-methods = [
  { path = "f64::sin", reason = "platform sine; use crcbl_core::trig::sin" },
  { path = "f64::cos", reason = "platform cosine; use crcbl_core::trig::cos" },
  { path = "f64::sin_cos", reason = "platform sine and cosine; use crcbl_core::trig" },
  { path = "f64::tan", reason = "platform transcendental; construct it from crcbl_core::trig" },
  { path = "f64::asin", reason = "platform transcendental" },
  { path = "f64::acos", reason = "platform transcendental" },
  { path = "f64::atan", reason = "platform transcendental" },
  { path = "f64::atan2", reason = "platform transcendental" },
  { path = "f64::sinh", reason = "platform transcendental" },
  { path = "f64::cosh", reason = "platform transcendental" },
  { path = "f64::tanh", reason = "platform transcendental" },
  { path = "f64::asinh", reason = "platform transcendental" },
  { path = "f64::acosh", reason = "platform transcendental" },
  { path = "f64::atanh", reason = "platform transcendental" },
  { path = "f64::exp", reason = "platform transcendental" },
  { path = "f64::exp2", reason = "platform transcendental" },
  { path = "f64::exp_m1", reason = "platform transcendental" },
  { path = "f64::ln", reason = "platform transcendental" },
  { path = "f64::ln_1p", reason = "platform transcendental" },
  { path = "f64::log", reason = "platform transcendental" },
  { path = "f64::log2", reason = "platform transcendental" },
  { path = "f64::log10", reason = "platform transcendental" },
  { path = "f64::powf", reason = "platform transcendental" },
  { path = "f64::powi", reason = "its precision is unspecified and may differ by target" },
  { path = "f64::cbrt", reason = "platform transcendental" },
  { path = "f64::hypot", reason = "platform libm; sqrt of the sum of squares is exact IEEE" },
  { path = "f64::mul_add", reason = "fused or not is the target's choice" },
  { path = "glam::DVec3::mul_add", reason = "fused or not is the target's choice" },
  { path = "glam::DQuat::from_axis_angle", reason = "platform sine and cosine; use crcbl_phys::rotation_from_scaled_axis" },
  { path = "glam::DQuat::from_scaled_axis", reason = "platform sine and cosine; use crcbl_phys::rotation_from_scaled_axis" },
  { path = "glam::DQuat::from_rotation_x", reason = "platform sine and cosine; use crcbl_phys::rotation_from_scaled_axis" },
  { path = "glam::DQuat::from_rotation_y", reason = "platform sine and cosine; use crcbl_phys::rotation_from_scaled_axis" },
  { path = "glam::DQuat::from_rotation_z", reason = "platform sine and cosine; use crcbl_phys::rotation_from_scaled_axis" },
  { path = "glam::DQuat::from_euler", reason = "platform sine and cosine" },
  { path = "glam::DQuat::to_euler", reason = "platform transcendental" },
  { path = "glam::DQuat::to_axis_angle", reason = "platform transcendental" },
  { path = "glam::DQuat::to_scaled_axis", reason = "platform transcendental" },
  { path = "glam::DQuat::angle_between", reason = "platform transcendental" },
  { path = "glam::DQuat::slerp", reason = "platform transcendental" },
  { path = "glam::DQuat::rotate_towards", reason = "platform transcendental" },
  { path = "glam::DVec3::angle_between", reason = "platform transcendental" },
  { path = "glam::DVec3::slerp", reason = "platform transcendental" },
  { path = "glam::DVec3::rotate_towards", reason = "platform transcendental" },
  { path = "glam::DMat3::from_axis_angle", reason = "platform sine and cosine" },
  { path = "glam::DMat3::from_rotation_x", reason = "platform sine and cosine" },
  { path = "glam::DMat3::from_rotation_y", reason = "platform sine and cosine" },
  { path = "glam::DMat3::from_rotation_z", reason = "platform sine and cosine" },
  { path = "glam::DMat3::from_euler", reason = "platform sine and cosine" },
]
