[package]
name = "crcbl-shaders"
description = "Crucible shader sources (Slang) and their compiled SPIR-V"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# **No dependencies, on purpose — not even `crcbl-hal`.** This crate hands out
# `&[u32]` and entry-point names, which is exactly what `ShaderModuleDesc` takes,
# so it stays usable by a backend that has not been written yet (P5's wgpu, P14's
# Metal/DX12) and cannot drag the seam into the build graph of anything that only
# wants bytes.
#
# There is no build-dependency either: `build.rs` verifies the committed
# artifacts with a SHA-256 implemented in `src/sha256.rs`, which the library
# compiles too — so the code doing the checking is the code the library's tests
# cover. See the crate docs for why the artifacts are committed at all.

[lints]
workspace = true

# The WGSL validator, and a dev-dependency only — the library above still has no
# dependencies at all, which is the property that comment protects.
#
# **It does not leave with `crcbl-wgpu`, and this comment used to imply it
# would.** The old justification was that `wgpu` compiles WGSL through naga, so
# naga is the validator that backend would actually run, and that pinning it to
# the version `wgpu` already resolves costs the lockfile an edge and no package.
# Both halves expire with that crate. What does not expire is the reason to
# validate at all: the WGSL checked here is what `crcbl-webgpu` ships to a real
# browser, and once that is the only browser backend this validation matters
# more, not less. Expect the pin to become a package of its own in the lockfile
# when `wgpu` goes — that is the cost, and it is worth paying.
#
# The standing caveat: naga accepting a module is not Dawn accepting it, which
# is exactly how the uniformity bug shipped. `wgsl-in` is not a default feature
# and is the only one wanted.
[dev-dependencies]
naga = { version = "30", features = ["wgsl-in"] }
# The cluster-DAG builder the committed `clusters/*.dag` artifact comes out of,
# and a **dev-dependency**, which is the whole arrangement:
#
# * a normal dependency would be a cycle — `crcbl-scene` depends on this crate —
#   and cargo refuses one; a dev-dependency cycle it allows, and this is why
#   the generator is an `[[example]]` rather than a `[[bin]]` (a bin cannot see
#   dev-dependencies, an example can);
# * so `cargo build -p crcbl-shaders` still pulls in nothing at all — `gltf`
#   included — which is the property the header comment above protects.
#
# `docs/plan/25-lod.md`'s "How a DAG reaches the renderer" is what this
# implements: the artifact is committed, `--check` regenerates and compares, and
# the consumer never sees the builder.
crcbl-scene = { workspace = true }
# `crcbl_scene::ClusterGroup::projected_error` takes a `glam::Vec3`, and the
# generator compares it against this crate's `[f32; 3]` spelling of the same
# metric. One conversion, in the one target that has to speak both — the library
# still names no vector type but its own arrays.
glam = { workspace = true }

# The DAG generator. `tools/` rather than `examples/` so it sits beside
# `compile-shaders.sh`, which is the other generator of a committed artifact in
# this crate and the arrangement this one copies.
[[example]]
name = "cook-clusters"
path = "tools/cook-clusters.rs"

# The split-sum table's generator, beside the DAG's and for the same reason: an
# artifact with no producer next to it is one nobody can regenerate. This one
# needs nothing but the crate itself.
[[example]]
name = "cook-dfg"
path = "tools/cook-dfg.rs"

# The sky prefilter table's generator, on `cook-dfg`'s terms: the other half of
# the split-sum, and the other table only one machine may bake.
[[example]]
name = "cook-sky-prefilter"
path = "tools/cook-sky-prefilter.rs"
