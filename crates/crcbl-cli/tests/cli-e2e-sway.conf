# sway configuration for the CLI scaffold's end-to-end suite.
#
# Nobody ever sees this window manager: sway runs on the wlroots `headless`
# backend with one virtual output and no input devices. `sway-session.sh` starts
# it; this file exists because sway refuses to start without one, and because
# two of its lines are load-bearing.

# One virtual output, deliberately *larger* than the window the template asks
# for, so a window that came back at the output's size would be visibly not the
# window it asked for.
output HEADLESS-1 {
    mode 1920x1080@60Hz
    position 0 0
}

# The generated project's window floats, for the reason
# `wayland-e2e-sway.conf` gives at more length: under sway's default tiling
# layout a lone window fills the output, and an assertion that the game opened
# at the size it asked for would pass for a game that asked for anything at all.
#
# `mygame` is the `app_id` the template bakes in — a bare name rather than
# reverse-DNS, because a scaffold cannot know a domain the author owns — and it
# is the project name `tests/cli_e2e.rs` scaffolds under.
for_window [app_id="mygame"] floating enable

# The template negotiates `xdg-decoration` and asks for server side. Zero-width
# borders keep the geometry sway configures equal to the geometry the suite
# asserts on.
default_border none
