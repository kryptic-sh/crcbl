[package]
name = "crcbl-cli"
description = "Crucible headless control CLI — the `crcbl` binary"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
# Not on crates.io: `editor` is a dependency, and the editor depends on the
# games whose scenes it edits, none of which publish. The binary ships through
# release archives and the package channels instead (`ci.yml`'s `build`).
publish = false

# The package is `crcbl-cli` so it does not collide with the `crcbl` umbrella
# library package; the shipped binary is still `crcbl`.
[[bin]]
name = "crcbl"
path = "src/main.rs"
# The binary shares its name with the umbrella *library* crate, so both would
# write `target/doc/crcbl/index.html` (rust-lang/cargo#6313). The library's docs
# are the ones worth publishing; the CLI documents itself through `--help`.
doc = false

# The `.deb` and `.rpm` that `ci.yml`'s `build` makes from the release binary.
# Their run-time dependencies are worked out from the binary's own links
# (cargo-deb's `$auto`, cargo-generate-rpm's `auto-req`), which is what puts
# ALSA in them; `install-packages` proves it by installing and running them.
[package.metadata.deb]
name = "crcbl"
maintainer = "mxaddict <mxaddict@kryptic.sh>"
copyright = "2026, mxaddict <mxaddict@kryptic.sh>"
extended-description = "crcbl: the Crucible engine's headless control CLI. Scaffolds, runs and builds a game project, renders screenshots offscreen, and reads and edits scenes, saves and settings."
section = "devel"
priority = "optional"
assets = [
  ["target/release/crcbl", "usr/bin/", "755"],
  ["../../README.md", "usr/share/doc/crcbl/README.md", "644"],
  ["../../LICENSE", "usr/share/doc/crcbl/LICENSE", "644"],
]

[package.metadata.generate-rpm]
name = "crcbl"
assets = [
  { source = "target/release/crcbl", dest = "/usr/bin/crcbl", mode = "755" },
  { source = "README.md", dest = "/usr/share/doc/crcbl/README.md", mode = "644", doc = true },
  { source = "LICENSE", dest = "/usr/share/licenses/crcbl/LICENSE", mode = "644", doc = true },
]

[features]
# The scaffold end-to-end suite: `crcbl new` → the project compiles → it runs
# headless. Off by default because it compiles a whole engine into a throwaway
# target directory; `tests/run-cli-e2e.sh` is the only thing that turns it on,
# and the tests are additionally `#[ignore]`d. Same shape as `crcbl-shell`'s
# `wayland-e2e` / `x11-e2e`, and for the same reason `docs/notes/process.md`
# gives: a plain `cargo nextest run` has to stay fast, and a silently-skipped
# e2e job is a known trap.
cli-e2e = []

[lints]
workspace = true

[dependencies]
# `parsed-font` because `crcbl screenshot` draws every golden scene, and
# `ui_text` is drawn in the committed parsed font. A native tool, so the size
# that feature costs a browser demo is nothing to it.
#
# `scene` for `crcbl scene` and `crcbl edit`: they edit through
# `crcbl::scene_edit`, which measures the glTF assets a scene's meshes name.
# The importer is already linked below for `lod` and `import`.
crcbl = { workspace = true, features = ["parsed-font", "scene"] }
crcbl-golden = { workspace = true }
# `profile report` reads the capture `crcbl::profile` writes; the format crate
# is the reader, and depends on nothing a GPU-free tool would not want.
crcbl-profile = { workspace = true }
# `load`, not `bake`: `crpix` reads PNGs and writes text, so it needs the
# decoder and nothing else. `bake` is the other direction — a `.crpix` out to a
# PNG plus an Aseprite sidecar — and no subcommand asks for it, so enabling it
# would link an encoder this binary never calls. `crcbl-golden` already brings
# `png` in for `screenshot`, so the feature costs no new crate either way.
crcbl-sprite = { workspace = true, features = ["load"] }
crcbl-store = { workspace = true }
# `lod` reads a glTF and builds its cluster DAG. `crcbl-scene` is the crate that
# owns both — the importer and `build_cluster_dag` — and the umbrella
# deliberately does not re-export it, because a *game* links neither; this is a
# bake tool and names it directly. `crcbl-assets` comes with it rather than
# through it: the importer takes an `AssetSource`, and `DirSource` is what a
# path typed on a command line becomes.
crcbl-assets = { workspace = true }
# `features = ["gltf"]` because the workspace entry turns that crate's defaults
# off — see the root `Cargo.toml`. This binary is the one that reads the source
# format, so it is the one that asks for the parser.
crcbl-scene = { workspace = true, features = ["gltf"] }
# The scene vocabulary `crcbl scene` opens a directory with:
# `crcbl_editor::scene::vocabulary`, the editor's own list — its greybox block,
# the engine's bodies and meshes, and the games whose scenes the workspace edits
# — rather than a second list here that could drift from it. The umbrella
# cannot hold that list, because every game depends on the umbrella. Decided
# 2026-10-04; `docs/backlog.md`'s `crcbl scene` entry has what a game's own
# vocabulary would take.
editor = { workspace = true }
crcbl-spawn = { workspace = true }

# `editor` is named through its `[lib]` name, `crcbl_editor`, and `cargo
# machete` matches a dependency by its package name, so it cannot see the use —
# the reason `apps/editor`'s manifest gives for the games it names.
[package.metadata.cargo-machete]
ignored = ["editor"]
