[package]
name = "crcbl-net"
description = "Crucible networking: transport seam and replication"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chacha20poly1305 = { workspace = true }
crcbl-core = { workspace = true }
hmac = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
x25519-dalek = { workspace = true }

[lints]
workspace = true

[features]
# `crcbl_net::conformance`: the checks `Transport`'s documentation promises,
# as functions any implementation can be run through. Test support for crates
# that implement a transport — `crcbl-steam` names it as a dev-dependency
# feature — and never needed by a game.
conformance = []

# The secret bytes behind each UDP connection's X25519 key pair, and the hello
# nonce, from the operating system. Native only, like `udp` itself: web builds
# have no networking (`docs/notes/simulation.md`), and `getrandom` does not
# build for `wasm32-unknown-unknown` without a backend nothing here wants. The
# seal, the packet layer and everything else in the crate still draw nothing.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
getrandom = { workspace = true }
