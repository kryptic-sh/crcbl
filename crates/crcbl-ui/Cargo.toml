[package]
name = "crcbl-ui"
description = "Crucible immediate-mode GUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
glam = { workspace = true }
bytemuck = { workspace = true }
# `ContactId` and `TouchPhase`, for the on-screen controls in `touch`. The
# vocabulary a finger arrives in belongs to the shell's seam, and a widget that
# invented its own copy would be a second answer to "which finger is this".
crcbl-core = { workspace = true }
# `Reflect`, `Value` and `get_path`/`set_path` for `tree::widgets::inspector` —
# UI rung 8's property panel. The arrow points this way
# because the panel is a widget and a widget needs `Ui`; the reverse would put
# blocks, spans and a stylesheet inside a crate whose whole charter is that a
# component can depend on it for free. It costs a browser build nothing new:
# `crcbl-reflect` takes `glam` (already here), `thiserror`, and a proc-macro
# crate built for the host. The exit criterion this crate is checked against is
# that it names no **renderer** (`docs/notes/tooling.md`'s UI rules say so in
# as many words), and `crcbl-reflect` sits below everything.
crcbl-reflect = { workspace = true }
# Flexbox layout for `tree`, through Taffy's low-level traits rather than its
# `TaffyTree` — UI section 2 in `docs/notes/tooling.md`, the user's decision of
# 2026-09-15. `flexbox` is the one layout mode the subset has; `taffy_tree` and
# `grid` stay off. `std` is load-bearing: with neither it nor `alloc`, Taffy
# swaps its vectors for fixed-capacity arrays (`util::sys`'s heapless fallback),
# which cap a node at 16 children and a flex container at 256 items.
# `content_size` measures each node's scrollable overflow, which is what clamps
# an `overflow: scroll` container's offset (`Layout::scroll_height`); it adds a
# field to the layout output and moves no box.
taffy = { version = "0.14.0", default-features = false, features = ["content_size", "flexbox", "std"] }
# CSS tokenizing and rule-block parsing for `style` — UI section 3 in
# `docs/notes/tooling.md`, the user's decision of 2026-09-15; selectors, values and the cascade
# are this crate's. Default features off: `fast_match_byte` and
# `fast_match_color` pull in two proc-macro crates (`cssparser-macros` and
# `phf_macros`, with `syn`) for speed-ups to a parser that runs once per sheet.
cssparser = { version = "0.38.0", default-features = false }
# Font parsing and hinted outlines for `font` — the UI's font rule in
# `docs/notes/tooling.md`, the user's decision of 2026-09-15. Rasterisation and the
# glyph atlas are this crate's. `read-fonts` comes with it and is reached as
# `skrifa::raw`, so the GPOS reader is always the version skrifa was built
# against. Default features off: `autohint_shaping` feeds the automatic hinter,
# and the committed font carries TrueType instructions the interpreter runs
# instead. `std` stays on, because the other float backend is `libm`. Behind
# the `parsed-font` feature below.
skrifa ={ version = "0.48.0", default-features = false, features = ["std"], optional = true }

[features]
# `crcbl_ui::font`'s parsed font: `skrifa`, the committed Atkinson Hyperlegible
# (`font::SANS_TTF`), `Font::sans`, `Font::parse` and `FontFamily::Sans` — the
# `sans-serif` a stylesheet names. **Off by default**, decided on
# 2026-09-25: linked unconditionally they cost every browser demo about 1 MB of
# wasm, 267 KB gzipped (puppet and sparks, measured 2026-09-27 with the feature
# on and off), whether or not it draws a single parsed glyph, and none of the
# samples does. An application that draws one turns it on, through `crcbl`'s
# `parsed-font`, which forwards here.
#
# Off, the parsed font cannot exist rather than being documented away: `Font`
# is uninhabited, so everything that takes one — layout, the glyph atlas,
# `DrawList::glyphs`, `Ui::register_font` — still compiles and can never be
# called; `Font::parse` returns `FontError::ParsedFontOff`; and a stylesheet
# naming `sans-serif` or `"Atkinson Hyperlegible"` is refused with a warning
# rather than drawn in the bitmap font.
parsed-font = ["dep:skrifa"]

[lints]
workspace = true
