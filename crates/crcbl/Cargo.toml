[package]
name = "crcbl"
description = "Crucible engine umbrella crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The umbrella exists so a *game* names one dependency, not four. It therefore
# depends on every crate a game needs at the current phase and re-exports them;
# it must never grow logic of its own beyond the engine-setup helpers
# `docs/plan/01-foundations.md`'s workspace layout allows it.
#
# `crcbl-vk` IS a dependency, and is deliberately **not** re-exported. P1.1
# added `src/backend.rs`, the GPU equivalent of `crcbl_shell::backend::open`:
# something has to depend on the backends or "try Vulkan, fall back" cannot be
# written at all, and `docs/plan/11-cli-headless.md`'s rule is about *samples*
# naming a backend, which `apps/sandbox` still does not. See that module's docs
# for the full argument, including why this should move to `crcbl-render` at
# P1.2. `log` and `thiserror` are the registry's own, and nothing else here uses
# them.
[dependencies]
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }
crcbl-render = { workspace = true }
crcbl-shaders = { workspace = true }
crcbl-shell = { workspace = true }
crcbl-ui = { workspace = true }
crcbl-wgpu = { workspace = true }
# The simulation half, added so a sample can stop naming them. Every one is a
# crate the four games already depended on by path; none of them depends on
# this crate, so the re-export introduces no cycle.
crcbl-audio = { workspace = true }
crcbl-client = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-input = { workspace = true }
crcbl-jobs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-server = { workspace = true }
crcbl-store = { workspace = true }
# `load`, not `bake`: this is the half a shipped game links, and it reads the
# baked pair rather than producing it. A build script wanting the encoder names
# `crcbl-sprite` itself — see `src/lib.rs`'s `sprite` re-export.
crcbl-sprite = { workspace = true, features = ["load"] }
# Re-exported alongside `crcbl-render` so a game writes camera and light maths
# in the same types the renderer takes, without a second workspace path.
glam = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# There is no Vulkan in a browser. `crcbl-vk` reaches `libvulkan.so.1` through
# `ash`, which reaches it through `libloading` — a crate that does not compile
# for `wasm32-unknown-unknown` at all, so an unconditional dependency here broke
# the wasm build of everything that names the umbrella (P5.6). Per-target
# dependency rather than a feature: the target is already known at build time,
# and a feature that must be remembered is a feature that will be forgotten.
# `src/backend.rs` gates the matching registry entry with the same `cfg`, so the
# browser's table contains only backends that exist.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crcbl-vk = { workspace = true }

# Metal, and only where Metal exists. `crcbl-mtl` is `#[cfg(target_os =
# "macos")]` from its crate root down and its `objc2-*` dependencies are pinned
# to the same target, so naming it unconditionally would compile to nothing
# everywhere else while still resolving the framework bindings; the per-target
# line says what is true instead. Same shape and same reason as `crcbl-vk`
# above, and `src/backend.rs` gates the matching registry entry with the same
# `cfg`.
#
# This is the wire-up `docs/backlog.md`'s "What MTL1 left open" entry deferred:
# it asked for the slice that gives the backend a device to hand back, and MTL2
# through MTL6 landed the device, the swapchain, pipelines, bind groups and
# draws. Registering it before that would have been a path that exists only to
# fail; not registering it now is macOS with no GPU at all.
[target.'cfg(target_os = "macos")'.dependencies]
crcbl-mtl = { workspace = true }

# `crcbl-golden` is a **dev**-dependency: the only reference to it from this
# crate is an intra-doc link in `screenshot.rs`, and rustdoc resolves those from
# dev-dependencies. As a normal dependency it linked `png` into every binary
# that names `crcbl` — and falsified `crcbl-golden`'s own manifest, which says
# "it reaches no shipped binary".
[dev-dependencies]
crcbl-golden = { workspace = true }

[lints]
workspace = true
