[package]
name = "crcbl"
description = "Crucible engine umbrella crate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# The umbrella exists so a *game* names one dependency, not four. It therefore
# depends on every crate a game needs at the current phase and re-exports them;
# it must never grow logic of its own beyond the engine-setup helpers
# `docs/plan/01-foundations.md`'s workspace layout allows it.
#
# `crcbl-vk` IS a dependency, and is deliberately **not** re-exported. P1.1
# added `src/backend.rs`, the GPU equivalent of `crcbl_shell::backend::open`:
# something has to depend on the backends or "try Vulkan, fall back" cannot be
# written at all, and `docs/plan/11-cli-headless.md`'s rule is about *samples*
# naming a backend, which `apps/sandbox` still does not. See that module's docs
# for the full argument, including why this should move to `crcbl-render` at
# P1.2. `log` and `thiserror` are the registry's own, and nothing else here uses
# them.
[dependencies]
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }
crcbl-render = { workspace = true }
crcbl-shaders = { workspace = true }
crcbl-shell = { workspace = true }
crcbl-ui = { workspace = true }
# The simulation half, added so a sample can stop naming them. Every one is a
# crate the four games already depended on by path; none of them depends on
# this crate, so the re-export introduces no cycle.
#
# `crcbl-assets` was a dev-dependency here — `tests/gltf_e2e.rs` needed a real
# `DirSource` — while `crcbl::scene::import_gltf` takes a `&dyn AssetSource`
# from it. That made the one entry point into the asset pipeline uncallable
# through the umbrella: a caller could name the function and could not name its
# argument. `apps/viewer` is what found it, which is what `apps/bare`'s docs say
# a sample is for.
crcbl-anim = { workspace = true }
crcbl-assets = { workspace = true }
crcbl-audio = { workspace = true }
crcbl-client = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-input = { workspace = true }
crcbl-jobs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-server = { workspace = true }
crcbl-store = { workspace = true }
# The bake half: glTF import, the meshlet builder and the cluster DAG, which is
# where the `MeshClusters` a `render::scene::Geometry::Flat` carries and the
# `ClusterDag` a `Geometry::Dag` carries actually come from. **Optional**, on
# `crcbl-sprite`'s terms below: it depends on `gltf`, and a browser build that
# describes no scene of its own should not link a glTF parser. See the `scene`
# feature and `src/lib.rs`'s `scene` re-export.
crcbl-scene = { workspace = true, optional = true }
# `load`, not `bake`: this is the half a shipped game links, and it reads the
# baked pair rather than producing it. A build script wanting the encoder names
# `crcbl-sprite` itself — see `src/lib.rs`'s `sprite` re-export.
crcbl-sprite = { workspace = true, features = ["load"] }
# Re-exported alongside `crcbl-render` so a game writes camera and light maths
# in the same types the renderer takes, without a second workspace path.
glam = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# The browser's GPU seam, and only where a browser is — and now the *only* GPU
# backend a browser build links. `crcbl-webgpu` is the wasm → JS
# command stream: pure encoding plus the three `__crcbl_web_gpu_*` entry points
# `web/engine/gpu-transport.js` drains once a frame. Per-target for the reason
# `crcbl-vk` below is — the target already says whether a browser is the host —
# and wasm32 rather than a feature because a native build has no
# `requestAnimationFrame` to drain it from and would link an ABI nothing can
# call.
#
# **This line is what puts the three symbols in every demo's `.wasm`**, and
# before it there was no such line: the crate was written, tested and unlinked,
# so `web/tools/check-exports.mjs` failed in both directions — three symbols
# declared in Rust and absent from the artifact, three the shim called and could
# not find. It is also `pub use`d as `crcbl::webgpu` in `src/lib.rs`; see that
# re-export for what each of the two is actually doing, which was measured
# rather than assumed.
[target.'cfg(target_arch = "wasm32")'.dependencies]
crcbl-webgpu = { workspace = true }

# There is no Vulkan in a browser. `crcbl-vk` reaches `libvulkan.so.1` through
# `ash`, which reaches it through `libloading` — a crate that does not compile
# for `wasm32-unknown-unknown` at all, so an unconditional dependency here broke
# the wasm build of everything that names the umbrella (P5.6). Per-target
# dependency rather than a feature: the target is already known at build time,
# and a feature that must be remembered is a feature that will be forgotten.
# `src/backend.rs` gates the matching registry entry with the same `cfg`, so the
# browser's table contains only backends that exist.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
crcbl-vk = { workspace = true }
# The PNG encoder behind `crcbl::args::Common::screenshot` — `--screenshot
# <PATH>`, which reads the frame a sample just presented back off the offscreen
# ring and writes it. Something in the *binary* has to encode it, so this is the
# one place `crcbl-golden` stops being test-only.
#
# Per-target rather than unconditional, on `crcbl-vk`'s argument above: a
# browser build has no argv to carry the flag and no file to write, so linking
# `png` into every demo's `.wasm` would buy nothing. That is also the whole of
# what the manifest note below used to be protecting — `crcbl-golden` reaching a
# *shipped* binary — and a browser demo is the shipped binary here.
crcbl-golden = { workspace = true }

# Metal, and only where Metal exists. `crcbl-mtl` is `#[cfg(target_os =
# "macos")]` from its crate root down and its `objc2-*` dependencies are pinned
# to the same target, so naming it unconditionally would compile to nothing
# everywhere else while still resolving the framework bindings; the per-target
# line says what is true instead. Same shape and same reason as `crcbl-vk`
# above, and `src/backend.rs` gates the matching registry entry with the same
# `cfg`.
#
# This is the wire-up `docs/backlog.md`'s "What MTL1 left open" entry deferred:
# it asked for the slice that gives the backend a device to hand back, and MTL2
# through MTL6 landed the device, the swapchain, pipelines, bind groups and
# draws. Registering it before that would have been a path that exists only to
# fail; not registering it now is macOS with no GPU at all.
[target.'cfg(target_os = "macos")'.dependencies]
crcbl-mtl = { workspace = true }

# Direct3D 12, and only where D3D12 exists. `crcbl-dx12` is `#[cfg(target_os =
# "windows")]` from its crate root down and pins `windows` to the same target,
# so the per-target line is the same shape and the same reason as `crcbl-mtl`
# above, with `src/backend.rs` gating the matching registry entry identically.
#
# Unlike Metal, this one is registered *beside* an existing backend rather than
# instead of nothing: Windows already reaches a GPU through `crcbl-vk`, so the
# entry is deliberately not auto-selectable and `CRCBL_GPU=dx12` is what asks
# for it. See `src/backend.rs`.
[target.'cfg(target_os = "windows")'.dependencies]
crcbl-dx12 = { workspace = true }

# `crcbl-golden` is **also** a dev-dependency, and the duplicate is load-bearing
# rather than sloppy: the normal dependency above is `cfg(not(wasm32))`, and the
# wasm32 job runs `cargo doc -D warnings` over this crate — where
# `screenshot.rs`'s intra-doc links to `crcbl_golden` would otherwise resolve to
# nothing. Dev-dependencies are visible to rustdoc on every target, so this line
# is what keeps those links alive on the one target the crate is not linked for.
[dev-dependencies]
crcbl-golden = { workspace = true }
# For `tests/tiling_e2e.rs`, which draws greybox floor quads under the physical
# tiling material to prove a 2 m surface shows twice the grid cells of a 1 m one.
# A dev-dependency because no shipped `crcbl` binary references the greybox pack.
crcbl-greybox = { workspace = true }
# `tests/gltf_e2e.rs` builds a `.glb` and imports it through the real
# `DirSource`, so it needs a real directory to put it in. The asset seam itself
# is an ordinary dependency above — see there.
tempfile = "3"
# That suite's texture is a PNG it encodes rather than a blob it vendors, on
# `crcbl-scene`'s `gltf_fixture` argument: a checked-in binary is a fixture
# nobody reviewing a change can read.
png = { workspace = true }

[lints]
workspace = true

[features]
# `tests/render_e2e.rs` — one frame of the cube scene through
# `ForwardRenderer`, on whichever backend `CRCBL_GPU` names, against a
# checked-in golden. Feature-gated *and* `#[ignore]`d, the same pair
# `crcbl-vk`'s `vk-e2e` and `crcbl-mtl`'s `mtl-e2e`
# use: a plain `cargo nextest run --workspace --all-features` on a machine with
# no GPU must stay green, and `tests/run-render-e2e.sh` is the only thing that
# turns it on — and it fails when the suite reports zero tests run.
#
# The gate it closes is `docs/backlog.md`'s "The render layer has only ever run
# on Vulkan and wgpu": until this existed, no Metal test had ever constructed a
# `ForwardRenderer`.
render-e2e = []

# `tests/hal_seam_e2e.rs` — `crcbl-hal`'s seam itself, on whichever backend
# `CRCBL_GPU` names. Gated and `#[ignore]`d for exactly the reason `render-e2e`
# above is, and driven by `tests/run-hal-seam-e2e.sh`.
#
# A feature of its own rather than a second suite under `render-e2e`, because
# the two answer different questions and are run separately: `render-e2e` draws
# the engine's own frames against checked-in goldens, this one holds every
# backend to the same HAL behaviour and commits no image. A single gate would
# mean a machine that can run one has to run both.
hal-seam-e2e = []

# `tests/draw_gen_e2e/` — the draw-generation cluster (the cull pass, its
# statistics ring, and the indirect arguments it feeds) on whichever backend
# `CRCBL_GPU` names, driven by `tests/run-draw-gen-e2e.sh`. Gated and
# `#[ignore]`d for exactly the reason `render-e2e` above is.
#
# The gate it closes is that these tests read **GPU-written buffers** back and
# compare them against a CPU oracle — a check no golden image can make — and
# until this existed they lived in `crates/crcbl-vk/tests/vk_e2e/` and ran on
# Vulkan alone. A third feature rather than a second suite under `render-e2e`
# for the reason `hal-seam-e2e` is a second: the three answer different
# questions and are run as separate steps, and one gate would mean a machine
# that can run one has to run all of them.
draw-gen-e2e = []

# `tests/forward_e2e/` — the forward pass's own state (the froxel grid and its
# overflow counter, the shadow atlas as depth, the reversed-Z convention and the
# reflectivity attachment) on whichever backend `CRCBL_GPU` names, driven by
# `tests/run-forward-e2e.sh`. Gated and `#[ignore]`d for exactly the reason
# `render-e2e` above is.
#
# The gate it closes is that every check in it reads something **no picture
# shows** — a counter, an atlas texel, a second colour target — and until this
# existed they lived in `crates/crcbl-vk/tests/vk_e2e/` and ran on Vulkan alone.
# A fourth feature rather than more of `draw-gen-e2e` because the two ask
# different questions and are separate CI steps: that suite checks what the cull
# and draw-argument passes computed, this one what the forward pass shaded and
# wrote. They share `tests/gpu_scene/harness.rs` and nothing else.
forward-e2e = []

# `tests/sprite_e2e/` — the sprite pass and the two generators in front of it
# (nine-slice and the shared menu) on whichever backend `CRCBL_GPU` names,
# driven by `tests/run-sprite-e2e.sh`. Gated and `#[ignore]`d for exactly the
# reason `render-e2e` above is.
#
# The gate it closes is that these are the only tests anywhere that **draw the
# sprite pass and read the frame back** — everything below them is a recorder
# assertion or float arithmetic over rectangles — and until this existed they
# lived in `crates/crcbl-vk/tests/vk_e2e/` and ran on Vulkan alone. Metal, D3D12
# and wgpu had no evidence that a single sprite quad landed anywhere.
#
# A fifth feature rather than more of `forward-e2e` for the reason that one is a
# fourth: they ask different questions and are separate CI steps. This suite
# builds no `ForwardRenderer` and no scene, pins its ring to `Rgba8UnormSrgb`
# because it commits images, and shares `tests/gpu_scene/harness.rs` with the
# other two and nothing else.
sprite-e2e = []

# `tests/mesh_e2e/` — the lit mesh through the render graph: its four goldens,
# the `Rgba16Float` scene target, the transient pool under a resize storm and
# the uniform level-of-detail cut, on whichever backend `CRCBL_GPU` names,
# driven by `tests/run-mesh-e2e.sh`. Gated and `#[ignore]`d for exactly the
# reason `render-e2e` above is.
#
# The gate it closes is the last of the five that lived in
# `crates/crcbl-vk/tests/vk_e2e/`, and the only one whose migration was a
# redesign: half of `vk_e2e/mesh.rs` opens a device demanding
# `Features::MESH_SHADER | Features::TASK_SHADER` and then asserts
# `GeometryPath::MeshShader` was selected, which no other backend can reach at
# all. Those tests stayed; what came here is everything that never named a path
# — including the two tests that were split so that each half asserts something
# true everywhere it runs.
#
# A sixth feature rather than more of `forward-e2e` for the reason that one is a
# fourth: they ask different questions and are separate CI steps. This suite
# owns the four mesh goldens (`tests/golden/mesh*.png`, moved out of
# `crates/crcbl-vk/tests/golden/`) and is the only one that asks the shared
# scene for the HDR target beside the swapchain image.
mesh-e2e = []

# `tests/windowed_e2e.rs` — the **windowed** swapchain, on a real X server and a
# real Vulkan WSI, driven by `tests/run-windowed-e2e.sh`. Gated and `#[ignore]`d
# for exactly the reason `render-e2e` above is.
#
# The gate it closes is that every GPU suite in this workspace creates a
# `SurfaceTarget::Offscreen` surface, and on `crcbl-vk` a null `VkSurfaceKHR` is
# the discriminator the whole backend branches on: the offscreen arms of
# `acquire_next_frame` and `present` return before `vkAcquireNextImageKHR` and
# `vkQueuePresentKHR` are ever called. So the acquire semaphores, the per-slot
# acquire fence, `VkPresentIdKHR`, the suboptimal flag, the `oldSwapchain`
# handoff and the extent clamp against *real* `VkSurfaceCapabilitiesKHR` were
# reached by no test at all — `tests/hal_seam_e2e.rs` says so in as many words.
#
# A seventh feature rather than more of `hal-seam-e2e` because the two cannot
# run on the same machines: that suite is the whole backend matrix on any GPU,
# this one needs an X server and is Vulkan-only by construction. It is also the
# only test target in the workspace that needs *both* halves of the join, which
# is why it is here — `crcbl-vk` and `crcbl-shell` deliberately do not depend on
# each other.
#
# **The forward is what makes the resize reachable.** `crcbl-shell`'s `Peer` test
# client is `#[cfg(all(target_os = "linux", feature = "x11-e2e"))]`, and driving
# a resize from outside is the whole of the `oldSwapchain` test; plain window
# creation and `surface_target` need no feature. Off Linux the forwarded feature
# selects nothing, exactly as it does in `crcbl-shell` itself.
windowed-e2e = ["crcbl-shell/x11-e2e"]

# `crcbl::scene` — `crcbl-scene`, the bake side: glTF import, `build_meshlets`
# and `build_cluster_dag`. **Off by default**, and the reason is the same one
# `crcbl-sprite` is linked as `load` and not `bake`: the crate depends on `gltf`,
# a parser a shipped game reads no bytes through and a browser build has no use
# for at all. An application that describes its own resident meshes turns it on
# and gets the builders whose output `render::scene::Geometry` is spelled in.
# `apps/lantern` is the one that does; every other sample leaves it off and links
# no glTF parser, which `cargo tree -p <sample> -e normal` is what says.
#
# `crcbl-scene/render` comes with it — `crcbl_scene::gltf_render`, the bridge
# from an imported document to a `SceneDesc` — because this crate already
# depends on `crcbl-render` unconditionally, so the only thing that feature adds
# to a build that has the umbrella is the module. Turning on the glTF importer
# and leaving out the one thing that renders what it imports would be a switch
# nobody wants either half of.
scene = ["dep:crcbl-scene", "crcbl-scene/render"]

# THERE IS NO `webgpu` FEATURE ANY MORE, AND ITS ABSENCE IS THE POINT.
#
# It existed to pick which of two browser backends `src/backend.rs`
# auto-selected on `wasm32`, while `crcbl-webgpu` was taking over from
# `crcbl-wgpu`. That crate was deleted on 2026-08-21, so a browser build has
# exactly one GPU backend and there is nothing left to pick:
# a feature whose every arm makes the same choice is a switch that reads as
# configuration and configures nothing. `crcbl-webgpu` is the wasm32 backend
# because the target says so, the same way `crcbl-vk` is the native one.
#
# `web/build.sh` and `web/run-render-harness-e2e.sh` used to pass
# `--features crcbl/webgpu`; both now build plainly.
