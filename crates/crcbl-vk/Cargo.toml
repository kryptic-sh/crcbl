[package]
name = "crcbl-vk"
description = "Crucible Vulkan backend (ash) implementing the HAL seam"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# `ash` is the only binding in the engine and this is the only crate allowed to
# name it (`docs/plan/01-foundations.md` §1.3). Nothing above the seam may learn
# a Vulkan type, which is why `crcbl-hal` has no `ash` entry and never will.
[dependencies]
ash = { workspace = true }
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# Test-only. `crcbl-shaders` supplies the SPIR-V and the geometry the triangle
# and golden-image suites render; `crcbl-golden` is the comparator. Neither
# reaches a shipped binary — a backend must not depend on the engine's shaders,
# and this crate does not.
#
# `crcbl-render` is a dev-dependency for the same reason: the only honest way to
# test a render graph against a real driver is to run the *real* graph, not a
# second one that resembles it. The dependency direction stays clean — nothing
# `crcbl-vk` ships depends on anything above the seam — and it is the reason the
# backend registry deliberately did **not** move into `crcbl-render` at P1.3;
# see that crate's docs.
[dev-dependencies]
crcbl-golden = { workspace = true }
crcbl-render = { workspace = true }
crcbl-shaders = { workspace = true }
# The reversed-Z control: the suite builds a *conventional* projection matrix to
# compare against, which `crcbl-render` deliberately has no constructor for.
glam = { workspace = true }

[features]
# The suite in `tests/vk_e2e/main.rs`, which needs a real Vulkan implementation.
# Feature-gated *and* `#[ignore]`d, exactly like `crcbl-shell`'s two
# window-system suites: a plain `cargo nextest run --all-features` on a machine
# with no loader must stay green, and `tests/run-vk-e2e.sh` is the only thing
# that turns them on — and it fails when the suite reports zero tests run.
vk-e2e = []

[lints]
workspace = true
