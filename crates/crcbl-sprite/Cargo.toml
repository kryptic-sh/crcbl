[package]
name = "crcbl-sprite"
description = "Crucible sprite sheets: frames, animation clips and nine-slice"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# **No GPU, and no image codec unless you ask for one.** The default build is
# the *description* of a sprite sheet plus the `.crpix` parser: no dependencies
# at all, so anything can depend on it. `bake` adds the half a build script
# wants — PNG encoding and the Aseprite sidecar — and is off by default so a
# runtime consumer does not link an encoder it will never call.
[features]
bake = ["dep:png"]

[dependencies]
png = { workspace = true, optional = true }

[lints]
workspace = true

# The spec test decodes the PNG it just encoded, so it needs the codec whatever
# the feature set — `dev-dependencies` cannot be optional.
[dev-dependencies]
png = { workspace = true }
