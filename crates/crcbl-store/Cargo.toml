[package]
name = "crcbl-store"
description = "Crucible persistence: saves, settings, profiles"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crcbl-core = { workspace = true }
crcbl-net = { workspace = true }
# For `save`'s checksum. `crcbl-shaders` is dependency-free and already carries
# a NIST-vector-tested SHA-256 (`crcbl_shaders::sha256`); duplicating it here
# would mean two implementations to keep correct.
crcbl-shaders = { workspace = true }
serde = { workspace = true }
toml = { workspace = true }
dirs = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
