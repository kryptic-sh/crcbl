[package]
name = "crcbl-audio"
description = "Crucible audio: mixer and spatial cue grammar"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

# One unconditional dependency, and it is the workspace's own. The DSP core
# (mixer, voices, spatial cue grammar, WAV/QOA decoders) is pure `f32` block
# processing with nothing under it, which is what `docs/plan/13-audio.md` means
# by "pure-DSP core, platform seam at the device edge", and it stays that way.
#
# `src/synth.rs`'s noise generator is the exception: it needs a *deterministic*
# white-noise sequence, and `crcbl_core::rand` is where this engine's splitmix64
# lives. Transcribing five lines of it here instead would be the same
# duplicated-knowledge bug the synth module exists to remove — two copies of one
# mixing function, drifting silently, with nothing to say which sound is right.
#
# **This crate's wasm graph is no longer third-party-free**: `crcbl-core` brings
# `bitflags`, `glam` and `log`. Every one of those is already in the graph of
# every binary that links this crate — a game links `crcbl-render` and
# `crcbl-phys` too — so the cost is paid only by a standalone consumer, of which
# there are none. The earlier comment claimed zero, and it was true when written.
[dependencies]
crcbl-core = { workspace = true }

# The native device backend. Target-gated rather than unconditional because the
# browser's output is `src/web.rs` and cpal has no place in it: cpal 0.18 *does*
# build for `wasm32-unknown-unknown`, but only by pulling `wasm-bindgen`,
# `js-sys`, `web-sys` and `futures-util` into the wasm graph to drive an
# AudioWorklet of its own — a second answer to the question this crate's `web`
# module already answers, and the exact framework dependency
# `docs/plan/15-windowing.md` rejects for the shell. Gating it keeps the wasm
# build graph at *zero* third-party crates.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.1"
