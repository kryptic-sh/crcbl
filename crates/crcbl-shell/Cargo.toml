[package]
name = "crcbl-shell"
description = "Crucible windowing shell: own Wayland, X11, Web/canvas and headless backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Still tiny. `crcbl-core` supplies handles, the input vocabulary and
# `SurfaceTarget`; `bitflags` and `thiserror` are vocabulary; `log` is how
# backend selection and a lost compositor connection explain themselves.
#
# There is deliberately **no** `wayland-client`, `wayland-sys`,
# `wayland-scanner` or `smithay-client-toolkit`: `docs/plan/15-windowing.md`
# accepts thin bindings to an ABI the driver forces on us and rejects
# frameworks that own policy. libwayland-client is reached through hand-written
# `extern "C"` declarations in `src/wayland/ffi.rs`, loaded with `dlopen` (see
# that module for why not `#[link]`), and the protocol layer above it is
# generated at build time from the vendored XML.
[dependencies]
bitflags = { workspace = true }
crcbl-core = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

# Build-time only: turns `wayland-protocols/*.xml` into `wl_interface` tables,
# request wrappers and event decoders. A workspace crate rather than a module in
# `build.rs` so its output can be unit-tested against `wayland-scanner`'s — see
# its own docs.
[build-dependencies]
crcbl-wl-scanner = { workspace = true }

# Types a key into another process's window under the same compositor, which is
# the only way to reach a running sample's `F11` handler. `required-features`
# keeps it out of every ordinary build, and `tests/bin/` keeps it out of Cargo's
# auto-discovery — a `tests/*.rs` file would also become an integration test
# target with nothing in it.
[[bin]]
name = "crcbl-e2e-key"
path = "tests/bin/send_key.rs"
required-features = ["wayland-e2e"]

# The X11 counterpart, and separate rather than one binary with a flag: the two
# reach a running game by different mechanisms — a virtual seat device against
# a compositor, `XTEST` against a server — and each is gated behind its own
# feature so a build with one backend's suite on does not compile the other's.
[[bin]]
name = "crcbl-e2e-x11-key"
path = "tests/bin/send_key_x11.rs"
required-features = ["x11-e2e"]

# The Windows key and mouse sender, and it is a separate process for a reason
# neither Linux one has: `SendInput` injects into the *session's* input stream
# and the stream follows the foreground window. A test that called it would be
# typing at its own window from its own thread, which is the one arrangement
# that proves nothing about the message queue — the in-crate suite already
# reaches the window procedure with `SendMessageW`, and the whole point of this
# binary is to be somewhere else.
[[bin]]
name = "crcbl-e2e-win32-input"
path = "tests/bin/send_input_win32.rs"
required-features = ["win32-e2e"]

# The other half of the same argument, for the clipboard. Win32's clipboard is
# *content*, not ownership: `SetClipboardData` hands the bytes to the window
# station and the shell keeps nothing. Only a second process can tell that claim
# apart from a shell that answers its own reads out of a cache, so this one
# writes and reads the real desktop clipboard with no `crcbl-shell` in it.
#
# Separate from the sender above rather than one binary with a subcommand, on
# the same grounds as the two Linux senders: the two reach the desktop by
# different mechanisms — an injected input stream, a window-station clipboard —
# and a helper that did both would be linked into a test that needs one.
[[bin]]
name = "crcbl-e2e-win32-clip"
path = "tests/bin/clipboard_peer_win32.rs"
required-features = ["win32-e2e"]

# The one target in this crate that owns its `main`, because `libtest` always
# runs a test body on a thread it spawns and AppKit is main-thread-only — it
# *raises* rather than failing, and an Objective-C exception unwinding into Rust
# is undefined behaviour. So no `#[test]` can drive an AppKit window, and
# without this target the window lifecycle has no executable coverage at all.
# See the file's own docs; `nextest` runs a harness-less target as one test, so
# the existing macOS job picks it up with no workflow change.
#
# Not feature-gated, and it runs on every host: off macOS it prints why it did
# nothing rather than reporting a pass it did not earn.
[[test]]
name = "appkit_session"
path = "tests/appkit_session.rs"
harness = false

[features]
# The nested-compositor end-to-end suite. Off by default so a plain
# `cargo nextest run` on a machine with no compositor stays green; CI enables it
# in a job that launches headless sway. `docs/plan/12-testing.md` calls the
# silently-skipped variant a known trap, so the tests are additionally
# `#[ignore]`d and the harness asserts that a non-zero number of them ran.
wayland-e2e = []

# The Xvfb end-to-end suite, on the same terms and for the same reasons: off by
# default so a plain `cargo nextest run` on a machine with no display stays
# green, and `tests/run-x11-e2e.sh` is the only thing that turns it on.
x11-e2e = []

# The Win32 end-to-end suite (P5C W4), on exactly the same terms: off by
# default, the tests additionally `#[ignore]`d, and `tests/run-win32-e2e.ps1`
# the only thing that turns them on — which is also what asserts that a non-zero
# number of them ran.
#
# What is different is that **there is nothing to start**. The two Linux
# harnesses are shell scripts because a compositor or an X server has to be
# launched, polled for and torn down; a `windows-latest` runner already has a
# desktop, so the runner here is nextest plus the count check and nothing else.
win32-e2e = []

[lints]
workspace = true
