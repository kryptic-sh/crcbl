[package]
name = "crcbl-shell"
description = "Crucible windowing shell: own Wayland and X11 backends"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Deliberately tiny, like `crcbl-hal`. This crate is a seam: `libwayland-client`
# and `libxcb` arrive with their backends at P0.5/P0.6 and must not appear here,
# and nothing in this slice opens a socket. `crcbl-core` supplies handles, the
# input vocabulary and `SurfaceTarget`; `bitflags` and `thiserror` are
# vocabulary; `log` is how backend selection explains itself.
[dependencies]
bitflags = { workspace = true }
crcbl-core = { workspace = true }
log = { workspace = true }
thiserror = { workspace = true }

[lints]
workspace = true
