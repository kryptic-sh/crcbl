# sway configuration for the Wayland end-to-end suite.
#
# Nobody ever sees this window manager: sway runs on the wlroots `headless`
# backend with one virtual output and no input devices. The file exists because
# sway refuses to start without one, and because three of its lines are
# load-bearing for the tests.

# One virtual output, at a size and refresh rate the tests assert on. `mode`
# also fixes what a borderless window must resize to.
output HEADLESS-1 {
    mode 1920x1080@60Hz
    position 0 0
}

# No mouse exists on the headless backend, and P0.5a has no `wl_seat` anyway.
focus_follows_mouse no

# Server-side decorations would eat part of the client area and make the
# windowed size depend on sway's theme rather than on the protocol. P0.5a does
# not negotiate `xdg-decoration` (that is P0.5b), so this keeps the geometry
# the tests see equal to the geometry the compositor configured.
default_border none

# The window under test floats. Under sway's default tiling layout a lone
# window fills the output, which would make "windowed" and "borderless" the same
# size — and a fullscreen test that cannot fail is worse than no test.
for_window [app_id="sh.kryptic.crcbl.e2e"] floating enable
