# sway configuration for the Wayland end-to-end suite.
#
# Nobody ever sees this window manager: sway runs on the wlroots `headless`
# backend with one virtual output and no input devices. The file exists because
# sway refuses to start without one, and because three of its lines are
# load-bearing for the tests.

# Two virtual outputs, at sizes, positions and a refresh rate the tests assert
# on. `mode` also fixes what a borderless window must resize to.
#
# **The second one is not decoration.** `DisplayMode::Borderless` carries a
# `monitor` field, and with one output every value of it — `None`, and the only
# id there is — produces the same window at the same size, so a backend that
# ignored the field outright would pass. The second output is deliberately a
# *different* size from the first, so "the compositor honoured the output hint"
# and "the compositor put it wherever it liked" are different assertions.
output HEADLESS-1 {
    mode 1920x1080@60Hz
    position 0 0
}

output HEADLESS-2 {
    mode 1280x720@60Hz
    position 1920 0
}

# **Which output a window opens on is the focused workspace's**, and sway focuses
# the output it saw last — which is the second one. Without this every test that
# asserts a fullscreen extent would be asserting against 1280x720, and the
# borderless tests would have quietly started measuring the wrong display. Pin a
# workspace to each output and end on the first, so "the output" means
# HEADLESS-1 everywhere except where a test names the other one.
workspace 1 output HEADLESS-1
workspace 2 output HEADLESS-2
workspace 1

# No physical mouse exists on the headless backend. The input tests create a
# `zwlr_virtual_pointer_v1` instead, and this keeps a stray pointer motion from
# stealing focus between windows in the multi-window test.
focus_follows_mouse no

# The backend negotiates `xdg-decoration` and asks for server side, so sway
# draws this window's decorations. Zero-width borders keep the geometry the
# tests assert on equal to the geometry the compositor configured, while still
# leaving sway's per-window `border` field a usable signal: it reads `csd` only
# when a client decorates itself, which is what
# `server_side_decorations_are_negotiated_rather_than_assumed` checks.
default_border none

# The window under test floats. Under sway's default tiling layout a lone
# window fills the output, which would make "windowed" and "borderless" the same
# size — and a fullscreen test that cannot fail is worse than no test.
for_window [app_id="sh.kryptic.crcbl.e2e"] floating enable

# The same rule, and the same reason, for the sandbox: the harness runs it
# windowed and again with `--fullscreen` and asserts the extent it reports, so a
# tiled sandbox would report the output size for both.
for_window [app_id="sh.kryptic.crcbl.sandbox"] floating enable
