[package]
name = "crcbl-render"
description = "Crucible renderer: render graph, frame loop, meshes, materials"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

# Everything here is **above the seam**: `crcbl-hal` and nothing below it. There
# is no `ash`, no `crcbl-vk` and no `#[cfg(target_os = …)]` in this crate, which
# is `docs/plan/01-foundations.md` §1.3's rule — the render graph is named there
# as living above the seam rather than in it.
[dependencies]
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }
# The camera's projection matrices, and nothing else. §1.1 already lists glam as
# a workspace dependency for exactly this.
glam = { workspace = true }
# `crcbl-shaders` hands out `&[u32]` and entry-point names and depends on
# nothing at all, so the forward pass can name the engine's own shaders without
# this crate learning a backend.
crcbl-shaders = { workspace = true }
# The sprite pass needs `SampleMode` and nothing else, but taking it from here
# rather than re-declaring it is what stops a caller mapping one two-variant
# enum onto another at every call site. This is not a dependency inversion:
# `crcbl-sprite` depends on *nothing* (an optional `png` behind `bake`/`load`
# and no workspace crate at all), and its own module docs already name this
# crate as the one that "turn[s] a description into pixels".
#
# `load` is on because [`menu`] reads back the sheets `build.rs` bakes: the menu
# art is shipped *by this crate* rather than by each sample, so the decoder that
# used to be a game's business is now this crate's. It is the same `png` the
# samples already enable, so nothing new reaches a binary that did not have it.
crcbl-sprite = { workspace = true, features = ["load"] }
crcbl-ui = { workspace = true }
# [`features`]'s per-effect toggles, which are `crcbl_hal::Features`' shape one
# level up: a set of independent switches with union, intersection and
# difference over them, which is what topic 39's resolution order is written in.
# Already the workspace's, and already what `crcbl-hal` spells its capability
# flags with, so this crate learns no new pattern.
bitflags = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }

# The other half, and the other feature. Cargo resolves build-dependency
# features separately from normal ones, so `bake`'s PNG encoder reaches the
# build script and not the renderer.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
