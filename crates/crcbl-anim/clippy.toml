# The simulation's determinism rule, as a lint, as `crates/crcbl-phys/clippy.toml`
# has it for the solver: no platform transcendental in `crcbl-anim` either.
# glibc, Apple's libm, the MSVC runtime and the browser each round `sin`,
# `atan2`, `pow` and the rest in their own way. Two paths here are simulation
# state: the angular velocity a ragdoll handoff starts with
# (`RagdollBinding::motion_from_previous_pose`, in `f64`), which took the
# platform's `atan2` through `DQuat::to_scaled_axis` until 2026-11-01, and the
# state machine's stepping (in `f32`), which `src/machine.rs` documents as
# deterministic because it calls no transcendental at all. Use
# `crcbl_core::trig` for an angle.
#
# Pose evaluation is the exception the crate docs declare: client presentation,
# `f32`, through glam's `Quat::slerp`. glam's `f32` methods are not listed for
# that reason; a call to one on a simulation path is caught by review, not by
# this file. A call that must stay says so with
# `#[expect(clippy::disallowed_methods, reason = ...)]`. Clippy reads this file
# from the crate's own directory, so it binds this crate and no other.
disallowed-methods = [
  { path = "f64::sin", reason = "platform sine; use crcbl_core::trig::sin" },
  { path = "f64::cos", reason = "platform cosine; use crcbl_core::trig::cos" },
  { path = "f64::sin_cos", reason = "platform sine and cosine; use crcbl_core::trig" },
  { path = "f64::tan", reason = "platform transcendental; construct it from crcbl_core::trig" },
  { path = "f64::asin", reason = "platform transcendental" },
  { path = "f64::acos", reason = "platform transcendental" },
  { path = "f64::atan", reason = "platform transcendental" },
  { path = "f64::atan2", reason = "platform transcendental" },
