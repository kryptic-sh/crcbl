[package]
name = "crcbl-dx12"
description = "Crucible Direct3D 12 backend — Windows"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
crcbl-hal = { workspace = true }

# The generational `Pool` every resource table is built on, and the `Handle` the
# seam's resource handles already are. Target-gated beside `windows` because off
# Windows this crate has no code to hold a pool.
[target.'cfg(target_os = "windows")'.dependencies.crcbl-core]
workspace = true

# The Win32 bindings, and only on the platform that has the ABI behind them.
# `docs/plan/09-backends-metal-dx12.md`'s FFI correction is the rule this
# satisfies: *bindings, not frameworks* — `windows-rs` is a thin binding to an
# ABI the OS requires, in the same class as `ash` and `objc2`, and this is the
# only crate in the workspace that may name it directly.
#
# Pinning it here rather than in the workspace table is what keeps the crate
# building on Linux, macOS and wasm32 at all: off Windows the whole backend is
# `#[cfg]`-ed out and this is neither fetched nor built.
#
# **Naming it adds features to the build graph, not a crate.** `windows` 0.62 is
# already in this workspace's lockfile on Windows — `wgpu-hal`, `gpu-allocator`
# and `cpal` all resolve it — so what this line buys is the three feature gates
# below, and what `default-features = false` buys is not silently widening the
# set those crates resolved for themselves. `std` is the crate's own default and
# is kept: `windows_core::Error` carries a `String` message.
#
# Each feature is here because one call needs it, not because it looked related:
#
# * `Win32_Graphics_Dxgi` is enumeration itself — `CreateDXGIFactory2`,
#   `IDXGIFactory4` (which is where `EnumWarpAdapter` lives, and the reason the
#   version is 4 rather than 1), `IDXGIAdapter1::GetDesc1`, the
#   `DXGI_ADAPTER_DESC1` it fills in, `DXGI_ADAPTER_FLAG_SOFTWARE`, the
#   `DXGI_ERROR_NOT_FOUND` that ends the enumeration loop, and `IDXGIDevice`,
#   whose IID is the key `CheckInterfaceSupport` answers the driver version for.
# * `Win32_Graphics_Direct3D12` is every capability answer: `D3D12CreateDevice`,
#   `ID3D12Device::CheckFeatureSupport`, the three `D3D12_FEATURE_DATA_*`
#   structs this backend reads, `D3D12_RESOURCE_BINDING_TIER`,
#   `D3D_SHADER_MODEL` (which the bindings put in this module rather than in
#   `Direct3D`), and the `D3D12_REQ_*`/`D3D12_CS_*` constants `Limits` is filled
#   from.
# * `Win32_Graphics_Direct3D` is `D3D_FEATURE_LEVEL`. Not optional beside the
#   above: `D3D12CreateDevice` takes one, and the binding gates the whole
#   function on this feature.
# * `Win32_Graphics_Dxgi_Common` is `DXGI_FORMAT` and `DXGI_SAMPLE_DESC`, which
#   `crcbl_dx12::conv`'s format table produces and `D3D12_RESOURCE_DESC` carries.
#   The binding gates far more than the type on it: `CreateCommittedResource`,
#   `CreateShaderResourceView`, `CreateUnorderedAccessView`,
#   `CreateRenderTargetView`, `CreateDepthStencilView` and
#   `D3D12_FEATURE_DATA_FORMAT_SUPPORT` — the BC-format query — are each
#   `#[cfg]`-ed on it, so the resource half of the seam is unreachable without
#   it.
# * `Win32_Foundation` is the `HANDLE` an `ID3D12Fence` wait is armed with, plus
#   the `CloseHandle` that releases it, the `WAIT_OBJECT_0` that says the wait
#   was satisfied, and the `E_OUTOFMEMORY` that separates an allocation failure
#   from a descriptor bug. Reached transitively by every feature above, and named
#   anyway because this crate calls into it directly.
# * `Win32_System_Threading` is `CreateEventW`, `WaitForSingleObject` and
#   `INFINITE` — `Device::wait_idle`'s event. It is an event rather than
#   `SetEventOnCompletion`'s documented null-handle block because
#   `WaitForSingleObject` reports which way it returned, and a `wait_idle` that
#   silently did not wait is worse than none.
# * `Win32_Security` is `SECURITY_ATTRIBUTES`, `CreateEventW`'s first parameter.
#   This crate passes `None` for it and never names the type; the binding gates
#   the whole function on the feature, the same way `Win32_Graphics_Direct3D`
#   above is required by `D3D12CreateDevice`'s feature-level argument.
# * `Win32_UI_WindowsAndMessaging` is `GetClientRect`, which is where
#   `Instance::surface_caps`'s `current_extent` comes from — DXGI has no query
#   for a window's size, so the answer comes from the window manager or from
#   nowhere. The same feature carries `CreateWindowExW`/`DestroyWindow`, which
#   this crate's swapchain tests use to make a real `HWND` to present to; that
#   is a second caller and not the reason the feature is here.
#
# A slice that needs more adds it here.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62.2", default-features = false, features = [
  "std",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D12",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Security",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

# The committed DXIL, and the triangle geometry the shader that reads it
# declares. Test-only and workspace-internal, exactly as `crcbl-mtl` takes it for
# the same test: the artifacts this backend consumes have to come from the crate
# that produced them, or the test would draw a triangle the engine does not ship.
[dev-dependencies]
crcbl-shaders = { workspace = true }

[lints]
workspace = true
