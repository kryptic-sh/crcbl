[package]
name = "crcbl-image"
description = "Crucible image assets: decode, convert and resize to straight RGBA8"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# **CPU only, and no codec unless you ask for one.** The default build is the
# image type, the raw-buffer conversions and the resize: what turns pixels an
# application was handed (a tray's ARGB32, a notification's `image-data`, a
# Windows DIB) into what `crcbl_ui::image::ImageAtlas::register` takes. Each
# file format is a feature, so lyr and pikr link only the decoders they call.
# No GPU, shell or UI dependency: decoding runs on whatever thread the caller
# likes, and only the finished pixels need cross to the one that draws.
[features]
# Windows bitmaps, decoded by this crate's own code.
bmp = []
# Windows icons and cursors: a directory of frames, each a PNG or a bitmap.
ico = ["bmp", "png"]
# Baseline and progressive JPEG, decoded by this crate's own code.
jpeg = []
png = ["dep:png"]
# SVG icons rendered to RGBA by this crate's own renderer and rasteriser:
# the subset icon themes use, and a decode error for anything outside it. An
# `<image>` embedding a PNG, JPEG or WebP draws when that format's feature is
# on as well, and is refused by name when it is not.
svg = []
# Text in SVG icons: `<text>` and `<tspan>` drawn in the system's fonts,
# found through `crcbl-font`, shaped by `harfrust` in bidi runs resolved by
# `unicode-bidi`, and outlined through `skrifa`. Without it, text that would
# draw a character is refused by name, as anything else the renderer does
# not draw is.
svg-text = ["svg", "dep:crcbl-font", "dep:skrifa", "dep:harfrust", "dep:unicode-bidi"]
# Lossless WebP and its container, decoded by this crate's own code.
webp = []
# X PixMaps, XPM 3 and XPM 2, decoded by this crate's own code.
xpm = []
# The freedesktop.org icon-theme lookup: a name, a size and a scale to a file.
# Filesystem work only, no decoding, so it needs no codec.
theme = []

[dependencies]
# PNG through the crate the workspace already uses for it (`crcbl-sprite`,
# `crcbl-golden`, `crcbl-scene`). Every other format this crate grows is
# written here: the owner's direction of 2026-10-16, recorded in
# `docs/backlog.md` under S28.
png = { workspace = true, optional = true }
thiserror = { workspace = true }
# SVG text's fonts: the system's, through the workspace's lookup crate, and
# their outlines and metrics through the font reader `crcbl-ui` and
# `crcbl-font` already share.
crcbl-font = { workspace = true, optional = true }
skrifa = { workspace = true, optional = true }
# SVG text's shaping and bidi: the shaper and the UAX #9 levels `crcbl-ui`
# lays its own text out with.
harfrust = { workspace = true, optional = true }
unicode-bidi = { workspace = true, optional = true }

[lints]
workspace = true

# The real-theme measurement of the SVG renderer against resvg's output; its
# module docs say how to run it.
[[example]]
name = "svg_corpus"
required-features = ["svg", "png"]
