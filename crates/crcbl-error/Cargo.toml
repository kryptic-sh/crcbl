[package]
name = "crcbl-error"
description = "Crucible's `#[derive(Error)]`: `Display`, `Error` and `From` for an error type, from its `#[error]` messages"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# The derive every error type in the workspace uses, in place of `thiserror`,
# with `thiserror`'s attribute syntax so a crate moves over by changing the
# derive's path and its manifest line. It has no runtime half: everything the
# expansion names is in `core`, so a crate needs nothing beside it, and a
# `proc-macro = true` crate is host-compiled, so a browser build of its
# dependent reaches none of this.
[lib]
proc-macro = true

# The proc-macro trio, as `crcbl-reflect-derive` takes it and for the same
# reasons: all three are already in every build, so naming them adds no crate
# to `Cargo.lock`, and `syn` stays at the 3.x line the workspace resolves.
[dependencies]
# The parser. Default features only, so no `full`: the expression grammar is
# not compiled in, which is why `src/fmt.rs` rewrites a message's extra
# arguments as tokens rather than as parsed expressions.
syn = { workspace = true }
# Writing the expansion, and `quote_spanned!` so a field that is not an error,
# or not `Display`, is a compile error at that field.
quote = { workspace = true }
# `TokenStream` and the token trees `src/fmt.rs` walks.
proc-macro2 = { workspace = true }

[lints]
workspace = true
