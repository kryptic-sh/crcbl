[package]
name = "crcbl-hal"
description = "Crucible graphics HAL: backend seam traits and POD descriptors"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Deliberately tiny. This crate is a seam: it must not gain `ash`, `wgpu`, or
# any other backend dependency, and nothing here allocates GPU memory or opens a
# window. `crcbl-core` supplies handles and `SurfaceTarget`; `bitflags` is
# vocabulary; `crcbl-error` is the workspace's error derive.
[dependencies]
bitflags = { workspace = true }
crcbl-core = { workspace = true }
crcbl-error = { workspace = true }

[lints]
workspace = true
