[package]
name = "crcbl-mtl"
description = "Crucible Metal backend — macOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# `Handle` and `Pool` — the generational side tables every backend keeps its
# driver objects in, and the mechanism that turns use-after-destroy into a
# lookup failure instead of an alias. `crcbl-vk` and the null backend take the
# same dependency for the same reason.
crcbl-core = { workspace = true }
crcbl-hal = { workspace = true }

# Test-only, and for one thing: the pipeline tests compile the engine's *own*
# `msl/triangle.metal` into an `MTLLibrary` and look its entry points up by
# name, which is the check that the committed MSL artifact and the entry-point
# names `spirv/manifest.txt` records agree on a real Metal compiler.
#
# The dependency direction stays clean — nothing this crate ships depends on the
# engine's shaders, exactly as `crcbl-vk` states for the identical
# dev-dependency.
[dev-dependencies]
crcbl-shaders = { workspace = true }

# The Objective-C bindings, and only on the platform that has the framework
# behind them. `docs/plan/09-backends-metal-dx12.md`'s FFI correction is the
# rule they satisfy: *bindings, not frameworks* — `objc2` is a thin binding to
# an ABI the OS requires, in the same class as `ash` and `windows-rs`, and this
# is the only crate in the workspace that may name it.
#
# Pinning them here rather than in the workspace table is what keeps the crate
# building on Linux, Windows and wasm32 at all: off macOS the whole backend is
# `#[cfg]`-ed out and none of these are fetched or built.
#
# Both framework crates are per-item feature-gated and their defaults are "all
# of it" — `objc2-metal`'s default set is over ninety features covering every
# encoder, pipeline and MTL4 type. Enabling only the ones this crate names keeps
# the macOS build honest about what the backend actually touches, and stops this
# crate widening the feature set `wgpu-hal` (which also depends on
# `objc2-metal`, and also opts out of the defaults) resolved for itself.
#
# `MTLDevice` brings the protocol, `MTLCopyAllDevices`, `MTLGPUFamily`,
# `MTLArgumentBuffersTier` and `MTLDeviceLocation`; `MTLTypes` is what makes
# `maxThreadsPerThreadgroup` — an `MTLSize` — exist. `objc2-foundation` is here
# for `NSProcessInfo`, `NSString` (every `setLabel:` takes one), `NSRange` (the
# level and slice ranges a texture view is cut with) and `NSEnumerator` for
# iterating the `NSArray` that enumeration returns. `NSError` and `NSDictionary`
# are what `crcbl_mtl::fault` reads a failed command buffer's `userInfo`
# through, which is where Metal puts the per-encoder fault report and nowhere
# else. Both are already on transitively — `MTLCommandBuffer` and `MTLLibrary`
# below pull them in — and are named anyway, because a feature this crate's own
# `use` lines depend on is one a dependency must not be able to drop from
# under it.
#
# MTL2 — the device and its resources — adds the rest of this list, and every
# entry is here because one call needs it, not because it looked related:
#
# * `MTLCommandQueue` for `newCommandQueue`, and `MTLCommandBuffer` because
#   `wait_idle` commits an empty one and waits on it.
# * `MTLAllocation` + `MTLResource` are the two protocols `MTLBuffer` and
#   `MTLTexture` inherit from, and `MTLResource` is also where
#   `MTLStorageMode`, `MTLCPUCacheMode` and `MTLResourceOptions` live.
# * `MTLBuffer`, `MTLTexture`, `MTLSampler` for the three resource kinds and
#   their descriptors; `MTLPixelFormat` for the format table.
# * `MTLDepthStencil` for `MTLCompareFunction`, which is what a comparison
#   sampler's `compareFunction` takes — the type lives with depth/stencil state
#   in Metal even though a sampler is the only thing this slice puts it on.
#
# MTL3 — command encoding, submission and readback — adds five more:
#
# * `MTLCommandEncoder` is the base protocol every encoder inherits, and the one
#   `endEncoding`, `pushDebugGroup:` and `insertDebugSignpost:` live on. Both
#   encoder features below are `cfg`-gated on it upstream, so it is not
#   optional.
# * `MTLBlitCommandEncoder` for every copy and fill: `copyFromBuffer:…`,
#   `copyFromTexture:…` and `fillBuffer:range:value:`.
# * `MTLRenderCommandEncoder` for the pass a clear happens inside, and for
#   `setScissorRect:`/`setViewport:`.
# * `MTLRenderPass` for `MTLRenderPassDescriptor` and the `MTLLoadAction`,
#   `MTLStoreAction` and `MTLClearColor` the attachment table maps onto.
# * `MTLEvent` for `MTLSharedEvent`, which is the seam's timeline semaphore, and
#   for the plain `MTLEvent` a binary one becomes.
#
# MTL4 — MSL shader modules, pipelines and the triangle — adds three:
#
# * `MTLLibrary` for `MTLLibrary` itself (what
#   `newLibraryWithSource:options:error:` returns), `MTLFunction` (what
#   `newFunctionWithName:` returns) and `MTLCompileOptions`, which the source
#   compile takes as `None`. `MTLRenderPipelineDescriptor`'s function setters
#   are `cfg`-gated on it upstream, so it is not optional.
# * `MTLRenderPipeline` for `MTLRenderPipelineDescriptor`,
#   `MTLRenderPipelineState`, the colour-attachment array, and the
#   `MTLBlendFactor`, `MTLBlendOperation` and `MTLColorWriteMask` the blend
#   table maps onto.
# * `MTLComputePipeline` for `MTLComputePipelineDescriptor` and
#   `MTLComputePipelineState`.
#
# The rasteriser enums this slice also maps — `MTLPrimitiveType`, `MTLCullMode`,
# `MTLWinding`, `MTLTriangleFillMode`, `MTLDepthClipMode` — live in
# `MTLRenderCommandEncoder`, and `MTLStencilDescriptor`/`MTLStencilOperation` in
# `MTLDepthStencil`; both were already on. `MTLPipelineOption` is in `MTLDevice`.
#
# The dispatch slice adds exactly one:
#
# * `MTLComputeCommandEncoder` for the encoder a compute pass now opens:
#   `MTLCommandBuffer::computeCommandEncoder` is `cfg`-gated on it upstream, as
#   are `setComputePipelineState:`, the three argument-table setters
#   `crcbl_mtl::binding`'s `apply_compute` calls, and both
#   `dispatchThreadgroups:` forms.
#
# MTL6 — bind groups, indexed draws and the indirect loop — adds exactly one:
#
# * `MTLArgument` is where the Metal headers put `MTLIndexType`, which is what
#   `drawIndexedPrimitives:…` and its indirect sibling take. Every indexed-draw
#   method upstream is `cfg`-gated on it, so it is not optional. The reflection
#   types that live beside it (`MTLBinding`, `MTLBufferBinding`) are **not**
#   used: `crcbl_mtl::binding` explains why reflection cannot answer the one
#   question a bind group would want it for.
#
# Nothing else was needed, and that is the argument-table decision showing up in
# the manifest: `MTLIndirectCommandBuffer`, `MTLArgumentEncoder`, `MTLHeap` and
# `MTLFence` are all absent because `crcbl_mtl::binding` binds argument-table
# slots directly, which Metal makes resident and hazard-tracks by itself.
#
# MTL5 — the `CAMetalLayer` swapchain — adds one feature here and two crates
# below:
#
# * `MTLDrawable` for the `MTLDrawable` protocol a `CAMetalDrawable` inherits
#   from, and for `MTLCommandBuffer::presentDrawable:` — which is `cfg`-gated on
#   it upstream, so it is not optional. `crcbl_mtl::swapchain` argues there why
#   a present is a command buffer rather than `MTLDrawable::present`.
#
# `MTLCounters` was deliberately absent until the counter probe, and it is
# **present now for a measurement rather than for a feature**. Query sets still
# refuse — `crcbl_mtl::device`'s `create_query_set` says why, and nothing this
# crate ships creates an `MTLCounterSampleBuffer`. What needs the feature is
# `crcbl_mtl::adapter`'s
# `a_device_reports_its_counter_sampling_gpu_families_and_timestamp_correlation`:
# `MTLDevice::counterSets` is `cfg`-gated on `MTLCounters` upstream, and the
# `MTLCommonCounterSetTimestamp` / `…StageUtilization` / `…Statistic` names it
# compares each set against live in the same module. `supportsCounterSampling:`
# and `MTLCounterSamplingPoint` are **not** gated on it — both are declared in
# `MTLDevice` — so it is the counter-set half alone that this buys.
#
# It adds no package to `Cargo.lock`. The feature's whole dependency list is
# `objc2-foundation` features (`NSArray`, `NSData`, `NSError`, `NSObject`,
# `NSRange`, `NSString`), of which only `NSData` and `NSObject` are new here and
# neither pulls a crate — `NSData` wants `bitflags`, which `NSArray` already
# switched on.
#
# `MTLIndirectCommandBuffer` is here on the same terms, and the terms matter
# because the type it names is the one `crcbl_mtl::command`'s `indirect_count`
# refuses over. **Nothing this crate ships creates an ICB.** The refusal is
# unchanged, `Features::DRAW_INDIRECT_COUNT` is still off, and
# `crcbl_hal::METAL_NO_DRAW_INDIRECT_COUNT` still names the compute kernel that
# would have to encode one. What needs the feature is `crcbl_mtl::adapter`'s
# `a_device_reports_its_indirect_command_buffer_support_and_draw_indirect_count_ceiling`,
# which measures whether the runner CI has could verify that slice at all if it
# were written: `MTLDevice::newIndirectCommandBufferWithDescriptor:
# maxCommandCount:options:` is `cfg`-gated on it upstream — together with
# `MTLAllocation` and `MTLResource`, both long since on — and so are
# `MTLIndirectCommandBufferDescriptor`, `MTLIndirectCommandType` and the
# `MTLIndirectCommandBuffer` protocol whose `size` the probe reads.
#
# It adds no package to `Cargo.lock` either. The feature's whole dependency list
# is `bitflags`, `objc2-foundation/NSObject` and `objc2-foundation/NSRange`, and
# all three were already switched on — the first two by `MTLCounters` above, the
# third by this crate's own `NSRange` entry.
#
# `MTLIndirectCommandEncoder` is the feature that entry said "the slice that
# encodes adds", and this is that slice — **still without shipping anything that
# encodes**. `crcbl_mtl::command`'s `indirect_count` refuses exactly as before,
# `Features::DRAW_INDIRECT_COUNT` is off, and nothing outside `#[cfg(test)]`
# names an ICB. What needs the feature is `crcbl_mtl::device`'s
# `an_indirect_command_buffer_executes_the_triangle_the_direct_draw_paints`,
# which closes the measurement caveat the probe above left open: creation
# succeeding is not execution succeeding, and the only way to tell them apart is
# to draw through an ICB and read the texels back.
#
# `MTLIndirectCommandBuffer::indirectRenderCommandAtIndex:` is `cfg`-gated on it
# upstream, and so is the `MTLIndirectRenderCommand` protocol the returned
# command is — which is where `setRenderPipelineState:` and the indirect
# `drawPrimitives:…` the test encodes live.
#
# It adds nothing to `Cargo.lock` at all: the feature's dependency list upstream
# is **empty**, so it switches on no crate and no other feature.
#
# `MTLVertexDescriptor` stays absent — this engine has no vertex input state at
# all, by design, and enabling it would advertise a path `crcbl_hal::pipeline`
# deliberately does not have.
#
# A slice that needs more adds it here.
#
# # The two crates MTL5 adds, and why they are not a widening
#
# `CAMetalLayer` is a **Core Animation** class, not a Metal one, so the
# `SurfaceTarget::AppKit` pointer cannot be typed at all without
# `objc2-quartz-core`; and its `drawableSize` is a `CGSize`, which lives in
# `objc2-core-foundation`. Both are the same one-binding-per-ABI family
# `docs/plan/09-backends-metal-dx12.md`'s FFI correction already sanctions for
# `objc2-metal`, both are pinned to macOS beside it, and both were **already in
# this workspace's lockfile** — `wgpu-hal` resolves them for `crcbl-wgpu` — so
# naming them here adds features to the build graph and not crates.
#
# The alternative was hand-rolled `msg_send!` against a raw pointer, which is
# the same FFI with the type checking taken out.
[target.'cfg(target_os = "macos")'.dependencies]
# The Objective-C block ABI, and the same class of binding as `objc2` itself —
# `objc2` and `block2` are one project and are versioned together. It is named
# here for exactly one call: `MTLDrawable::addPresentedHandler:` takes a block,
# and that callback is the *whole* of present feedback on Metal, so
# `Features::PRESENT_FEEDBACK` cannot be reported without it. `objc2-metal`
# types the parameter as a `block2::DynBlock` and re-exports nothing, so a
# direct dependency is the only way to build the value it asks for.
#
# It adds no package to `Cargo.lock`: `block2` was already resolved there
# through another consumer of `objc2-metal`, and the lock gained only this
# crate's edge to it.
block2 = { version = "0.6.2", default-features = false, features = ["std"] }
objc2 = "0.6.4"
# `CGSize`, and only `CGSize`: `CAMetalLayer::setDrawableSize:` is how the seam's
# extent obligation is discharged, and `drawableSize` is how `current_extent` is
# answered. `CFCGTypes` is the feature the geometry types live behind; `objc2` is
# what gives them their `Encode` impls, without which they cannot cross a message
# send at all.
objc2-core-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "CFCGTypes",
  "objc2",
] }
objc2-foundation = { version = "0.3.2", default-features = false, features = [
  "std",
  "NSArray",
  "NSDictionary",
  "NSEnumerator",
  "NSError",
  "NSProcessInfo",
  "NSRange",
  "NSString",
] }
objc2-metal = { version = "0.3.2", default-features = false, features = [
  "std",
  # `MTLDrawable::addPresentedHandler:` takes a block, and the whole of Metal's
  # present feedback is that one callback — so this feature is what makes
  # `Features::PRESENT_FEEDBACK` reportable at all. It adds no crate to the
  # lockfile: `block2` is already there, because `objc2-metal` is in the graph
  # more than once and something else had already switched it on.
  "block2",
  "MTLAllocation",
  "MTLArgument",
  "MTLBlitCommandEncoder",
  "MTLBuffer",
  "MTLCommandBuffer",
  "MTLCommandEncoder",
  "MTLCommandQueue",
  "MTLComputeCommandEncoder",
  "MTLComputePipeline",
  "MTLCounters",
  "MTLDepthStencil",
  "MTLDevice",
  "MTLDrawable",
  "MTLEvent",
  # `MTLBuffer::gpuAddress` and the `MTLGPUAddress` alias it returns, which is
  # how a Metal 3 argument buffer is written: a table of 64-bit device addresses
  # the CPU stores directly. `crcbl_mtl::binding`'s
  # `a_kernel_reads_four_buffers_through_an_unbounded_argument_buffer_array`
  # is the only caller, and it measures whether that shape works at all before
  # any of it is designed against. The feature is `MTLGPUAddress = []` upstream
  # — a bare type alias — so it adds nothing to the lockfile.
  "MTLGPUAddress",
  "MTLIndirectCommandBuffer",
  "MTLIndirectCommandEncoder",
  "MTLLibrary",
  "MTLPixelFormat",
  "MTLRenderPipeline",
  "MTLRenderCommandEncoder",
  "MTLRenderPass",
  "MTLResource",
  "MTLSampler",
  "MTLTexture",
  "MTLTypes",
] }
# `CAMetalLayer` and `CAMetalDrawable`. `CALayer` is not optional beside them —
# `CAMetalLayer` is declared as a subclass of it, so the type does not exist
# without it — and it is also where `setOpaque:` lives, which is how
# `CompositeAlpha::Opaque` is honoured. The two `objc2-*` features name the
# optional dependencies that make the Metal-facing and geometry-facing halves of
# the class exist: without them `nextDrawable`, `setDevice:`, `setPixelFormat:`
# and `drawableSize` are all absent.
objc2-quartz-core = { version = "0.3.2", default-features = false, features = [
  "std",
  "CALayer",
  "CAMetalLayer",
  "objc2-core-foundation",
  "objc2-metal",
] }

[lints]
workspace = true

[features]
# The tests that make the GPU execute a shader program, which the `macos-latest`
# runner cannot do: its `Apple Paravirtual device` hangs the command buffer with
# both encoders reporting `completed`, so the fault is the device rather than the
# command stream. Feature-gated *and* `#[ignore]`d, exactly like `crcbl-vk`'s
# `vk-e2e` and `crcbl-wgpu`'s `wgpu-e2e`: a plain
# `cargo nextest run --workspace --all-features` on a machine without a real
# Metal GPU must stay green, and `tests/run-mtl-e2e.sh` is the only thing that
# turns these on — and it fails when the suite reports zero tests run.
#
# Unlike Vulkan there is no software rasteriser to substitute (no lavapipe for
# Metal), so what this gates is a genuine coverage gap; `docs/backlog.md` says so
# rather than implying CI covers it.
mtl-e2e = []
