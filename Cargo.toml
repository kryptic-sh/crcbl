[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/crcbl"

# Shared dependency versions. Add a crate here only in the slice that first uses
# it — `ash`, `objc2`, `windows-rs` and friends land with their backends.
[workspace.dependencies]
# The one sanctioned binding, per the HAL rules in `docs/notes/backends.md`:
# `crcbl-vk` is the only crate that may name it. Default features keep
# `loaded`, which is `Entry::load()` — a `dlopen` of `libvulkan.so.1` at
# runtime rather than a `DT_NEEDED` on it. The `linked` feature is deliberately
# NOT enabled; see `crates/crcbl-vk/src/lib.rs` for the argument, which is the
# same one `crcbl-shell` makes for libwayland-client and libxcb.
ash = "0.38"
bitflags = "2.9"
glam = "0.33"
# glTF 2.0 import (`crcbl-scene`). `default-features = false` is load-bearing,
# and is the shape `bevy_gltf` uses for the same crate: the default `import`
# feature does blocking `std::fs` reads, which bypasses `crcbl_assets::
# AssetSource` and cannot work in a browser, and it pulls in `image` — a second
# image decoder beside the PNG path `crcbl-sprite` already has. `utils` is the
# accessor readers (`Primitive::reader`), which is the whole reason to use the
# crate rather than the JSON; `names` is what lets a skipped primitive be
# reported by the name its author gave it.
#
# **One `KHR_*` extension feature is on, and the rule is unchanged**: an
# extension nothing reads is a field nothing reads, and
# `KHR_materials_emissive_strength` is now read.
# `crcbl_shaders::mesh::GpuMaterial::emissive` is a linear radiance rather than
# glTF's factor-and-strength pair, so the importer needs the multiplier to
# produce it — without the feature, `Material::emissive_strength` does not
# compile and every emissive above one is silently clamped to the factor.
gltf = { version = "1.4.1", default-features = false, features = [
  "KHR_materials_emissive_strength",
  "names",
  "utils",
] }
# Entropy for `crcbl-server`'s resume tokens. Deliberately featureless here:
# the browser backend (`wasm_js`, i.e. `crypto.getRandomValues` via `js-sys`)
# is enabled from `crates/crcbl-server/Cargo.toml`'s `cfg(target_arch =
# "wasm32")` section instead, because enabling it in this table would enable it
# for native too and put `wasm-bindgen` in every binary that links a server.
getrandom = "0.4.3"
log = "0.4"
# Golden-image I/O for `crcbl-golden`; see that crate's manifest for why it is
# a dependency rather than a hand-rolled encoder.
png = "0.18"
proptest = "1.9"
# The proc-macro trio, behind `crcbl-reflect-derive` and nothing else. Added by
# the slice that first needs to read a type's fields at compile time —
# `#[derive(Reflect)]`, for `docs/plan/08-editor.md`'s property panel — and every
# one of them was already in `Cargo.lock` transitively, under `thiserror`,
# `serde` and `bytemuck`. `syn` is pinned to the 3.x line the workspace already
# resolves rather than the 2.x `deny.toml` skips as a transitive leftover, so no
# second copy joins the tree. Default features throughout: `syn`'s `full` — the
# expression grammar — is not on, because the derive parses attributes and
# writes an impl and nothing else.
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.5"
# Randomness seam (`crcbl-rand`). `rand_chacha` is the portable ChaCha PRNG
# (ChaCha8 for the deterministic `Rng`, ChaCha20 for the wasm entropy CSPRNG);
# `rand_core` is the `RngCore`/`SeedableRng` traits it plugs into. Pinned to the
# 0.9 line the workspace already resolves transitively (via `rand`/`proptest`),
# so this adds no second copy for `cargo deny`'s multiple-versions ban. Featured
# minimally: `rand_core` keeps `os_rng` OFF so nothing drags `getrandom` onto
# wasm32, which is the whole point of the seam.
rand_chacha = { version = "0.9", default-features = false }
rand_core = { version = "0.9", default-features = false }
# RON, the format `docs/plan/06-assets-scenes.md` and
# `docs/plan/18-render-features.md` write entity and render-stack data in.
# Approved 2026-08-30 as a user decision recorded in `docs/backlog.md`, and
# added here by the slice that first reads a file: `crcbl_render::stack`, the
# per-camera render stack. Default features are `std` alone; what a deterministic
# writer needs — `ron::ser::PrettyConfig` with a fixed struct order and stable
# float formatting — is in the base crate, which is why nothing here is hand
# rolled.
ron = "0.12.2"
thiserror = "2.0"
# Storage and persistence: serde for settings/save schemas, toml for settings
# files, dirs for platform-standard config/data paths.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "7.0"

# Internal crates are pinned here too, so a member never spells out a path more
# than once and the dependency direction is readable from one place. The
# redundant-looking `version` is load-bearing: `cargo deny check bans` treats a
# bare `{ path = … }` as a wildcard dependency and fails the build.
crcbl = { path = "crates/crcbl", version = "0.1.0" }
crcbl-core = { path = "crates/crcbl-core", version = "0.1.0" }
crcbl-golden = { path = "crates/crcbl-golden", version = "0.1.0" }
# `default-features = false`, which is the 3D half of the pack: the primitives,
# the materials and the grid page, without the `.crpix` sprites and the sheet
# loader its `bake` feature carries. Neither consumer wants those —
# `crcbl`'s `tiling_e2e` draws quads and `crcbl`'s optional `greybox` re-export
# is for blocking a map out — and the switch has to be here rather than on the
# member, because cargo refuses a member that turns off a default the workspace
# entry left on.
crcbl-greybox = { path = "crates/crcbl-greybox", version = "0.1.0", default-features = false }
crcbl-hal = { path = "crates/crcbl-hal", version = "0.1.0" }
crcbl-render = { path = "crates/crcbl-render", version = "0.1.0" }
crcbl-shaders = { path = "crates/crcbl-shaders", version = "0.1.0" }
crcbl-shell = { path = "crates/crcbl-shell", version = "0.1.0" }
crcbl-sprite = { path = "crates/crcbl-sprite", version = "0.1.0" }
crcbl-client = { path = "crates/crcbl-client", version = "0.1.0" }
crcbl-ecs = { path = "crates/crcbl-ecs", version = "0.1.0" }
crcbl-net = { path = "crates/crcbl-net", version = "0.1.0" }
crcbl-phys = { path = "crates/crcbl-phys", version = "0.1.0" }
crcbl-rand = { path = "crates/crcbl-rand", version = "0.1.0" }
crcbl-server = { path = "crates/crcbl-server", version = "0.1.0" }
crcbl-dx12 = { path = "crates/crcbl-dx12", version = "0.1.0" }
crcbl-mtl = { path = "crates/crcbl-mtl", version = "0.1.0" }
crcbl-vk = { path = "crates/crcbl-vk", version = "0.1.0" }
crcbl-webgpu = { path = "crates/crcbl-webgpu", version = "0.1.0" }
crcbl-input = { path = "crates/crcbl-input", version = "0.1.0" }
crcbl-jobs = { path = "crates/crcbl-jobs", version = "0.1.0" }
crcbl-wl-scanner = { path = "crates/crcbl-wl-scanner", version = "0.1.0" }
crcbl-store = { path = "crates/crcbl-store", version = "0.1.0" }
crcbl-audio = { path = "crates/crcbl-audio", version = "0.1.0" }
# Steamworks over the SDK's flat C API, loaded at runtime — see
# `docs/notes/backends.md`. Only the umbrella's `steam` feature names it.
crcbl-steam = { path = "crates/crcbl-steam", version = "0.1.0" }
crcbl-assets = { path = "crates/crcbl-assets", version = "0.1.0" }
crcbl-ui = { path = "crates/crcbl-ui", version = "0.1.0" }
# `default-features = false`, which turns the `gltf` feature off: what a member
# gets by naming this crate is the half that reads no source format — the
# meshlet builder, the simplifier, the LOD chain, the cluster DAG, and `scn`,
# the engine's own scene directory. A member that wants the glTF importer asks
# for it (`features = ["gltf"]`), which `crcbl-cli` does and `crcbl`'s `scene`
# feature does. The switch has to be here rather than on the member, for the
# reason `crcbl-greybox` above gives: cargo silently ignores a member that turns
# off a default the workspace entry left on.
crcbl-scene = { path = "crates/crcbl-scene", version = "0.1.0", default-features = false }
crcbl-anim = { path = "crates/crcbl-anim", version = "0.1.0" }
# The particle simulation. Depends on `glam` alone, so the arrow into it costs
# a browser build nothing beyond the simulation itself — there is no renderer,
# no shader and no asset parser in it, by design.
crcbl-vfx = { path = "crates/crcbl-vfx", version = "0.1.0" }
# Bodies of water and their medium, as data: `docs/plan/55-water.md`'s first
# decision. Depends on `thiserror` alone, so the renderer, the physics world and
# a server that draws nothing can all read one body.
crcbl-water = { path = "crates/crcbl-water", version = "0.1.0" }
# The wind field: `docs/plan/56-wind.md`'s two authored layers, the weather over
# them and the one formula every consumer samples with. The arrow into
# `crcbl-phys` is that document's decision 6 — physics declares `WindQuery` and
# this crate implements it, so the crate with the bodies in it does not link the
# crate with the weather in it.
crcbl-wind = { path = "crates/crcbl-wind", version = "0.1.0" }
# The grid-inventory kit: the container primitive, the item catalogue and the
# placement rules, headless. `serde`, `ron` and `thiserror` and nothing else —
# no `glam` and no `crcbl-core` — so the arrow into it costs a browser build
# the simulation and no more, and the server and the client can link the same
# placement code without agreeing on a renderer.
crcbl-inventory = { path = "crates/crcbl-inventory", version = "0.1.0" }
# The console registry: the variable and command vocabulary the UI, the engine
# and the CLI all speak. It depends on nothing but `core`/`std`, so the arrow
# into it costs every target the same nothing — see that crate's own manifest.
crcbl-console = { path = "crates/crcbl-console", version = "0.1.0" }
# The field description an editor's property panel reads, and the derive that
# writes it. Two crates because a `proc-macro = true` crate can export nothing
# but macros; the trait half depends on `glam` and `thiserror` alone, so the
# arrow into it from a component costs a browser build the description and no
# more, and the macro half is host-compiled and reaches no target at all. See
# `docs/plan/07-ui-debug.md`'s rung 8 for what reads it.
crcbl-reflect = { path = "crates/crcbl-reflect", version = "0.1.0" }
crcbl-reflect-derive = { path = "crates/crcbl-reflect-derive", version = "0.1.0" }
# The golden suites' shared fixture, `apps/crcbl-sample-test`. A path-only
# workspace member like every crate above, and a `[dev-dependencies]` entry
# wherever it is named — see that crate's own manifest for why it is under
# `apps/` rather than beside `crcbl-golden`.
crcbl-sample-test = { path = "apps/crcbl-sample-test", version = "0.1.0" }
# **The two samples another member names, and only as dev-dependencies.**
# `apps/editor`'s `tests/vocabularies.rs` opens both of their committed scenes
# through `crcbl::registry`, which is what says a tool opens *any* registered
# scene rather than the one game it was built against. Nothing in this table
# reaches a shipped binary from a sample: `cargo tree -p editor -e normal` names
# neither. See `apps/editor/Cargo.toml`.
breakout = { path = "apps/breakout", version = "0.1.0" }
puppet = { path = "apps/puppet", version = "0.1.0" }
bytemuck = { version = "1", features = ["derive"] }

[workspace.lints.rust]
# Groups need a lower priority than the individual lints beside them, otherwise
# Cargo cannot order them (clippy::lint_groups_priority).
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
