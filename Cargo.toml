[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

# `apps/editor` is intentionally absent until the editor phase — there is
# nothing to put in it yet, and an empty bin crate would only slow every build.

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/kryptic-sh/crcbl"

# Shared dependency versions. Add a crate here only in the slice that first uses
# it — `wgpu`, `objc2`, `windows-rs` and friends land with their backends.
[workspace.dependencies]
# The one sanctioned binding, per `docs/plan/01-foundations.md` §1.1 and
# §1.3: `crcbl-vk` is the only crate that may name it. Default features keep
# `loaded`, which is `Entry::load()` — a `dlopen` of `libvulkan.so.1` at
# runtime rather than a `DT_NEEDED` on it. The `linked` feature is deliberately
# NOT enabled; see `crates/crcbl-vk/src/lib.rs` for the argument, which is the
# same one `crcbl-shell` makes for libwayland-client and libxcb.
ash = "0.38"
bitflags = "2.9"
glam = "0.33"
# glTF 2.0 import (`crcbl-scene`). `default-features = false` is load-bearing,
# and is the shape `bevy_gltf` uses for the same crate: the default `import`
# feature does blocking `std::fs` reads, which bypasses `crcbl_assets::
# AssetSource` and cannot work in a browser, and it pulls in `image` — a second
# image decoder beside the PNG path `crcbl-sprite` already has. `utils` is the
# accessor readers (`Primitive::reader`), which is the whole reason to use the
# crate rather than the JSON; `names` is what lets a skipped primitive be
# reported by the name its author gave it. None of the `KHR_*` extension
# features are on: an extension nothing reads is a field nothing reads.
gltf = { version = "1.4.1", default-features = false, features = [
  "names",
  "utils",
] }
# Entropy for `crcbl-server`'s resume tokens. Deliberately featureless here:
# the browser backend (`wasm_js`, i.e. `crypto.getRandomValues` via `js-sys`)
# is enabled from `crates/crcbl-server/Cargo.toml`'s `cfg(target_arch =
# "wasm32")` section instead, because enabling it in this table would enable it
# for native too and put `wasm-bindgen` in every binary that links a server.
getrandom = "0.4.3"
log = "0.4"
# Golden-image I/O for `crcbl-golden`; see that crate's manifest for why it is
# a dependency rather than a hand-rolled encoder.
png = "0.18"
proptest = "1.9"
thiserror = "2.0"
# Storage and persistence: serde for settings/save schemas, toml for settings
# files, dirs for platform-standard config/data paths.
serde = { version = "1", features = ["derive"] }
toml = "1.1"
dirs = "6.0"

# Internal crates are pinned here too, so a member never spells out a path more
# than once and the dependency direction is readable from one place. The
# redundant-looking `version` is load-bearing: `cargo deny check bans` treats a
# bare `{ path = … }` as a wildcard dependency and fails the build.
crcbl = { path = "crates/crcbl", version = "0.1.0" }
crcbl-core = { path = "crates/crcbl-core", version = "0.1.0" }
crcbl-golden = { path = "crates/crcbl-golden", version = "0.1.0" }
crcbl-hal = { path = "crates/crcbl-hal", version = "0.1.0" }
crcbl-render = { path = "crates/crcbl-render", version = "0.1.0" }
crcbl-shaders = { path = "crates/crcbl-shaders", version = "0.1.0" }
crcbl-shell = { path = "crates/crcbl-shell", version = "0.1.0" }
crcbl-sprite = { path = "crates/crcbl-sprite", version = "0.1.0" }
crcbl-client = { path = "crates/crcbl-client", version = "0.1.0" }
crcbl-ecs = { path = "crates/crcbl-ecs", version = "0.1.0" }
crcbl-net = { path = "crates/crcbl-net", version = "0.1.0" }
crcbl-phys = { path = "crates/crcbl-phys", version = "0.1.0" }
crcbl-server = { path = "crates/crcbl-server", version = "0.1.0" }
crcbl-dx12 = { path = "crates/crcbl-dx12", version = "0.1.0" }
crcbl-mtl = { path = "crates/crcbl-mtl", version = "0.1.0" }
crcbl-vk = { path = "crates/crcbl-vk", version = "0.1.0" }
crcbl-wgpu = { path = "crates/crcbl-wgpu", version = "0.1.0" }
crcbl-input = { path = "crates/crcbl-input", version = "0.1.0" }
crcbl-jobs = { path = "crates/crcbl-jobs", version = "0.1.0" }
crcbl-wl-scanner = { path = "crates/crcbl-wl-scanner", version = "0.1.0" }
crcbl-store = { path = "crates/crcbl-store", version = "0.1.0" }
crcbl-audio = { path = "crates/crcbl-audio", version = "0.1.0" }
crcbl-assets = { path = "crates/crcbl-assets", version = "0.1.0" }
crcbl-ui = { path = "crates/crcbl-ui", version = "0.1.0" }
crcbl-scene = { path = "crates/crcbl-scene", version = "0.1.0" }
bytemuck = { version = "1", features = ["derive"] }

[workspace.lints.rust]
# Groups need a lower priority than the individual lints beside them, otherwise
# Cargo cannot order them (clippy::lint_groups_priority).
rust_2018_idioms = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
