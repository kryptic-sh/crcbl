name: Install apt packages, retrying a mirror that stops answering
description: >-
  Installs Debian packages with `apt-get`, retrying an attempt that fails *or
  hangs*. Every linux job here needs something from apt — the ALSA headers
  `cpal` links against, sway, the Vulkan loader — and a runner whose mirror goes
  quiet should cost a retry, not a whole board. The downloaded `.deb` files are
  cached, so a mirror that is down cannot stop a job whose packages were fetched
  on an earlier run.

inputs:
  packages:
    description: Space-separated package names.
    required: true

runs:
  using: composite
  steps:
    # WHY A CACHE, AND WHY IT IS NOT JUST SPEED. Five jobs in one session failed
    # here on `the runner's mirror is unreachable` — markdown-only commits among
    # them. The retry below turns a hang into a legible failure, which is worth
    # having, but it cannot conjure packages out of a mirror that is not
    # answering. The archive can: `apt-get` is told to keep what it downloads,
    # the `.deb` files are cached, and a later run installs from disk without
    # asking the network at all.
    #
    # Keyed on the package list, so two jobs wanting different sets do not fight
    # over one entry, and on the runner image, because a `.deb` built for one
    # release is not the one another release resolves to. `restore-keys` is
    # deliberately absent for the same reason — a near-miss here is a wrong
    # package set, not a slightly stale one.
    # The image identity is read in a step rather than taken from `env.ImageOS`
    # in the key expression: that variable does not resolve inside a composite
    # action, and the first version of this silently keyed on an **empty**
    # segment — `apt-Linux-X64--<hash>` in the log. An empty segment is not a
    # cosmetic flaw here, it is the wrong-package-set bug this key exists to
    # prevent, since one release's `.deb` would restore onto another's.
    - id: image
      shell: bash
      run: |
        set -euo pipefail
        echo "id=${ImageOS:-$(. /etc/os-release && echo "${ID}${VERSION_ID}")}" \
          >> "$GITHUB_OUTPUT"
    #
    # THE ARCHIVE IS CACHED SOMEWHERE THE RUNNER USER OWNS, and that is a
    # correction. This cached `/var/cache/apt/archives/*.deb` until 2026-08-19
    # and **not one restore ever succeeded**: `actions/cache` extracts as the
    # runner user, that directory is `root:root`, and `tar` reported
    # `Cannot open: Permission denied` for every file in it. The action logs
    # that as a warning and then prints `Cache not found`, so the step read as
    # an ordinary miss — a green light wired to nothing. Every job asked the
    # mirror on every run, which is why a slow mirror kept taking whole boards
    # down while a 17 MB cache entry was downloaded and thrown away.
    #
    # `apt-get` still uses `/var/cache/apt/archives`, untouched: the packages
    # are copied in before the install and back out after it. Redirecting apt
    # at the cache directory with `Dir::Cache::archives` would be tidier and
    # changes how apt itself runs, which is not something this repository can
    # test anywhere but on a runner.
    - id: archive
      uses: actions/cache@v4
      with:
        path: ~/.cache/crcbl-apt-archives
        key:
          apt-${{ runner.os }}-${{ runner.arch }}-${{ steps.image.outputs.id
          }}-${{ hashFiles('.github/actions/apt-packages/action.yml') }}-${{
          inputs.packages }}
    # `apt-get` deletes what it downloaded once a package is unpacked, so
    # without this the cache would save an empty directory every time.
    #
    # The directory is created **without** `sudo`, which is the whole point:
    # `apt-get` runs as root and can write into a directory the runner owns,
    # but `actions/cache` cannot restore into one root owns.
    - shell: bash
      run: |
        set -euo pipefail
        echo 'Binary::apt::APT::Keep-Downloaded-Packages "true";' \
          | sudo tee /etc/apt/apt.conf.d/99crcbl-keep-debs > /dev/null
        mkdir -p "$HOME/.cache/crcbl-apt-archives"
    # A hit that restores nothing is the failure this action spent its whole
    # life not noticing, so it is now said out loud — and the count is printed
    # either way, so "the cache worked" is a thing a log can be read for rather
    # than assumed. A warning rather than an error: the cache is an
    # optimisation and a broken one should not redden a board whose mirror is
    # answering, but it must never again look like an ordinary miss.
    - if: steps.archive.outputs.cache-hit == 'true'
      shell: bash
      run: |
        set -euo pipefail
        count=$(find "$HOME/.cache/crcbl-apt-archives" -name '*.deb' | wc -l)
        echo "the cache reported a hit and restored ${count} .deb file(s)"
        if [ "$count" -eq 0 ]; then
          echo "::warning::the apt cache reported a hit and restored no .deb files; every job falls through to the mirror, which is the failure mode that makes an outage fatal"
        fi
    # WHY THIS IS NOT TWO PLAIN apt-get LINES. Two runs in one session hung
    # here for twenty minutes and were killed by the job timeout, taking a
    # green board down and reporting it as "cancelled" — which reads like
    # somebody pushed over the run rather than like a mirror that stopped
    # answering.
    #
    # A retry alone does not fix that: a hang is not a failure, and never
    # returns to be retried. So each attempt is wrapped in `timeout`, which
    # turns the hang into a non-zero exit the loop can act on. Callers add
    # their own `timeout-minutes` as a backstop under the job's.
    #
    # Three tries with a widening gap: a mirror briefly unreachable comes
    # back inside a minute, and one that does not is a real outage worth
    # failing loudly for rather than waiting out.
    #
    # THE BUDGET HAS TO FIT THE CALLER'S CAP, and it did not. Callers set
    # `timeout-minutes: 8` or `10`; the timeouts here allowed 240 + 3x360 plus
    # backoff — twenty-three minutes — so the later tries were unreachable and
    # the step was killed mid-loop. Two runs died that way in one session,
    # reporting "The action has timed out" rather than the mirror error this
    # writes, which is the opposite of the legibility the retry exists for.
    #
    # So the worst case is now 100 + 2x(40 + 100) + 30 = 410s, inside the
    # tightest cap with a minute to spare, and "three" counts the first try
    # plus two retries — which is what the loop actually does. A healthy
    # install of this repo's largest list (sway, mesa and the validation
    # layers) is seconds, so 100s is headroom rather than a limit; anything
    # slower than that is the outage case, not a slow success.
    - shell: bash
      env:
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -uo pipefail
        ARCHIVES="$HOME/.cache/crcbl-apt-archives"
        # Seed apt's own archive from the cache. `-n` so a file already there
        # wins: the runner image may ship a newer `.deb` than the one cached.
        if compgen -G "$ARCHIVES/*.deb" > /dev/null; then
          sudo cp -n "$ARCHIVES"/*.deb /var/cache/apt/archives/ || true
        fi
        # Unquoted on purpose: the input is a space-separated list and apt
        # takes them as separate arguments.
        # shellcheck disable=SC2086
        # THE CACHE IS TRIED FIRST, and it is the only branch that can survive
        # an outage: `--no-download` forbids the network outright, so this
        # either installs entirely from the restored `.deb` files or fails
        # without waiting on anything. A miss here is ordinary — an empty cache,
        # or one package short — and falls through to the attempts below.
        # **Skipped outright when nothing was restored**, because it cannot
        # succeed and every second it spends is spent before the mirror is
        # asked.
        if compgen -G "$ARCHIVES/*.deb" > /dev/null; then
          # 180s, not the 30s this had until 2026-08-19. That 30s was harmless
          # only while the cache never restored: with an archive to install
          # from, `apt-get` reaches dpkg, and dpkg reading its database took
          # longer than the budget — the log shows `(Reading database ... 80%)`
          # and then the kill. **A killed dpkg keeps /var/lib/dpkg/lock**, so
          # every later attempt in this step died with `Could not get lock`, and
          # an install that was working turned into a failed job. This branch
          # touches no network and cannot hang on a mirror, so its timeout is a
          # runaway guard rather than a budget.
          if timeout 180 sudo apt-get install -y --no-install-recommends \
            --no-download $PACKAGES; then
            echo "installed from the cached archive; the mirror was not asked"
            exit 0
          fi
          echo "the cached archive did not satisfy '${PACKAGES}'; asking the mirror"
        else
          echo "the cache restored no .deb files; asking the mirror"
        fi
        # Whatever went wrong above may have left dpkg mid-transaction, and a
        # held lock fails every attempt below for a reason that has nothing to
        # do with the mirror. Best-effort: if there is nothing to recover this
        # says so, and the attempts below report the real problem either way.
        sudo dpkg --configure -a ||
          echo "dpkg had nothing to recover, or could not"
        # The first attempt skips `update`: the runner image ships populated
        # package lists, and `update` and the package mirror are separate
        # endpoints that fail separately. When only the index is unreachable
        # this succeeds outright instead of waiting out a timeout for a refresh
        # nothing needed.
        # ONE LONG ATTEMPT, THEN A SHORT ONE, and the split is a correction.
        # An earlier version ran three tries of 100s each and turned a *slow*
        # mirror into a fatal one: the log showed `mesa-vulkan-drivers [17.5 MB]`
        # downloading and being cut off at the timeout, three times over. Slow is
        # the common failure, not silent, so the first attempt gets the time a
        # large package actually needs.
        #
        # The retry is short because it is cheap: `Keep-Downloaded-Packages`
        # above means whatever arrived is still on disk, so a second attempt
        # resumes rather than re-fetching. Two tries at the mirror, not three:
        # on a slow mirror one long attempt beats several short ones.
        #
        # **The budget, and the cap it actually has to fit.** Worst case is
        # 180 + 300 + 30 + 90 = 600s. This comment used to say the tightest
        # caller cap was eight minutes, which was wrong: no job that uses this
        # action is capped below **twenty**, and the eight-minute jobs are the
        # ones that install nothing. Ten minutes of installing inside a
        # twenty-minute job still leaves the job its own half.
        if timeout 300 sudo apt-get install -y --no-install-recommends $PACKAGES; then
          exit 0
        fi
        echo "install against the image's package lists failed; refreshing them"
        # The refresh is best-effort and **must not gate the retry**. Chaining
        # them with `&&` meant a slow `update` consumed its timeout and
        # short-circuited, so the second install never ran at all — which is how
        # the wayland job failed 30s after the refresh began, having attempted
        # the packages exactly once. A stale index is a reason to refresh, not a
        # reason to skip the attempt.
        timeout 30 sudo apt-get update || \
          echo "the refresh did not finish; retrying the install against the lists we have"
        if timeout 90 sudo apt-get install -y --no-install-recommends $PACKAGES; then
          exit 0
        fi
        echo "::error::apt-get could not install '${PACKAGES}' — the runner's mirror is unreachable, or too slow to deliver them inside the 450s this step has, which is not a fault in this repository"
        exit 1
    # Harvest whatever `apt-get` downloaded, so the post-run save has something
    # to store and the *next* outage is survivable.
    #
    # `always()` because a failed install still leaves a partly filled archive,
    # and keeping it is the difference between the next run needing nine
    # packages and needing two. The `chown` is what makes the saved entry
    # restorable: everything apt wrote is root-owned, and a root-owned tree is
    # exactly what broke this before.
    - if: always()
      shell: bash
      run: |
        set -uo pipefail
        ARCHIVES="$HOME/.cache/crcbl-apt-archives"
        mkdir -p "$ARCHIVES"
        sudo cp -n /var/cache/apt/archives/*.deb "$ARCHIVES"/ 2> /dev/null || true
        sudo chown -R "$(id -u):$(id -g)" "$ARCHIVES"
        echo "the archive now holds $(find "$ARCHIVES" -name '*.deb' | wc -l) .deb file(s) for the next run"
