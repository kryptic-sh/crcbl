name: Cron

on:
  schedule:
    - cron: "0 6 * * 1" # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# The PR-triggered `deny` job in ci.yml checks against whatever advisory DB was
# current when the PR ran; the one here re-checks a quiet repo against a freshly
# fetched DB, so a new RustSec advisory does not wait for the next commit to be
# noticed.
#
# One job still to land: cargo-fuzz beyond the bounded `decoder-fuzz` leg in
# ci.yml (P13). Like the miri job in `.github/workflows/miri.yml`, it will need
# `RUSTUP_TOOLCHAIN: nightly` set at job level — `rust-toolchain.toml` claims
# authority over rustup and will otherwise refuse the channel.
jobs:
  deny:
    name: cargo-deny (fresh advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to the version `deny.toml`'s `skip` list and its
      # `multiple-versions = "deny"` gate were written against.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7
      - run: cargo deny --all-features check

  # Miri, the same job `ci.yml` now runs on every pull request and every push to
  # `main` — see `.github/workflows/miri.yml` for what it covers, what it cannot
  # cover, and why each flag is there.
  #
  # Kept here as well, and that is not duplication: the toolchain floats, so this
  # leg re-checks a quiet repository against whatever nightly miri has since
  # become. A new release that finds something in code nobody touched has no push
  # to ride in on — the same argument the `deny` job above makes about a freshly
  # fetched advisory database.
  miri:
    uses: ./.github/workflows/miri.yml
