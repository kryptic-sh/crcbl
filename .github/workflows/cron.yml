name: Cron

on:
  schedule:
    - cron: '0 6 * * 1' # Monday 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# The PR-triggered `deny` job in ci.yml checks against whatever advisory DB was
# current when the PR ran; the one here re-checks a quiet repo against a freshly
# fetched DB, so a new RustSec advisory does not wait for the next commit to be
# noticed.
#
# One job still to land: cargo-fuzz beyond the bounded `decoder-fuzz` leg in
# ci.yml (P13). Like miri below, it needs `RUSTUP_TOOLCHAIN: nightly` set at job
# level — `rust-toolchain.toml` claims authority over rustup and will otherwise
# refuse the channel.
jobs:
  deny:
    name: cargo-deny (fresh advisory DB)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      # Pinned to the version `deny.toml`'s `skip` list and its
      # `multiple-versions = "deny"` gate were written against.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7
      - run: cargo deny --all-features check

  # Miri: the undefined-behaviour interpreter, over the crates it can run.
  #
  # This file's own comment scheduled it "when nontrivial unsafe arrives
  # (crcbl-vk at P1)", and `crcbl-vk` has been here and full of `unsafe` for
  # several phases with nothing checking any of it.
  #
  # **It cannot run over `crcbl-vk` itself**, and that is not a gap this job can
  # close: miri interprets MIR and has no way to execute a `dlopen`ed
  # `libvulkan.so.1`, so every FFI and GPU crate — `crcbl-vk`, `crcbl-mtl`,
  # `crcbl-dx12`, `crcbl-shell`'s Wayland/X11 backends, `crcbl-audio`'s device
  # path — is outside its reach by construction. What it *does* cover is the
  # crates whose unsafe is pure Rust: the handle allocators and the frame arena
  # in `crcbl-core`, the seam types and the null backend in `crcbl-hal`, the
  # storage containers, the UI vertex builders, and `crcbl-jobs`.
  #
  # ## The target list is the unsafe census, and it is checked rather than assumed
  #
  # An earlier version of this comment also claimed "the physics broadphase, and
  # the audio mixer's sample buffers". **Both were false.** Counting `unsafe`
  # blocks, functions, impls and traits per crate — excluding the
  # `unsafe(no_mangle)` attribute, which is syntax rather than an escape hatch —
  # gives `crcbl-phys` **0** and `crcbl-audio` **0**. Neither crate contains any
  # unsafe at all, so interpreting them bought nothing this job exists for.
  #
  # That mattered because of what they cost: measured locally with this job's own
  # environment, `crcbl-phys` interprets in 53 s and **`crcbl-audio` in 4906 s —
  # 82 minutes**, past the timeout below on its own. So the step that ran both
  # was removed rather than given a bigger budget. `crcbl-audio` is also the
  # reason `-Zmiri-deterministic-floats` is set; the flag stays, because a future
  # target may need it and it costs nothing.
  #
  # Re-add a crate here when it grows unsafe, not by default. `crcbl-ecs` is kept
  # despite also counting 0 because it interprets in about six seconds and its
  # containers are where unsafe would first appear.
  #
  # `crcbl-jobs` is the one whose unsafe is *concurrent* rather than merely
  # aliasing, and it is what turns this job from a nice-to-have into the only
  # check of its kind here. Its mailbox hands slots between two threads through
  # an atomic word, and miri runs the two-thread stress test for real: a torn
  # read there is reported as a data race, which nothing else in this repository
  # can detect.
  #
  # ## Why the flags
  #
  # `-Zmiri-disable-isolation`: several suites read the clock and the
  # filesystem.
  #
  # `-Zmiri-deterministic-floats`: miri deliberately returns *any* permissible
  # result from `sin`/`cos`/`exp` to catch code that depends on one libm's exact
  # answer. `crcbl-audio`'s orbit suite hashes a rendered sine wave, so without
  # this the job fails on miri's intentional non-determinism rather than on a
  # bug. Confirmed by running that one test both ways.
  #
  # `PROPTEST_CASES: 4`: the default 256 cases per property, interpreted, is the
  # difference between `crcbl-core` taking 70 seconds and taking over ten
  # minutes. The property suites run at full width in `test-linux`; what this
  # job wants from them is a handful of executions under an interpreter that
  # checks aliasing, not more coverage of the properties themselves.
  #
  # ## Why these targets and not `--workspace`
  #
  # `crcbl-net` is deliberately **absent**, and for a different reason than the
  # two crates above: it does contain no unsafe today, but its library suite also
  # does not finish inside 40 minutes under miri, so it would be a timeout rather
  # than a gate either way. Its decoders are the part worth checking and they are
  # already attacked from the other side, per-PR, by the bounded `decoder-fuzz`
  # job in `ci.yml` — libFuzzer over the same code with ASan-grade
  # instrumentation. Re-measure and add it here when either miri or the suite
  # gets faster.
  #
  # Weekly rather than per-PR: the step below takes about three and a half
  # minutes of interpretation on top of a cold compile, measured locally with
  # this job's environment — `crcbl-core` 81 s, `crcbl-store` 58 s, `crcbl-jobs`
  # 25 s, `crcbl-ui` 17 s, `crcbl-ecs` 6 s, `crcbl-hal` 2 s.
  miri:
    name: miri (crates without FFI)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # `rust-toolchain.toml` pins an exact stable and claims authority over
      # rustup; miri only exists on nightly, so the channel is overridden here.
      RUSTUP_TOOLCHAIN: nightly
      MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-deterministic-floats
      PROPTEST_CASES: '4'
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly
          components: miri
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: miri
      # **No ALSA headers here, unlike every other linux job.**
      # `cargo miri test -p` builds only the named crates and their
      # dependencies, and none of the six below reaches `cpal` — checked with
      # `cargo tree -e normal` rather than assumed. The install this job briefly
      # carried was for `crcbl-audio`, and it goes with it. If a target ever
      # grows an audio dependency, it comes back.
      #
      # **The standing hazard of this file, which that episode illustrates:** a
      # job that runs once a week is a job nobody is watching. `crcbl-audio`
      # gaining `cpal` broke this on 2026-08-03 — the first Monday after the
      # dependency landed, 2026-07-27 having passed — and nothing reported it;
      # fixing that then exposed the 82-minute interpretation behind it, which
      # had been masked all along. After a dependency lands, or after this file
      # changes, trigger it deliberately with `gh workflow run cron.yml` instead
      # of waiting for a Monday to tell you.
      - run: cargo miri setup
      - name: Interpret the seam and container crates
        run: >-
          cargo miri test -p crcbl-core -p crcbl-hal -p crcbl-ecs -p crcbl-store
          -p crcbl-ui -p crcbl-jobs
