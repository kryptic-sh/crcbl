name: Pages

# The demo site: https://crcbl.kryptic.sh/
#
# `docs/plan/ROADMAP.md`'s "Demo site (GitHub Pages)" section asks for two
# things, and they are split into two jobs here rather than one:
#
#   * "Broken wasm build = broken CI = blocked merge — the browser target can't
#     rot." That is `build`, and it runs on **pull requests too**. A PR that
#     breaks the shim, the export contract or the wasm build fails here before
#     anything reaches main.
#   * "on main push, build all wasm-ready samples, assemble static site, deploy".
#     That is `deploy`, which runs only on a push to main.
#
# PERMISSIONS. The workflow default is `contents: read`, the same as `ci.yml`.
# `pages: write` and `id-token: write` are granted to the **deploy job only** —
# the job that builds the artifact, runs `cargo`, and executes repository code
# never holds a token that can publish. `id-token: write` is what
# `actions/deploy-pages` exchanges for a short-lived Pages deployment token, so
# there is no long-lived secret anywhere in this file.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# A superseded deploy is worth cancelling; two of them racing to publish is not.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      # Node 24 for two reasons: `node --check` understands ES module syntax in
      # a `.js` file without a `package.json` to declare the dialect, and the
      # export checker uses `WebAssembly.Module.exports`. There is no npm step
      # and no `node_modules` — this repository hand-writes its bindings.
      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      # The version comes out of `Cargo.lock`, so it cannot drift from the
      # `wasm-bindgen` crate the build resolves. A mismatched CLI emits glue
      # whose imports the module does not have, and that failure would surface
      # as a `LinkError` in a visitor's browser rather than here.
      - name: Resolve the pinned wasm-bindgen version
        id: bindgen
        run: |
          version=$(awk '/^name = "wasm-bindgen"$/ { found = 1; next }
                         found && /^version = / { gsub(/[",]/, "", $3); print $3; exit }' Cargo.lock)
          test -n "$version" || { echo "no wasm-bindgen in Cargo.lock"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@${{ steps.bindgen.outputs.version }}

      # Every JS file parses. Cheap, and it catches the class of mistake that
      # otherwise only appears as a blank page.
      - name: Syntax-check the shim
        run: node --check web/engine/*.js web/demos/*/*.js web/tools/*.mjs

      # THE COMMAND STREAM'S DRIFT CHECK. `crcbl-webgpu` encodes the stream in
      # Rust and `web/engine/gpu-stream.js` decodes it in JavaScript, so the
      # format has two hand-written halves and no compiler anywhere reads both.
      # This decodes the fixture the Rust side commits and asserts every field,
      # which is the only thing in the build that notices when they disagree.
      # It needs no wasm and no browser, so it runs before the build rather than
      # inside it, and a mismatch fails in seconds with the field named.
      - name: Decode the committed command-stream fixture
        run: node web/tools/stream-decode.mjs

      # THE TRANSPORT'S OWN CHECK. The step above is the *format*; this one is
      # the ABI in `crates/crcbl-webgpu/src/web.rs` — that the shim settles
      # readiness on the length alone, decodes exactly the window the pointer and
      # length describe, copies payloads out rather than leaving views on wasm
      # memory, and releases the buffer even when the decode throws. It drives
      # `web/engine/gpu-transport.js` against a synthetic `WebAssembly.Memory`
      # holding the same committed fixture, so like the step above it needs
      # neither a wasm module nor a browser and fails in seconds.
      - name: Drive the command-stream transport
        run: node web/tools/stream-transport.mjs

      # The same drift check pointed the other way. Replies travel JS to wasm,
      # so the JavaScript side is the encoder and Rust the decoder, and the
      # fixture is re-encoded here rather than decoded: this fails when the
      # browser half stops producing what the engine half reads.
      - name: Re-encode the committed reply-stream fixture
        run: node web/tools/reply-encode.mjs

      # The replayer's own logic, with WebGPU stubbed out: that every command
      # path queues exactly one reply, that an enumeration answers on a later
      # frame rather than the one that asked, and that a browser with no adapter
      # is answered rather than left waiting. The real thing needs `navigator.gpu`
      # and runs in the browser gate; this catches the half that does not.
      - name: Exercise the command-stream replayer
        run: node web/tools/gpu-replay.mjs

      # Builds each wasm-ready sample, runs `wasm-bindgen`, assembles
      # `target/site`, and runs two checks against every artifact it produced.
      # They are the real gate, and they are what makes this job worth running
      # on a PR rather than only on a deploy:
      #
      #   check-exports.mjs — every `__crcbl_*` the Rust sources declare is
      #     exported, every symbol the shim calls exists, `memory` is exported,
      #     and the module imports nothing outside the bindgen glue.
      #   smoke.mjs — instantiates the artifact under node with every import
      #     stubbed to throw and drives the documented boot sequence up to the
      #     frame that would need a GPU.
      - name: Build the site
        run: ./web/build.sh

      # The custom domain lives in `web/CNAME`, which `web/build.sh` copies into
      # the artifact along with the rest of `web/`. GitHub reads that file on
      # every deploy and *clears* the custom domain when it is missing — so
      # losing it does not fail anything, it silently moves the site back to
      # `kryptic-sh.github.io/crcbl/` and breaks every link to the demos. The
      # site repo guards the same file for the same reason.
      - name: Check the custom domain survived the build
        run: |
          set -euo pipefail
          test -f target/site/CNAME || {
            echo "::error::target/site/CNAME is missing — the deploy would drop crcbl.kryptic.sh"
            exit 1
          }
          domain="$(tr -d '[:space:]' < target/site/CNAME)"
          test "$domain" = "crcbl.kryptic.sh" || {
            echo "::error::target/site/CNAME says '$domain', expected crcbl.kryptic.sh"
            exit 1
          }
          echo "custom domain: $domain"

      # THE ASSUMPTIONS THE BROWSER GATE MAKES, CHECKED RATHER THAN HOPED FOR.
      # `ubuntu-latest` ships `/usr/bin/google-chrome` and `Xvfb`, and both of
      # those are facts about an image that changes; a runner that stopped
      # shipping either would otherwise turn the gate below into a step that
      # skips and reports success, which is the failure mode
      # `docs/plan/12-testing.md` warns about by name.
      - name: Check the browser gate's assumptions
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::no Chrome or Chromium on this runner. The image is assumed to ship /usr/bin/google-chrome."
            exit 1
          fi
          echo "browser: $browser ($("$browser" --version))"
          if ! command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is not on this image; installing it."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          echo "Xvfb: $(command -v Xvfb)"

      # THE P5 GATE. Loads the site that was just built in a real browser,
      # opens a WebGPU device, drives a real Space key into the canvas of every
      # demo that has one to press, and reads the canvas back to prove it is
      # neither blank nor still.
      #
      # A GitHub runner has no GPU, which is why the harness runs the browser
      # inside Xvfb against Chromium's bundled SwiftShader: that is the one
      # combination whose canvas pixels can be read back at all (the table is in
      # `web/run-browser-e2e.sh`). It verifies that for itself with a
      # known-colour clear before it interprets anything, so a runner where the
      # readback stops working fails here rather than reporting a working
      # renderer as blank.
      # Once per demo, and named per demo, so "the browser gate failed" says
      # which game. The site is built once; each run launches its own browser
      # because the driver reads one canvas.
      - name: Render breakout in a real browser
        run: CRCBL_WEB_E2E_DEMO=breakout ./web/run-browser-e2e.sh

      # THE WEBGPU GATE. The same breakout, rendered through `crcbl-webgpu`
      # instead of `crcbl-wgpu`: `CRCBL_WEB_BACKEND=webgpu` builds the site with
      # the umbrella's `webgpu` feature and drives the demo through the backend,
      # running groups A–F — boots, opens a webgpu device, draws distinct frames.
      # The crcbl-webgpu probe groups are skipped here: the engine's own device
      # owns the one command-stream channel, and the wgpu run above still
      # exercises them.
      #
      # Built into its OWN `SITE_DIR`, not `target/site`. The wasm links a
      # different backend, so `--build` produces a different artifact — and
      # `target/site` is what the remaining wgpu demo steps reuse and what the
      # deploy ships, so it must stay the default (wgpu) build. A separate
      # directory keeps this gate from poisoning either.
      #
      # breakout builds the WebGpu site with `--build`; every WebGpu demo below
      # reuses that one `target/site-webgpu` and drops `--build`, so CI links the
      # backend and assembles the site once rather than once per demo. Each still
      # launches its own browser, because the driver reads one canvas.
      - name: Render breakout through WebGpu in a real browser
        run: SITE_DIR=target/site-webgpu CRCBL_WEB_BACKEND=webgpu CRCBL_WEB_E2E_DEMO=breakout ./web/run-browser-e2e.sh --build

      - name: Render flappy through WebGpu in a real browser
        run: SITE_DIR=target/site-webgpu CRCBL_WEB_BACKEND=webgpu CRCBL_WEB_E2E_DEMO=flappy ./web/run-browser-e2e.sh

      - name: Render asteroids through WebGpu in a real browser
        run: SITE_DIR=target/site-webgpu CRCBL_WEB_BACKEND=webgpu CRCBL_WEB_E2E_DEMO=asteroids ./web/run-browser-e2e.sh

      - name: Render horde through WebGpu in a real browser
        run: SITE_DIR=target/site-webgpu CRCBL_WEB_BACKEND=webgpu CRCBL_WEB_E2E_DEMO=horde ./web/run-browser-e2e.sh

      # hud takes no input through WebGpu either; the same ticker-cursor read the
      # wgpu step relies on carries the "simulation is advancing" proof here.
      - name: Render hud through WebGpu in a real browser
        run: SITE_DIR=target/site-webgpu CRCBL_WEB_BACKEND=webgpu CRCBL_WEB_E2E_DEMO=hud ./web/run-browser-e2e.sh

      - name: Render flappy in a real browser
        run: CRCBL_WEB_E2E_DEMO=flappy ./web/run-browser-e2e.sh

      - name: Render asteroids in a real browser
        run: CRCBL_WEB_E2E_DEMO=asteroids ./web/run-browser-e2e.sh

      - name: Render horde in a real browser
        run: CRCBL_WEB_E2E_DEMO=horde ./web/run-browser-e2e.sh

      # hud is the one demo that takes no input, so the driver dispatches no key
      # for it and reads "the simulation is advancing" off the ticker's own rng
      # cursor instead. Its `EXPECTATIONS` row in `web/tools/browser-e2e.mjs` is
      # what says so; the step is otherwise identical.
      - name: Render hud in a real browser
        run: CRCBL_WEB_E2E_DEMO=hud ./web/run-browser-e2e.sh

      # THERE IS NO `lumen` STEP HERE, AND ITS ABSENCE IS DELIBERATE.
      #
      # lumen is the sixth demo and the only one this job does not render. It is
      # not slowness and it is not lumen's code: `crcbl-render`'s draw-argument
      # pass binds fourteen storage buffers in one compute stage, and Chrome's
      # SwiftShader adapter — the only WebGPU adapter a runner with no GPU has —
      # reports a ceiling of ten, so the pipeline is never created and the canvas
      # stays black. On real hardware the same artifact passes all 33 checks.
      #
      # A step here would therefore be a red CI on every commit, and one that
      # blamed the wrong thing. `docs/backlog.md`'s "lumen's browser gate needs a
      # real GPU" carries the measurement, the Dawn error verbatim and the one
      # line to add back the moment the pass fits. Everything else in this job
      # does cover lumen: `build.sh` builds its wasm, checks its export contract
      # and smoke-runs it under node.
      #
      #     - name: Render lumen in a real browser
      #       run: CRCBL_WEB_E2E_DEMO=lumen ./web/run-browser-e2e.sh

      # The canvas as a PNG and the page's whole log. On a failure these are the
      # first two things anyone will ask for, and neither can be reconstructed
      # from the step log.
      - name: Upload the browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e
          path: target/web-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job alone. Nothing here compiles or runs repository code:
    # it downloads the artifact the `build` job produced and hands it to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
