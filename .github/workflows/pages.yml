name: Pages

# The demo site: https://crcbl.kryptic.sh/
#
# `docs/plan/ROADMAP.md`'s "Demo site (GitHub Pages)" section asks for two
# things, and they are split into two jobs here rather than one:
#
#   * "Broken wasm build = broken CI = blocked merge — the browser target can't
#     rot." That is `build`, and it runs on **pull requests too**. A PR that
#     breaks the shim, the export contract or the wasm build fails here before
#     anything reaches main.
#   * "on main push, build all wasm-ready samples, assemble static site, deploy".
#     That is `deploy`, which runs only on a push to main.
#
# PERMISSIONS. The workflow default is `contents: read`, the same as `ci.yml`.
# `pages: write` and `id-token: write` are granted to the **deploy job only** —
# the job that builds the artifact, runs `cargo`, and executes repository code
# never holds a token that can publish. `id-token: write` is what
# `actions/deploy-pages` exchanges for a short-lived Pages deployment token, so
# there is no long-lived secret anywhere in this file.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# A superseded deploy is worth cancelling; two of them racing to publish is not.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build the demo site
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      # Node 24 for two reasons: `node --check` understands ES module syntax in
      # a `.js` file without a `package.json` to declare the dialect, and the
      # export checker uses `WebAssembly.Module.exports`. There is no npm step
      # and no `node_modules` — this repository hand-writes its bindings.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # THERE IS NO wasm-bindgen STEP HERE ANY MORE. This job used to resolve the
      # crate's version out of `Cargo.lock` and install the matching CLI, because
      # `wgpu` reached WebGPU through `web-sys` and every artifact imported ~340
      # functions only that tool could resolve. `crcbl-wgpu` is a
      # `cfg(not(target_arch = "wasm32"))` dependency of the umbrella now, the
      # artifacts import nothing, and the CLI cannot even run over them — see
      # `web/build.sh`'s "no wasm-bindgen" note. `cargo`, `python3` and `node`
      # are the whole tool list.

      # Every JS file parses. Cheap, and it catches the class of mistake that
      # otherwise only appears as a blank page. `web/tools/*.js` is
      # `wasm-loader.js`, copied beside every artifact as the module the pages
      # `import init from` — a syntax error in it is every demo blank.
      - name: Syntax-check the shim
        run: >-
          node --check web/engine/*.js web/demos/*/*.js web/probe/*.js
          web/tools/*.js web/tools/*.mjs

      # THE COMMAND STREAM'S DRIFT CHECK. `crcbl-webgpu` encodes the stream in
      # Rust and `web/engine/gpu-stream.js` decodes it in JavaScript, so the
      # format has two hand-written halves and no compiler anywhere reads both.
      # This decodes the fixture the Rust side commits and asserts every field,
      # which is the only thing in the build that notices when they disagree.
      # It needs no wasm and no browser, so it runs before the build rather than
      # inside it, and a mismatch fails in seconds with the field named.
      - name: Decode the committed command-stream fixture
        run: node web/tools/stream-decode.mjs

      # THE TRANSPORT'S OWN CHECK. The step above is the *format*; this one is
      # the ABI in `crates/crcbl-webgpu/src/web.rs` — that the shim settles
      # readiness on the length alone, decodes exactly the window the pointer and
      # length describe, copies payloads out rather than leaving views on wasm
      # memory, and releases the buffer even when the decode throws. It drives
      # `web/engine/gpu-transport.js` against a synthetic `WebAssembly.Memory`
      # holding the same committed fixture, so like the step above it needs
      # neither a wasm module nor a browser and fails in seconds.
      - name: Drive the command-stream transport
        run: node web/tools/stream-transport.mjs

      # The same drift check pointed the other way. Replies travel JS to wasm,
      # so the JavaScript side is the encoder and Rust the decoder, and the
      # fixture is re-encoded here rather than decoded: this fails when the
      # browser half stops producing what the engine half reads.
      - name: Re-encode the committed reply-stream fixture
        run: node web/tools/reply-encode.mjs

      # The replayer's own logic, with WebGPU stubbed out: that every command
      # path queues exactly one reply, that an enumeration answers on a later
      # frame rather than the one that asked, and that a browser with no adapter
      # is answered rather than left waiting. The real thing needs `navigator.gpu`
      # and runs in the browser gate; this catches the half that does not.
      - name: Exercise the command-stream replayer
        run: node web/tools/gpu-replay.mjs

      # Builds each wasm-ready sample, assembles `target/site`, and runs two
      # checks against every artifact it produced.
      # They are the real gate, and they are what makes this job worth running
      # on a PR rather than only on a deploy:
      #
      #   check-exports.mjs — every `__crcbl_*` the Rust sources declare is
      #     exported, every symbol the shim calls exists, `memory` is exported,
      #     and the module imports nothing — literally zero, not "nothing
      #     outside the bindgen glue".
      #   smoke.mjs — instantiates the artifact under node with every import
      #     stubbed to throw and drives the documented boot sequence up to the
      #     frame that would need a GPU.
      #
      # `target/site` — the directory the upload step takes and the `deploy` job
      # publishes — renders through our own WebGPU path. There is no flag saying
      # so any more: `crcbl-wgpu` is a `cfg(not(target_arch = "wasm32"))`
      # dependency of the umbrella, so `crcbl-webgpu` is the only GPU backend a
      # wasm build links and `crcbl::backend` picks it because the target says
      # so. This step used to pass `CRCBL_WEB_BACKEND=webgpu` to choose between
      # the two. Every demo step below reuses this one build and therefore gates
      # the artifact that actually ships.
      - name: Build the site
        run: ./web/build.sh

      # The custom domain lives in `web/CNAME`, which `web/build.sh` copies into
      # the artifact along with the rest of `web/`. GitHub reads that file on
      # every deploy and *clears* the custom domain when it is missing — so
      # losing it does not fail anything, it silently moves the site back to
      # `kryptic-sh.github.io/crcbl/` and breaks every link to the demos. The
      # site repo guards the same file for the same reason.
      - name: Check the custom domain survived the build
        run: |
          set -euo pipefail
          test -f target/site/CNAME || {
            echo "::error::target/site/CNAME is missing — the deploy would drop crcbl.kryptic.sh"
            exit 1
          }
          domain="$(tr -d '[:space:]' < target/site/CNAME)"
          test "$domain" = "crcbl.kryptic.sh" || {
            echo "::error::target/site/CNAME says '$domain', expected crcbl.kryptic.sh"
            exit 1
          }
          echo "custom domain: $domain"

      # THE ASSUMPTIONS THE BROWSER GATE MAKES, CHECKED RATHER THAN HOPED FOR.
      # `ubuntu-latest` ships `/usr/bin/google-chrome` and `Xvfb`, and both of
      # those are facts about an image that changes; a runner that stopped
      # shipping either would otherwise turn the gate below into a step that
      # skips and reports success, which is the failure mode
      # `docs/plan/12-testing.md` warns about by name.
      - name: Check the browser gate's assumptions
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::no Chrome or Chromium on this runner. The image is assumed to ship /usr/bin/google-chrome."
            exit 1
          fi
          echo "browser: $browser ($("$browser" --version))"
          if ! command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is not on this image; installing it."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          echo "Xvfb: $(command -v Xvfb)"

      # THE P5 GATE. Loads the site that was just built in a real browser,
      # opens a WebGPU device, drives a real Space key into the canvas of every
      # demo that has one to press, and reads the canvas back to prove it is
      # neither blank nor still.
      #
      # A GitHub runner has no GPU, which is why the harness runs the browser
      # inside Xvfb against Chromium's bundled SwiftShader: that is the one
      # combination whose canvas pixels can be read back at all (the table is in
      # `web/run-browser-e2e.sh`). It verifies that for itself with a
      # known-colour clear before it interprets anything, so a runner where the
      # readback stops working fails here rather than reporting a working
      # renderer as blank.
      # Once per demo, and named per demo, so "the browser gate failed" says
      # which game. The site is built once; each run launches its own browser
      # because the driver reads one canvas.
      #
      # The driver waits for `crcbl-webgpu`'s own `hal: webgpu adapter` line at
      # boot, which is a check that the *right* backend opened the device rather
      # than that some backend did. It is not configurable: a browser build has
      # one GPU backend, so a `hal: wgpu adapter` line here would mean the
      # umbrella's manifest had regressed.
      - name: Render breakout in a real browser
        run: CRCBL_WEB_E2E_DEMO=breakout ./web/run-browser-e2e.sh

      - name: Render flappy in a real browser
        run: CRCBL_WEB_E2E_DEMO=flappy ./web/run-browser-e2e.sh

      - name: Render asteroids in a real browser
        run: CRCBL_WEB_E2E_DEMO=asteroids ./web/run-browser-e2e.sh

      - name: Render horde in a real browser
        run: CRCBL_WEB_E2E_DEMO=horde ./web/run-browser-e2e.sh

      # hud is the one demo that takes no input, so the driver dispatches no key
      # for it and reads "the simulation is advancing" off the ticker's own rng
      # cursor instead. Its `EXPECTATIONS` row in `web/tools/browser-e2e.mjs` is
      # what says so; the step is otherwise identical.
      - name: Render hud in a real browser
        run: CRCBL_WEB_E2E_DEMO=hud ./web/run-browser-e2e.sh

      # THE crcbl-webgpu SEAM GATE. **It must not be deleted**, nor folded into
      # the demo runs above.
      #
      # `web/tools/probe-groups.mjs` carries the PROBE groups — **G through AE** —
      # which drive `crcbl-webgpu`'s command stream directly rather than through
      # the engine: the wasm→JS→wasm round trip and the device it opens, a
      # surface, the capability query held against what `navigator.gpu` tells the
      # same page, then a buffer, an image and its view, a sampler, a bind-group
      # layout, a bind group, a shader module, a pipeline layout and both
      # pipelines — and from S onward the ones that read bytes back and compare
      # their *values*: a cleared texture, a drawn triangle, a compute shader's
      # storage writes, a copy chain, a sub-range fill, a presented canvas
      # frame, a reconfigured swapchain and an indirect draw. The five steps
      # above prove the shipped artifact renders; this is the only thing that
      # proves the seam underneath it command by command. Delete it and every
      # probe group stops running with nothing going red.
      #
      # It runs on `target/site` — the build the steps above reuse and the
      # `deploy` job ships — and needs no second backend, which is what changed:
      # the probe exports install their own command-stream channel and a page has
      # exactly one, so they run wherever nothing else has claimed it.
      # `web/probe/` is a page with **no engine running** that loads a demo's
      # wasm module without booting it and pumps the channel itself. This step
      # used to build a whole second site on `wgpu` for that condition —
      # `crcbl-webgpu` linked but idle under a demo rendering through something
      # else — which tied twenty groups of seam coverage to a backend the site
      # does not ship, and which nothing can build any more: `crcbl-wgpu` is not
      # a wasm dependency of the umbrella at all.
      #
      # WHAT SHOWS IT IS STILL DOING ITS JOB is the line it prints naming every
      # group letter it recorded a check under, beside the count:
      # `web/run-probe-e2e.sh` fails when any of G–Z or AA–AE is missing from it, so a
      # page that silently drove only some of the probes is a red step rather
      # than a smaller number nobody reads. It also names individual checks, so a
      # group that keeps its letter while dropping the claim that makes it worth
      # running fails there too.
      #
      # It brings up its own Xvfb, as the demo steps do. That is not cosmetic on
      # a runner with no GPU: under `--headless=new` plus SwiftShader the three
      # groups that acquire or present a canvas frame — X, Y and Z — never
      # resolve their readback map, while all three pass in the same browser
      # inside Xvfb.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        run: ./web/run-probe-e2e.sh

      # THERE IS NO `lumen` STEP HERE, AND ITS ABSENCE IS DELIBERATE.
      #
      # lumen is the sixth demo and the only one this job does not render. It is
      # not slowness and it is not lumen's code: `crcbl-render`'s draw-argument
      # pass binds fourteen storage buffers in one compute stage, and Chrome's
      # SwiftShader adapter — the only WebGPU adapter a runner with no GPU has —
      # reports a ceiling of ten, so the pipeline is never created and the canvas
      # stays black. On real hardware the same artifact passes all 33 checks —
      # measured on the wgpu site, before the deployed build moved to WebGpu.
      #
      # A step here would therefore be a red CI on every commit, and one that
      # blamed the wrong thing. `docs/backlog.md`'s "lumen's browser gate needs a
      # real GPU" carries the measurement, the Dawn error verbatim and the one
      # line to add back the moment the pass fits. Everything else in this job
      # does cover lumen: `build.sh` builds its wasm, checks its export contract
      # and smoke-runs it under node.
      #
      #     - name: Render lumen in a real browser
      #       run: CRCBL_WEB_E2E_DEMO=lumen ./web/run-browser-e2e.sh

      # The canvas as a PNG and the page's whole log. On a failure these are the
      # first two things anyone will ask for, and neither can be reconstructed
      # from the step log.
      - name: Upload the browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e
          path: target/web-e2e
          if-no-files-found: warn
          retention-days: 7

      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/site
          if-no-files-found: error
          retention-days: 7

  # THE SAME SEAM GATE, ON THE OTHER TWO PLATFORMS.
  #
  # `build` runs every browser step above on `ubuntu-latest`, so until these two
  # jobs existed "the WebGPU backend works in a browser" meant "on Linux, under
  # SwiftShader". These run the **probe gate only** — `web/run-probe-e2e.sh`,
  # which drives `crcbl-webgpu`'s command stream verb by verb — and not the five
  # demo steps: measured on a real run, the probe costs about 2 seconds of
  # browser time against the demos' 2m38s, and it is the gate that reads bytes
  # back and compares their values rather than watching a canvas change.
  #
  # NEITHER OF THEM BUILDS THE SITE. `web/build.sh` needs python3 and a wasm
  # toolchain, and a second and third build would be three different artifacts
  # under test; both download the `site` artifact `build` uploaded, so all three
  # platforms drive the identical bytes that ship.
  #
  # Separate jobs rather than a matrix on `build`: a matrix would rebuild the
  # site three times over and its three uploads would collide on one artifact
  # name.
  #
  # **`continue-on-error` is a state with an exit condition, not a setting.** An
  # unproven gate that blocks the Pages deploy is worse than no gate, and one
  # that silently never fails is worse still, so each job carries it only until
  # it has been green three runs.
  #
  # **Neither job carries it any more.** macOS served its three at 57/57 over
  # groups G to AA, headless against a real Apple adapter. Windows took the other
  # exit: its first run found no WebGPU adapter at all, its second died reading
  # Chrome's port file, and its third reached 53/57 with four readbacks timing
  # out — which is a measurement, so the job now gates on exactly that, through
  # the `--expect-fail` list on its run step. Both jobs can fail the workflow.
  probe-macos:
    name: probe the seam on macOS
    needs: build
    # **Never `macos-14`.** All three hosted images report an
    # `Apple Paravirtual device`, and only some of them have one that executes:
    # `macos-14`'s `MTLCreateSystemDefaultDevice()` returns nil, while `15` and
    # `26` both run shaders. `ci.yml`'s `mtl-e2e` job carries the measurement
    # and the run it came from, and `docs/backlog.md` the per-image output.
    # Pinned to `15` rather than `macos-latest` so the image this gate is proven
    # on does not change under it while it is still unproven.
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: target/site

      # A missing browser must not be mistaken for a failing gate, so it is
      # named, executed and printed before anything drives it.
      - name: Check the browser gate's assumptions
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$chrome" ]; then
            echo "::error::no Google Chrome at $chrome. The macOS image is assumed to ship it."
            exit 1
          fi
          echo "browser: $chrome ($("$chrome" --version))"
          echo "CRCBL_CHROMIUM=$chrome" >> "$GITHUB_ENV"

      # Headless, and that is the whole difference from the Linux run. A
      # headless Chrome can read a WebGPU canvas back on macOS and cannot on
      # Linux or Windows — the reason `build` brings up an Xvfb and the reason
      # the Windows job below runs headed. There is no Xvfb here to bring up
      # anyway: it is an X server and macOS has none.
      #
      # The adapter mode resolves to `hardware` on its own: `auto` is
      # SwiftShader on Linux only, because Chrome's Dawn has no Vulkan backend
      # on macOS and so has no software adapter to fall back to.
      # `web/tools/probe-e2e.mjs` carries the table.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        run: ./web/run-probe-e2e.sh --headless

  probe-windows:
    name: probe the seam on Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      # THE PAIRING THAT READS AS A CONTRADICTION AND IS NOT. `--headless` below
      # tells **the script** not to go looking for an Xvfb Windows cannot have;
      # this tells **the driver** not to pass `--headless=new`. A Windows runner
      # has its own desktop session, and the canvas needs it: headless there
      # renders the frame but never gets it to a compositor that can hand the
      # pixels back.
      CRCBL_WEB_E2E_HEADED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: target/site

      # Chrome's own installer records where it put itself under `App Paths`,
      # and that is where the runner image's install script reads it from too —
      # so this asks the registry rather than hardcoding a Program Files path
      # that the image is free to change.
      - name: Check the browser gate's assumptions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe'
          )
          $chrome = $null
          foreach ($key in $keys) {
            $value = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).'(default)'
            if ($value -and (Test-Path -LiteralPath $value)) { $chrome = $value; break }
          }
          if (-not $chrome) {
            $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path -LiteralPath $chrome)) {
            Write-Output "::error::no Chrome in the registry under App Paths, and none at $chrome. The Windows image is assumed to ship it."
            exit 1
          }
          # `chrome.exe --version` writes nothing to a console on Windows — it is
          # a GUI-subsystem binary — so the version comes off the file itself.
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          Write-Output "browser: $chrome ($version)"
          "CRCBL_CHROMIUM=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `shell: bash` is Git Bash, which the runner ships. `pwd -W` is what makes
      # the path it hands the driver a Windows one: everything under this shell
      # sees `/d/a/crcbl/...`, and Node is a native Windows binary that would
      # resolve that against the current drive root and find no site there.
      #
      # **SwiftShader is forced here, having measured the alternative.** The
      # first run of this job took the default `hardware` mode, found Chrome
      # 151.0.7922.109 exactly where the registry said, and died at
      # `requestAdapter() returned no adapter — no GPU to drive`. So a
      # GPU-less `windows-latest` exposes no WebGPU through D3D at all, and in
      # that mode this job gates nothing.
      #
      # The known cost, recorded in `docs/backlog.md` from Chrome 151: this
      # moves **Dawn** to SwiftShader while Chromium's shared-image device
      # stays on D3D11, and a canvas handed between two devices reads back as
      # uninitialised memory behind `ReadPixels: Source shared image is not
      # accessible`.
      #
      # **`--expect-fail X,Y,Z,AA` IS THE MEASUREMENT THAT REPLACED THE GUESS.**
      # Run 32085351076 reached `53/57 checks passed` over groups G through AA,
      # with those four failing identically — `no … readback in 90000 ms`, no
      # device error anywhere — and every other group green. So this job now
      # gates: those four produce no verdict on this runner, everything else
      # must pass, and the driver fails the run if any of the four starts
      # passing, which is what stops this line outliving the defect.
      #
      # ONLY X IS THE CANVAS FAULT; Y, Z AND AA ARE COLLATERAL. Z draws
      # indirectly into a texture the replayer owns and AA copies a depth plane
      # — neither goes near a canvas, and both pass on Linux in the same
      # headless SwiftShader browser once X and Y are stubbed out so they submit
      # nothing. The page has one `GPUDevice` and therefore one queue, and a
      # `mapAsync` resolves only behind the submits ahead of it, so X's stuck
      # present strands every readback queued after it. Giving the canvas groups
      # their own device, or running them last, would recover Z and AA here;
      # `docs/backlog.md` is where that belongs until someone does it.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        shell: bash
        run: >-
          SITE_DIR="$(pwd -W)/target/site" ./web/run-probe-e2e.sh --headless
          --adapter swiftshader --expect-fail X,Y,Z,AA

  deploy:
    name: deploy to GitHub Pages
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job alone. Nothing here compiles or runs repository code:
    # it downloads the artifact the `build` job produced and hands it to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
