name: Pages

# The demo site: https://crcbl.kryptic.sh/
#
# `docs/plan/ROADMAP.md`'s "Demo site (GitHub Pages)" section asks for two
# things, and they are split into two jobs here rather than one:
#
#   * "Broken wasm build = broken CI = blocked merge — the browser target can't
#     rot." That is `build`, and it runs on **pull requests too**. A PR that
#     breaks the shim, the export contract or the wasm build fails here before
#     anything reaches main.
#   * "on main push, build all wasm-ready samples, assemble static site, deploy".
#     That is `deploy`, which runs only on a push to main.
#
# PERMISSIONS. The workflow default is `contents: read`, the same as `ci.yml`.
# `pages: write` and `id-token: write` are granted to the **deploy job only** —
# the job that builds the artifact, runs `cargo`, and executes repository code
# never holds a token that can publish. `id-token: write` is what
# `actions/deploy-pages` exchanges for a short-lived Pages deployment token, so
# there is no long-lived secret anywhere in this file.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

# A superseded run is cancelled, on main as on a PR, so the run in flight is
# always the newest push (the user's rule, 2026-08-30). The cost is known and
# accepted: the publish step is the only thing that moves the live site, so
# pushes landing faster than a deploy takes chain — each run cancels the one
# before it — and the site stays at whichever commit last got to finish. That
# is how the orbit demo once built green and never appeared, and why this
# workflow queued main instead for a while. What bounds it now is the push
# cadence rather than the workflow: every tenth push holds until its run
# completes, so the site is at most ten pushes behind and never silently
# stuck. A tag run is never cancelled either way.
concurrency:
  group: pages-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: build the demo site
    runs-on: ubuntu-latest
    # **The build and the seam probe, and no demo.** Until 2026-08-28 every
    # browser gate ran in this one job, serially, because they all drive the
    # site it builds — so what had to fit here was their sum, and per-step
    # `timeout-minutes` could bound a hanging demo but never the total. When
    # the job cap was the smaller of the two it was the cap that fired, and a
    # cap firing **skips** the deploy rather than failing it: a green-looking
    # workflow with the site a commit behind. It happened on 2026-08-25 at 30
    # minutes, and the ceiling went to 60, then 90, then 120 chasing it. At
    # `80022df` the fourteen gates were still growing — quarry 658 s, lantern
    # 667 s, puppet 774 s, breach killed on its own 20-minute bound with every
    # check green, shard never reached — and the site had not deployed since
    # `00c92e3`.
    #
    # **The gates are the `demos` matrix job now**, one per demo, each
    # downloading the `site` artifact this job uploads before it drives
    # anything. The total is the slowest single demo rather than the sum of all
    # of them, a step cap is a bound on a hang again, and a gate that goes red
    # fails the deploy through `deploy`'s `needs` instead of skipping it. The
    # header this replaces had named that answer for three raises running.
    #
    # 30 covers the wasm build (55 s at `80022df`), the five node checks ahead
    # of it and the eight-second seam probe, with room for a cold Rust cache.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: pages

      # Node 24 for two reasons: `node --check` understands ES module syntax in
      # a `.js` file without a `package.json` to declare the dialect, and the
      # export checker uses `WebAssembly.Module.exports`. There is no npm step
      # and no `node_modules` — this repository hand-writes its bindings.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # THERE IS NO wasm-bindgen STEP HERE ANY MORE. This job used to resolve the
      # crate's version out of `Cargo.lock` and install the matching CLI, because
      # `wgpu` reached WebGPU through `web-sys` and every artifact imported ~340
      # functions only that tool could resolve. `crcbl-wgpu` is a
      # `cfg(not(target_arch = "wasm32"))` dependency of the umbrella now, the
      # artifacts import nothing, and the CLI cannot even run over them — see
      # `web/build.sh`'s "no wasm-bindgen" note. `cargo` and `node` are the
      # whole tool list — the page renderer was Python until 2026-08-19, and
      # dropping it also dropped an unpinned dependency on whatever `python3`
      # the runner image happens to ship, which no workflow ever installed.

      # Every JS file parses. Cheap, and it catches the class of mistake that
      # otherwise only appears as a blank page. `web/tools/*.js` is
      # `wasm-loader.js`, copied beside every artifact as the module the pages
      # `import init from` — a syntax error in it is every demo blank.
      - name: Syntax-check the shim
        run: >-
          node --check web/engine/*.js web/demos/*/*.js web/probe/*.js
          web/tools/*.js web/tools/*.mjs

      # THE COMMAND STREAM'S DRIFT CHECK. `crcbl-webgpu` encodes the stream in
      # Rust and `web/engine/gpu-stream.js` decodes it in JavaScript, so the
      # format has two hand-written halves and no compiler anywhere reads both.
      # This decodes the fixture the Rust side commits and asserts every field,
      # which is the only thing in the build that notices when they disagree.
      # It needs no wasm and no browser, so it runs before the build rather than
      # inside it, and a mismatch fails in seconds with the field named.
      - name: Decode the committed command-stream fixture
        run: node web/tools/stream-decode.mjs

      # THE TRANSPORT'S OWN CHECK. The step above is the *format*; this one is
      # the ABI in `crates/crcbl-webgpu/src/web.rs` — that the shim settles
      # readiness on the length alone, decodes exactly the window the pointer and
      # length describe, copies payloads out rather than leaving views on wasm
      # memory, and releases the buffer even when the decode throws. It drives
      # `web/engine/gpu-transport.js` against a synthetic `WebAssembly.Memory`
      # holding the same committed fixture, so like the step above it needs
      # neither a wasm module nor a browser and fails in seconds.
      - name: Drive the command-stream transport
        run: node web/tools/stream-transport.mjs

      # The same drift check pointed the other way. Replies travel JS to wasm,
      # so the JavaScript side is the encoder and Rust the decoder, and the
      # fixture is re-encoded here rather than decoded: this fails when the
      # browser half stops producing what the engine half reads.
      - name: Re-encode the committed reply-stream fixture
        run: node web/tools/reply-encode.mjs

      # The replayer's own logic, with WebGPU stubbed out: that every command
      # path queues exactly one reply, that an enumeration answers on a later
      # frame rather than the one that asked, and that a browser with no adapter
      # is answered rather than left waiting. The real thing needs `navigator.gpu`
      # and runs in the browser gate; this catches the half that does not.
      - name: Exercise the command-stream replayer
        run: node web/tools/gpu-replay.mjs

      # Builds each wasm-ready sample, assembles `target/site`, and runs two
      # checks against every artifact it produced.
      # They are the real gate, and they are what makes this job worth running
      # on a PR rather than only on a deploy:
      #
      #   check-exports.mjs — every `__crcbl_*` the Rust sources declare is
      #     exported, every symbol the shim calls exists, `memory` is exported,
      #     and the module imports nothing — literally zero, not "nothing
      #     outside the bindgen glue".
      #   smoke.mjs — instantiates the artifact under node with every import
      #     stubbed to throw and drives the documented boot sequence up to the
      #     frame that would need a GPU.
      #
      # `target/site` — the directory the upload step takes and the `deploy` job
      # publishes — renders through our own WebGPU path. There is no flag saying
      # so any more: `crcbl-webgpu` is the only GPU backend a wasm build links
      # at all, and `crcbl::backend` picks it because the target says so. The
      # crate that used to sit beside it, `crcbl-wgpu`, was deleted on
      # 2026-08-21. This step used to pass `CRCBL_WEB_BACKEND=webgpu` to choose between
      # the two. Every demo step below reuses this one build and therefore gates
      # the artifact that actually ships.
      - name: Build the site
        run: ./web/build.sh

      # The custom domain lives in `web/CNAME`, which `web/build.sh` copies into
      # the artifact along with the rest of `web/`. GitHub reads that file on
      # every deploy and *clears* the custom domain when it is missing — so
      # losing it does not fail anything, it silently moves the site back to
      # `kryptic-sh.github.io/crcbl/` and breaks every link to the demos. The
      # site repo guards the same file for the same reason.
      - name: Check the custom domain survived the build
        run: |
          set -euo pipefail
          test -f target/site/CNAME || {
            echo "::error::target/site/CNAME is missing — the deploy would drop crcbl.kryptic.sh"
            exit 1
          }
          domain="$(tr -d '[:space:]' < target/site/CNAME)"
          test "$domain" = "crcbl.kryptic.sh" || {
            echo "::error::target/site/CNAME says '$domain', expected crcbl.kryptic.sh"
            exit 1
          }
          echo "custom domain: $domain"

      # **Uploaded before a single gate runs, and that ordering is the point.**
      # This step used to be last, after fourteen browser gates, so a gate that
      # timed out took the artifact down with it and the `deploy` job below had
      # nothing to publish. The gates are their own jobs now and download this;
      # `deploy` still waits for them through its `needs`, so what changed is
      # that a red gate fails the deploy loudly instead of leaving it skipped.
      - name: Upload the site
        uses: actions/upload-artifact@v7
        with:
          name: site
          path: target/site
          if-no-files-found: error
          retention-days: 7

      # THE ASSUMPTIONS THE BROWSER GATE MAKES, CHECKED RATHER THAN HOPED FOR.
      # `ubuntu-latest` ships `/usr/bin/google-chrome` and `Xvfb`, and both of
      # those are facts about an image that changes; a runner that stopped
      # shipping either would otherwise turn the gate below into a step that
      # skips and reports success, which is the failure mode
      # `docs/plan/12-testing.md` warns about by name.
      - name: Check the browser gate's assumptions
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::no Chrome or Chromium on this runner. The image is assumed to ship /usr/bin/google-chrome."
            exit 1
          fi
          echo "browser: $browser ($("$browser" --version))"
          if ! command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is not on this image; installing it."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          echo "Xvfb: $(command -v Xvfb)"

      # THE P5 GATE LIVES IN THE `demos` JOB BELOW, NOT HERE.
      # It used to be fourteen steps in this job, run one after another because
      # they all drive the site this job builds. That made the bound this job
      # has to fit their *sum*, and the sum is what kept firing: the cap was
      # raised from 30 to 60 to 90 to 120 minutes across 2026-08-25 to
      # 2026-08-28, and on `80022df` the build reached 69 minutes with breach
      # killed on its own 20-minute step bound and shard never started. Every
      # one of those runs skipped the deploy rather than failing it, so the site
      # sat a commit behind while the workflow looked green.
      #
      # The site is uploaded above instead, before anything drives it, and the
      # gates download it — the way `probe-macos`, `probe-windows` and the
      # golden legs already do. They run as one matrix job per demo, so the
      # total is the slowest demo rather than the sum of all of them, and a
      # step cap goes back to bounding a hang. This is the structural answer
      # this job's header and `docs/backlog.md` have both been naming.

      # THE crcbl-webgpu SEAM GATE. **It must not be deleted**, nor folded into
      # the `demos` job below.
      #
      # It stayed in this job when the demo gates left because it costs eight
      # seconds against their minutes: a job of its own would spend longer
      # downloading the artifact than driving it.
      #
      # `web/tools/probe-groups.mjs` carries the PROBE groups — that file's own
      # header names the range, and restating it here has gone stale twice —
      # which drive `crcbl-webgpu`'s command stream directly rather than through
      # the engine: the wasm→JS→wasm round trip and the device it opens, a
      # surface, the capability query held against what `navigator.gpu` tells the
      # same page, then a buffer, an image and its view, a sampler, a bind-group
      # layout, a bind group, a shader module, a pipeline layout and both
      # pipelines — and from S onward the ones that read bytes back and compare
      # their *values*: a cleared texture, a drawn triangle, a compute shader's
      # storage writes, a copy chain, a sub-range fill, a presented canvas
      # frame, a reconfigured swapchain and an indirect draw. The `demos` job
      # proves the shipped artifact renders; this is the only thing that
      # proves the seam underneath it command by command. Delete it and every
      # probe group stops running with nothing going red.
      #
      # It runs on `target/site` — the build the `demos` job downloads and the
      # `deploy` job ships — and needs no second backend, which is what changed:
      # the probe exports install their own command-stream channel and a page has
      # exactly one, so they run wherever nothing else has claimed it.
      # `web/probe/` is a page with **no engine running** that loads a demo's
      # wasm module without booting it and pumps the channel itself. This step
      # used to build a whole second site on `wgpu` for that condition —
      # `crcbl-webgpu` linked but idle under a demo rendering through something
      # else — which tied twenty groups of seam coverage to a backend the site
      # does not ship, and which nothing can build any more: `crcbl-wgpu` is not
      # a wasm dependency of the umbrella at all.
      #
      # WHAT SHOWS IT IS STILL DOING ITS JOB is the line it prints naming every
      # group letter it recorded a check under, beside the count:
      # `web/run-probe-e2e.sh` fails when any group its own list enumerates is
      # missing from that line, so a
      # page that silently drove only some of the probes is a red step rather
      # than a smaller number nobody reads. It also names individual checks, so a
      # group that keeps its letter while dropping the claim that makes it worth
      # running fails there too.
      #
      # It brings up its own Xvfb, as the demo gates do. That is not cosmetic on
      # a runner with no GPU: under `--headless=new` plus SwiftShader the three
      # groups that acquire or present a canvas frame — X, Y and Z — never
      # resolve their readback map, while all three pass in the same browser
      # inside Xvfb.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        run: ./web/run-probe-e2e.sh

  # THE P5 GATE, ONE JOB PER DEMO.
  #
  # Loads the site `build` produced in a real browser, opens a WebGPU device,
  # drives real input into the canvas of every demo that has one, and reads the
  # canvas back to prove it is neither blank nor still.
  #
  # A GitHub runner has no GPU, which is why the harness runs the browser inside
  # Xvfb against Chromium's bundled SwiftShader: that is the one combination
  # whose canvas pixels can be read back at all (the table is in
  # `web/run-browser-e2e.sh`). It verifies that for itself with a known-colour
  # clear before it interprets anything, so a runner where the readback stops
  # working fails here rather than reporting a working renderer as blank.
  #
  # The driver waits for `crcbl-webgpu`'s own `hal: webgpu adapter` line at
  # boot, which is a check that the *right* backend opened the device rather
  # than that some backend did. It is not configurable: a browser build has one
  # GPU backend, so a `hal: wgpu adapter` line here would mean the umbrella's
  # manifest had regressed.
  #
  # **A MATRIX RATHER THAN A LIST OF STEPS, SINCE 2026-08-28.** These were
  # fourteen steps of `build`. `build`'s header carries what that cost; what it
  # bought here is that the wall clock is the slowest demo instead of the sum,
  # and that `fail-fast: false` lets thirteen demos report while one is red —
  # under the old arrangement the first failure ended the job and every gate
  # behind it went unrun, which is why sparks had not completed since `cec27b3`
  # and shard had never completed at all.
  #
  # **NOTHING HERE BUILDS THE SITE**, and no Rust toolchain is installed:
  # `web/run-browser-e2e.sh` only invokes `web/build.sh` when `target/site` is
  # missing, and the download above puts it there. Fourteen rebuilds would be
  # fourteen different artifacts under test.
  #
  # The script warns that its sources are newer than the site it drives — a
  # fresh checkout's mtimes always are, and the artifact carries the build
  # job's. That warning is for a developer reusing a stale local `target/site`;
  # here the site is this commit's by construction, so the line is noise rather
  # than a finding. `probe-macos` and `probe-windows` have printed the same one
  # since they were written.
  #
  # **The cap is a bound on a hang, not a budget**, and on 2026-08-31 it was
  # measured to be sitting below the legitimate range rather than above it. The
  # old number was argued from `80022df`, where the slowest gate to complete was
  # puppet at 774 s. That reference has been overtaken: on run 33375515324
  # breach completed in 39 minutes, and shard has now been killed at the cap on
  # three runs out of five while completing in 24 and 26 minutes on the other
  # two.
  #
  # **What settles it as slowness rather than a stop is the spread between runs
  # of the same code.** `PassStats` in each demo's uploaded page log reports a
  # p50 and p95 per pass over the run's last frames. Across four Pages runs the
  # forward pass reads, in ms of p50:
  #
  #     quarry   2681.151  1355.780  2703.682  2714.067
  #     sparks    806.025  1254.571   835.170  1234.698
  #     breach   3907.520  4034.938  3480.389  3969.237
  #
  # quarry's slowest run is 2.0x its fastest and sparks' is 1.6x, with no change
  # to either demo between them — twice the work in the same job is far more
  # spread than a 39-minute job under a 45-minute cap can absorb.
  #
  # **That spread is the workload, not the machine**, which matters because only
  # one of those can be fixed here. The same logs time `ssao`, a full-screen
  # pass whose cost is set by the resolution rather than by the scene: across
  # the same four runs puppet's reads 137.557, 136.668, 138.822 and 139.557 ms
  # while quarry's forward pass halves. A runner running at half speed would
  # have moved both. So the machine is steady and the demos reach different
  # simulation states from run to run, which is also why the heavy ones can
  # wander past a cap that fits them most of the time. Nothing in the sweep
  # points at a demo stopping.
  #
  # So the cap is set clear of the slowest observed completion doubled, which
  # is what the measured variance asks for, and a generous cap still costs
  # nothing on a run that passes. **The cost of getting this wrong is not a
  # red gate**: a job the cap kills is `cancelled`, `deploy` is then skipped
  # rather than failed, and the published site silently stays at the last
  # commit that got through — that has now happened three times. If a demo
  # ever does stop, the live page log `web/tools/browser-e2e.mjs` writes as
  # lines arrive is what says where.
  demos:
    name: render ${{ matrix.demo }} in a real browser
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        demo:
          - breakout
          - flappy
          - asteroids
          - horde
          # hud is the one demo that takes no input at all — `HostedGame::key_event`
          # is empty by design and a scripted ticker drives the page — so group C
          # reads "the simulation is advancing" off the ticker's own rng cursor.
          # It is not the only row the driver dispatches no key for: `key: null`
          # says "no start key", which several demos that do take input carry
          # because they open with no waiting state to leave. Each row in
          # `web/tools/browser-e2e.mjs` gives its own reason.
          - hud
          # quarry and lantern are the site's two 3D demos, and until 2026-08
          # neither ran here for one cause: `crcbl-render`'s draw-argument pass
          # bound fourteen storage buffers in a single compute stage, and
          # Chrome's SwiftShader adapter reports a ceiling of ten, so the
          # pipeline was never created and the canvas stayed black. That pass
          # binds eight now — `crates/crcbl-render/src/draw_gen.rs` records the
          # merges — and both score every check here.
          #
          # What keeps them slow is not the picture but the simulation: the
          # runner's software rasteriser advances the demo's clock at a fraction
          # of real time, and `web/tools/browser-e2e.mjs` scales every wall-clock
          # budget by the beat it measures, so a slower frame stretches the run
          # rather than failing it. Each demo's log prints its own factor —
          # 1.0x for the 2D demos, 51.1x for breach on `80022df`. If one of
          # these goes red, read **which** check failed before touching a
          # number: the cap says "out of wall clock", never "too slow".
          - quarry
          - lantern
          # viewer and orbit are the two samples whose subject does not move on
          # its own, and both answer group C off something the sample itself
          # advances — viewer's idle turntable, orbit's scripted ascent.
          - viewer
          - orbit
          # options goes one further: nothing it draws moves at all, because a
          # settings screen has nothing to animate. It is the one demo whose
          # `EXPECTATIONS` row carries `still`, which swaps group D's frame hash
          # for the loop's own frame counter — see that row.
          - options
          - bracket
          - puppet
          - sparks
          - breach
          # shard is the heaviest scene the site ships and the slowest thing
          # here: 88 s locally on the same software rasteriser, and "every later
          # budget scaled 87.0x" in the one CI log that reached it. It has never
          # completed in this workflow — every run before `e010015` was
          # cancelled by a later push while it was still going, and every run
          # since died at a demo ahead of it. This job is what gives it a clock
          # of its own.
          - shard
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: target/site

      # THE ASSUMPTIONS THE BROWSER GATE MAKES, CHECKED RATHER THAN HOPED FOR.
      # `ubuntu-latest` ships `/usr/bin/google-chrome` and `Xvfb`, and both of
      # those are facts about an image that changes; a runner that stopped
      # shipping either would otherwise turn the gate below into a step that
      # skips and reports success, which is the failure mode
      # `docs/plan/12-testing.md` warns about by name.
      - name: Check the browser gate's assumptions
        run: |
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::no Chrome or Chromium on this runner. The image is assumed to ship /usr/bin/google-chrome."
            exit 1
          fi
          echo "browser: $browser ($("$browser" --version))"
          if ! command -v Xvfb >/dev/null 2>&1; then
            echo "Xvfb is not on this image; installing it."
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends xvfb
          fi
          echo "Xvfb: $(command -v Xvfb)"

      - name: Render ${{ matrix.demo }} in a real browser
        run: CRCBL_WEB_E2E_DEMO=${{ matrix.demo }} ./web/run-browser-e2e.sh

      # The canvas as a PNG and the page's whole log. On a failure these are the
      # first two things anyone will ask for, and neither can be reconstructed
      # from the step log. Named per demo: one artifact name across the matrix
      # would have fourteen jobs uploading over each other.
      - name: Upload the browser evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: web-e2e-${{ matrix.demo }}
          path: target/web-e2e
          if-no-files-found: warn
          retention-days: 7

  # THE SAME SEAM GATE, ON THE OTHER TWO PLATFORMS.
  #
  # `build` and `demos` run every browser gate on `ubuntu-latest`, so until
  # these two jobs existed "the WebGPU backend works in a browser" meant "on
  # Linux, under SwiftShader". These run the **probe gate only** —
  # `web/run-probe-e2e.sh`,
  # which drives `crcbl-webgpu`'s command stream verb by verb — and not the five
  # demo steps: measured on a real run, the probe costs about 2 seconds of
  # browser time against the demos' 2m38s, and it is the gate that reads bytes
  # back and compares their values rather than watching a canvas change.
  #
  # NEITHER OF THEM BUILDS THE SITE. `web/build.sh` needs node and a wasm
  # toolchain, and a second and third build would be three different artifacts
  # under test; both download the `site` artifact `build` uploaded, so all three
  # platforms drive the identical bytes that ship.
  #
  # Separate jobs rather than a matrix on `build`: a matrix would rebuild the
  # site three times over and its three uploads would collide on one artifact
  # name.
  #
  # **`continue-on-error` is a state with an exit condition, not a setting.** An
  # unproven gate that blocks the Pages deploy is worse than no gate, and one
  # that silently never fails is worse still, so each job carries it only until
  # it has been green three runs.
  #
  # **Neither job carries it any more.** macOS served its three at 57/57 over
  # groups G to AA, headless against a real Apple adapter. Windows took the other
  # exit: its first run found no WebGPU adapter at all, its second died reading
  # Chrome's port file, and its third reached 53/57 with four readbacks timing
  # out — which is a measurement, so the job now gates on exactly that, through
  # the `--expect-fail` list on its run step. Both jobs can fail the workflow.
  probe-macos:
    name: probe the seam on macOS
    needs: build
    # **Switched off on 2026-08-30, while Metal work is deferred.** The job
    # reddened every run since `b6b0c32`: quarry's frame loop stops on the
    # Apple adapter once the canvas is blurred and never resumes — a demo bug
    # on Metal, not a gate bug, and `docs/backlog.md`'s "The macOS probe job
    # stops getting frames after group E's pause" carries the evidence and the
    # next steps. Nothing downstream needs this job (`deploy` needs `build` and
    # `demos`), so a red here was noise on every push and hid nothing. Delete
    # this `if` to bring it back when that entry is taken up; the job below is
    # left whole so that is the only change.
    if: false
    # **Never `macos-14`.** All three hosted images report an
    # `Apple Paravirtual device`, and only some of them have one that executes:
    # `macos-14`'s `MTLCreateSystemDefaultDevice()` returns nil, while `15` and
    # `26` both run shaders. `ci.yml`'s `mtl-e2e` job carries the measurement
    # and the run it came from, and `docs/backlog.md` the per-image output.
    # Pinned to `15` rather than `macos-latest` so the image this gate is proven
    # on does not change under it while it is still unproven.
    runs-on: macos-15
    # Was 20 while this job ran the probe alone; seven demo gates follow it now,
    # and the two 3D ones took over ten minutes each on the Linux runner after
    # the shadow ladder's last two rungs — see the build job's header.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: target/site

      # A missing browser must not be mistaken for a failing gate, so it is
      # named, executed and printed before anything drives it.
      - name: Check the browser gate's assumptions
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$chrome" ]; then
            echo "::error::no Google Chrome at $chrome. The macOS image is assumed to ship it."
            exit 1
          fi
          echo "browser: $chrome ($("$chrome" --version))"
          echo "CRCBL_CHROMIUM=$chrome" >> "$GITHUB_ENV"

      # Headless, and that is the whole difference from the Linux run. A
      # headless Chrome can read a WebGPU canvas back on macOS and cannot on
      # Linux or Windows — the reason `build` brings up an Xvfb and the reason
      # the Windows job below runs headed. There is no Xvfb here to bring up
      # anyway: it is an X server and macOS has none.
      #
      # The adapter mode resolves to `hardware` on its own: `auto` is
      # SwiftShader on Linux only, because Chrome's Dawn has no Vulkan backend
      # on macOS and so has no software adapter to fall back to.
      # `web/tools/probe-e2e.mjs` carries the table.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        run: ./web/run-probe-e2e.sh --headless

      # **THE DEMO GATES, ON THE SECOND OF THE THREE OPERATING SYSTEMS WE
      # SUPPORT.** `crcbl-webgpu` is the browser backend and a browser is not one
      # platform: which adapter Dawn picks, what `getPreferredCanvasFormat()`
      # answers, the limits an adapter advertises and how the canvas is
      # composited are all decided per OS. Until 2026-08-20 every demo gate in
      # this repository ran on `ubuntu-latest` alone, so the backend the samples
      # ship on had its whole browser-side evidence from one OS and one Chromium.
      #
      # **After the probe, never before it.** A failing step ends the job, so the
      # probe — the older gate, and the one that holds this backend's
      # `supports()` matrix against `DIVERGENCES` in group AB — reports first and
      # cannot be masked by a demo.
      #
      # **The adapter is left at `auto` on purpose.** That mode tries hardware,
      # falls back to SwiftShader, and takes the first whose *readback control*
      # passes — an adapter that renders but whose pixels cannot be read is no
      # use here, and this runner has a real GPU where the Linux one does not.
      # Forcing a mode would be guessing at which of the two this image serves.
      #
      # `--headless` rather than Xvfb, which is an X server and does not exist
      # here; the script would fall back to it anyway and this says so out loud.
      # breakout goes first because it is the richest gate at 48 checks and the
      # first thing it does is that readback control, so if this platform cannot
      # report canvas pixels the job says so in its first demo rather than its
      # seventh. The two 3D demos go last and carry their own timeouts: they are
      # the heaviest frames the site ships.
      - name: Render breakout in a real browser
        run: CRCBL_WEB_E2E_DEMO=breakout ./web/run-browser-e2e.sh --headless

      - name: Render flappy in a real browser
        run: CRCBL_WEB_E2E_DEMO=flappy ./web/run-browser-e2e.sh --headless

      - name: Render asteroids in a real browser
        run: CRCBL_WEB_E2E_DEMO=asteroids ./web/run-browser-e2e.sh --headless

      - name: Render horde in a real browser
        run: CRCBL_WEB_E2E_DEMO=horde ./web/run-browser-e2e.sh --headless

      - name: Render hud in a real browser
        run: CRCBL_WEB_E2E_DEMO=hud ./web/run-browser-e2e.sh --headless

      - name: Render quarry in a real browser
        timeout-minutes: 20
        run: CRCBL_WEB_E2E_DEMO=quarry ./web/run-browser-e2e.sh --headless

      - name: Render lantern in a real browser
        timeout-minutes: 20
        run: CRCBL_WEB_E2E_DEMO=lantern ./web/run-browser-e2e.sh --headless

      - name: Render viewer in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=viewer ./web/run-browser-e2e.sh --headless

      - name: Render orbit in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=orbit ./web/run-browser-e2e.sh --headless

      - name: Render bracket in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=bracket ./web/run-browser-e2e.sh --headless

      - name: Render puppet in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=puppet ./web/run-browser-e2e.sh --headless

      - name: Render sparks in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=sparks ./web/run-browser-e2e.sh --headless

      # Twenty, for the reason the build job's breach step carries.
      - name: Render breach in a real browser
        timeout-minutes: 20
        run: CRCBL_WEB_E2E_DEMO=breach ./web/run-browser-e2e.sh --headless

      # See the windowed job's note on this step.
      - name: Render shard in a real browser
        timeout-minutes: 20
        run: CRCBL_WEB_E2E_DEMO=shard ./web/run-browser-e2e.sh --headless

      - name: Render options in a real browser
        timeout-minutes: 12
        run: CRCBL_WEB_E2E_DEMO=options ./web/run-browser-e2e.sh --headless

  probe-windows:
    name: probe the seam on Windows
    needs: build
    runs-on: windows-latest
    # Back to 20: this job runs the probe alone again, the demo gates having
    # been measured impossible here — see the note below the probe step.
    timeout-minutes: 20
    env:
      # THE PAIRING THAT READS AS A CONTRADICTION AND IS NOT. `--headless` below
      # tells **the script** not to go looking for an Xvfb Windows cannot have;
      # this tells **the driver** not to pass `--headless=new`. A Windows runner
      # has its own desktop session, and the canvas needs it: headless there
      # renders the frame but never gets it to a compositor that can hand the
      # pixels back.
      CRCBL_WEB_E2E_HEADED: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: target/site

      # Chrome's own installer records where it put itself under `App Paths`,
      # and that is where the runner image's install script reads it from too —
      # so this asks the registry rather than hardcoding a Program Files path
      # that the image is free to change.
      - name: Check the browser gate's assumptions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe'
          )
          $chrome = $null
          foreach ($key in $keys) {
            $value = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).'(default)'
            if ($value -and (Test-Path -LiteralPath $value)) { $chrome = $value; break }
          }
          if (-not $chrome) {
            $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path -LiteralPath $chrome)) {
            Write-Output "::error::no Chrome in the registry under App Paths, and none at $chrome. The Windows image is assumed to ship it."
            exit 1
          }
          # `chrome.exe --version` writes nothing to a console on Windows — it is
          # a GUI-subsystem binary — so the version comes off the file itself.
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          Write-Output "browser: $chrome ($version)"
          "CRCBL_CHROMIUM=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `shell: bash` is Git Bash, which the runner ships. `pwd -W` is what makes
      # the path it hands the driver a Windows one: everything under this shell
      # sees `/d/a/crcbl/...`, and Node is a native Windows binary that would
      # resolve that against the current drive root and find no site there.
      #
      # **SwiftShader is forced here, having measured the alternative.** The
      # first run of this job took the default `hardware` mode, found Chrome
      # 151.0.7922.109 exactly where the registry said, and died at
      # `requestAdapter() returned no adapter — no GPU to drive`. So a
      # GPU-less `windows-latest` exposes no WebGPU through D3D at all, and in
      # that mode this job gates nothing.
      #
      # The known cost, recorded in `docs/backlog.md` from Chrome 151: this
      # moves **Dawn** to SwiftShader while Chromium's shared-image device
      # stays on D3D11, and a canvas handed between two devices reads back as
      # uninitialised memory behind `ReadPixels: Source shared image is not
      # accessible`.
      #
      # **`--expect-fail X,Y,Z,AA` IS THE MEASUREMENT THAT REPLACED THE GUESS.**
      # Run 32085351076 reached `53/57 checks passed` over groups G through AA,
      # with those four failing identically — `no … readback in 90000 ms`, no
      # device error anywhere — and every other group green. So this job now
      # gates: those four produce no verdict on this runner, everything else
      # must pass, and the driver fails the run if any of the four starts
      # passing, which is what stops this line outliving the defect.
      #
      # ONLY X IS THE CANVAS FAULT; Y, Z AND AA ARE COLLATERAL. Z draws
      # indirectly into a texture the replayer owns and AA copies a depth plane
      # — neither goes near a canvas, and both pass on Linux in the same
      # headless SwiftShader browser once X and Y are stubbed out so they submit
      # nothing. The page has one `GPUDevice` and therefore one queue, and a
      # `mapAsync` resolves only behind the submits ahead of it, so X's stuck
      # present strands every readback queued after it. Giving the canvas groups
      # their own device, or running them last, would recover Z and AA here;
      # `docs/backlog.md` is where that belongs until someone does it.
      - name: Gate crcbl-webgpu's seam on a standalone probe page
        shell: bash
        run: >-
          SITE_DIR="$(pwd -W)/target/site" ./web/run-probe-e2e.sh --headless
          --adapter swiftshader --expect-fail X,Y,Z,AA

      # **THE DEMO GATES DO NOT RUN HERE, AND THAT IS A MEASUREMENT.** They were
      # added on 2026-08-20 and taken out the same day, because a GPU-less
      # `windows-latest` cannot serve one at all. The harness said so itself, in
      # its own words, from run 32387226623:
      #
      #     ..   control page under "hardware": adapter none, readback no adapter
      #     ..   control page under "swiftshader": adapter google swiftshader, readback rgb(0,0,0)
      #     ok   a WebGPU adapter is granted — google swiftshader
      #     FAIL a known-colour clear reads back as that colour —
      #          tried hardware, swiftshader; none returned pixels
      #     web e2e: this browser cannot report canvas pixels with any adapter
      #              mode; refusing to run the render checks, because passing
      #              them would mean nothing
      #
      # Both modes are dead ends and for different reasons: hardware has no
      # adapter on a runner with no GPU, and SwiftShader has one whose canvas
      # reads back as uninitialised memory — the same
      # `ReadPixels: Source shared image is not accessible` that costs the probe
      # step above its X, Y, Z and AA. Every demo gate reads the canvas in group
      # A's readback control, in group D and in group G, so there is no
      # configuration left to try.
      #
      # **What still covers this platform**: the probe step above, which reads
      # its pixels out of wasm memory rather than off a canvas, and the
      # `render-harness` job's Windows leg, which renders offscreen for the same
      # reason. What is *not* covered here is the demo gates' own subject — real
      # input, touch, focus and the canvas a visitor looks at — and that is a
      # gap in this OS's coverage rather than something the other two make good.
      # `docs/backlog.md` carries it with the numbers.

  # THE WebGPU PARITY GATE — the only thing anywhere that holds a browser's
  # *pixels* against the goldens the native suites compare against.
  #
  # Everything else in this workflow reads text. The five demo steps assert log
  # lines and watch a canvas change; the probe gate reads bytes back and checks
  # their values, but against colours it computed itself, not against a
  # committed picture. So "the browser draws the same frame `vk`/`mtl`/`dx12`
  # draw" was a claim nothing made — and that gap is not hypothetical: the sRGB
  # "everything renders too dark" defect shipped straight through it, because
  # the goldens only ever covered the offscreen native path and the browser gate
  # only ever read text.
  #
  # `web/run-render-harness-e2e.sh` closes it: it drives the same
  # backend-agnostic `Scene`s through `crcbl-webgpu` in a real browser, reads
  # each frame back, and hands the bytes to `crcbl-golden` at
  # `Tolerance::RASTERISER` — the same comparator and the same numbers
  # `crcbl/tests/render_e2e.rs` uses. Nothing in JavaScript diffs a pixel.
  #
  # IT NEITHER `needs: build` NOR DOWNLOADS THE `site` ARTIFACT, and that is the
  # one place it departs from the two probe jobs above. Those download `site` so
  # every platform drives the identical bytes that ship — but `web/build.sh`
  # does not build `apps/render-harness` at all, and the harness page is not part
  # of the deployed site, so there are no shipped bytes here to reuse. It
  # assembles its own wasm and builds the comparator natively, which is also why
  # it holds its own `rust-cache` key: `build` caches a wasm-only target
  # directory and this one needs a host build beside it. Independent of `build`,
  # so it runs in parallel with it rather than behind it.
  #
  # NO Xvfb, unlike every other browser step in this file. The harness renders to
  # an offscreen target and reads it back into wasm memory; there is no canvas
  # anywhere in it, so none of the compositor machinery the demo and probe gates
  # need applies. Headless Chromium plus SwiftShader is the whole environment.
  #
  # **`--expect-fail ssr,ui` IS A MEASUREMENT, NOT A TOLERANCE.** Nine of the
  # scenes match SwiftShader's output exactly within
  # `Tolerance::RASTERISER`. Two do not, and reproduce to the digit across runs:
  # `ssr` at 58 grossly-wrong pixels and ssim 0.988822, `ui` at 506 and ssim
  # 0.983257. They are rasteriser differences rather than backend defects — the
  # same `ssr` scene matches on real hardware with a max channel delta of 9 and
  # zero gross pixels, and its diff is banding confined to the reflection
  # ray-march and the horizon edges, so the geometry and the instancing that a
  # real regression would break are right. A step reporting 9 of 11 as success
  # would be worse than no step, so the two are excused *by name*: they still
  # render, still compare, still print their numbers every run, and
  # `web/tools/render-harness-verdict.mjs` fails this job the moment either one
  # starts matching, or the moment anything else stops. Widening the tolerance
  # instead would have quietly weakened every one of them.
  #
  # LINUX ONLY, DELIBERATELY. The expected-fail list is exact in both
  # directions, so it can only be written for a platform whose per-scene outcome
  # has been measured — and a guessed list fails the run either way, as a
  # regression or as a stale entry. Only this one has been measured.
  #
  #   macOS    would drive a real Apple adapter, where the two SwiftShader
  #            differences plausibly do not arise at all — which is exactly the
  #            guess this mechanism refuses to encode. It needs one run to
  #            record what the scenes actually do there.
  #   Windows  forces SwiftShader (`probe-windows` measured that a GPU-less
  #            `windows-latest` exposes no WebGPU through D3D), so it would
  #            likely fail the same two — still a guess. Note that
  #            `probe-windows`'s four expected failures do NOT transfer here:
  #            those are a canvas readback that never resolves and strands
  #            everything queued behind it on the page's single queue, and this
  #            harness never touches a canvas.
  #
  # `docs/backlog.md` is where enabling either belongs until someone runs it.
  render-harness:
    name: hold the browser's pixels against the goldens (${{ matrix.label }})
    # **Three operating systems, because `crcbl-webgpu` ships in a browser and a
    # browser is not one platform.** Until 2026-08-20 this job was Linux-only, so
    # the only gate anywhere that holds a browser's *pixels* against the goldens
    # answered for one OS and one Chromium.
    #
    # `fail-fast: false` so a leg that goes red does not take the other two with
    # it. Each leg is a different question, and losing two answers to learn one
    # is a bad trade on runners this slow.
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux is the leg that has always run, and nothing about it changes:
          # SwiftShader, and the two scenes a software rasteriser cannot serve.
          - os: ubuntu-latest
            label: linux
            adapter: swiftshader
            excuse: --expect-fail ssr,ui
            timeout: 45
          # **macOS runs on the machine's own GPU, and gates every one.** Not a
          # preference — Chrome's Dawn has no Vulkan backend on macOS and so has
          # no software adapter at all, which is why `web/tools/probe-e2e.mjs`'s
          # table says `auto` resolves to hardware there. Measured on 2026-08-20
          # before this leg was written: the same harness in `hardware` mode on
          # an RX 7900 XTX matches **11 of 11** goldens at `Tolerance::RASTERISER`
          # — `ssr` and `ui` included, so those two are a SwiftShader limit and
          # not a browser-backend defect. That is why this leg carries no excuse
          # list and is the *stronger* of the three. If Metal turns out to differ
          # on a scene, the answer is a measured excuse here, not a wider
          # tolerance.
          - os: macos-15
            label: macos
            adapter: hardware
            excuse: ''
            # Ten more than Linux: this leg also builds `crcbl-cli` natively and
            # renders a reference screenshot per scene through Metal for the
            # cross-backend step.
            timeout: 55
          # Windows takes SwiftShader like Linux, so it asks the same rasteriser
          # the same question on a different OS: what it can catch is the wasm,
          # the browser and the platform plumbing, not a third rasteriser.
          # Hardware is not an option — the probe job's first run died at
          # `requestAdapter() returned no adapter`, so a GPU-less
          # `windows-latest` exposes no WebGPU through D3D at all. This harness
          # never touches a canvas, which is the one thing SwiftShader breaks
          # there, so the probe's excused X, Y, Z and AA have no bearing here.
          - os: windows-latest
            label: windows
            adapter: swiftshader
            excuse: --expect-fail ssr,ui
            # **Sized for one cold run, because this leg has never had a warm
            # one.** 90 was extrapolated from a first attempt cancelled at
            # 45m20s — it had reached `11/11 scene(s) rendered and saved` with
            # the clock running out inside the *native* comparator's cargo
            # build — and the extrapolation was wrong: run 32557088937 spent
            # 5358s in that single step and was still killed by the timeout.
            #
            # That failure is self-perpetuating, which is the reason for the
            # number rather than the slowness. `Swatinem/rust-cache`'s save runs
            # in a post step, and a post step does not run when the job is
            # cancelled: on that run Windows' `Post Run Swatinem/rust-cache@v2`
            # is **skipped** while Linux's is `success`. So the cache is never
            # written, the next run is cold again, and it times out again. The
            # same thing happened nine times in a row before it through
            # `cancel-in-progress` — see `docs/backlog.md`.
            #
            # Linux and macOS finish the identical step in 43s and 31s off a
            # warm cache. Once one Windows run completes and saves, this leg
            # should join them and the number can come back down — lower it
            # against a measured warm run, not a guess.
            timeout: 180
    runs-on: ${{ matrix.os }}
    # Longer than `build`'s: this one compiles `render-harness` twice, once to
    # wasm and once for the host, and the host half pulls in the native backend.
    # Per leg, because Windows needs twice what the other two do — see the
    # matrix entry.
    timeout-minutes: ${{ matrix.timeout }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: render-harness-${{ matrix.label }}

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Named, executed and printed before anything drives it, for the same
      # reason `build` does it: a missing browser must fail here rather than
      # turn the gate below into a step that skips and reports success.
      #
      # The ALSA headers first: the comparator is a native build and the
      # workspace reaches `cpal` through `crcbl-audio`, so it links ALSA. This
      # job's first CI run failed there rather than on any golden — every one of them
      # scenes rendered, and then `alsa-sys` could not find its headers.
      # `libasound2-dev` because `alsa-sys` links against it and this job's first
      # CI run failed there rather than on any golden. `mesa-vulkan-drivers` and
      # `libvulkan1` are the second comparison's: the cross-backend step below
      # renders each scene through `CRCBL_GPU=vk` on lavapipe, and this job had
      # no Vulkan at all. Linux only — the other two legs build the comparator
      # against their own platform's audio and GPU stacks, which ship with the
      # image.
      - name: Install the ALSA headers and a Vulkan driver
        if: runner.os == 'Linux'
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev libvulkan1 mesa-vulkan-drivers

      - name: Check the browser gate's assumptions
        if: runner.os == 'Linux'
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$browser" ]; then
            echo "::error::no Chrome or Chromium on this runner. The image is assumed to ship /usr/bin/google-chrome."
            exit 1
          fi
          echo "browser: $browser ($("$browser" --version))"

      # The same discovery `probe-macos` does, and for the same reason: this
      # image ships Chrome in `/Applications` rather than on the path.
      - name: Check the browser gate's assumptions
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          chrome="/Applications/Google Chrome.app/Contents/MacOS/Google Chrome"
          if [ ! -x "$chrome" ]; then
            echo "::error::no Google Chrome at $chrome. The macOS image is assumed to ship it."
            exit 1
          fi
          echo "browser: $chrome ($("$chrome" --version))"
          echo "CRCBL_CHROMIUM=$chrome" >> "$GITHUB_ENV"

      # The same discovery `probe-windows` does, registry first. `chrome.exe
      # --version` writes nothing to a console on Windows — it is a
      # GUI-subsystem binary — so the version comes off the file itself.
      - name: Check the browser gate's assumptions
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $keys = @(
            'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe',
            'HKLM:\SOFTWARE\WOW6432Node\Microsoft\Windows\CurrentVersion\App Paths\chrome.exe'
          )
          $chrome = $null
          foreach ($key in $keys) {
            $value = (Get-ItemProperty -Path $key -ErrorAction SilentlyContinue).'(default)'
            if ($value -and (Test-Path -LiteralPath $value)) { $chrome = $value; break }
          }
          if (-not $chrome) {
            $chrome = Join-Path $env:ProgramFiles 'Google\Chrome\Application\chrome.exe'
          }
          if (-not (Test-Path -LiteralPath $chrome)) {
            Write-Output "::error::no Chrome in the registry under App Paths, and none at $chrome. The Windows image is assumed to ship it."
            exit 1
          }
          $version = (Get-Item -LiteralPath $chrome).VersionInfo.ProductVersion
          Write-Output "browser: $chrome ($version)"
          "CRCBL_CHROMIUM=$chrome" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # `shell: bash` on every leg, so one script runs everywhere; on Windows
      # that is Git Bash. `SITE_DIR` is spelled through `pwd -W` there for the
      # reason the probe job gives: Node is a native Windows binary and would
      # resolve this shell's `/d/a/crcbl/...` against the current drive root.
      - name: Compare every golden scene rendered in a browser
        shell: bash
        env:
          CRCBL_WEB_E2E_ADAPTER: ${{ matrix.adapter }}
        run: |
          set -euo pipefail
          if [ "${RUNNER_OS}" = "Windows" ]; then
            export SITE_DIR="$(pwd -W)/target/render-harness-site"
          fi
          ./web/run-render-harness-e2e.sh ${{ matrix.excuse }}

      # **The same readbacks, held against a native backend instead of a
      # committed image.** The step above asks "does the browser draw the
      # golden"; this asks "does the browser draw what vk draws, right now",
      # with no reference between them that could have drifted with both.
      #
      # That is what the native vk-against-wgpu gate did, and it was the one
      # thing `crcbl-wgpu` was kept for — so this is its replacement, and a wider
      # one: every golden scene rather than three, against a genuinely separate
      # implementation rather than a second abstraction over one Vulkan driver.
      # Both the crate and that gate went on 2026-08-21.
      #
      # It reuses the readbacks the step above produced, so the wasm build and
      # the browser run are not repeated. Measured on radv against
      # Chromium-on-SwiftShader: nine of eleven match, `sprite` byte-identical,
      # and the two that do not are the same `ssr` and `ui` — tighter than the
      # golden comparison rather than looser, `ssr` differing in 1355 pixels
      # here against 25611 there.
      #
      # **Linux only for now**, and that is a scope line rather than a limit:
      # `--reference mtl` on macOS and `--reference dx12` on Windows would each
      # compare a browser against its own platform's native backend on the same
      # machine, which is stronger still. Measured on 2026-08-20 that the shape
      # works with a hardware-rendered browser — the harness in `hardware` mode
      # on an RX 7900 XTX matched native vk on **11 of 11** scenes — so what is
      # left is the per-OS wiring, not the idea. `docs/backlog.md` carries it.
      - name: Hold the browser's pixels against vk's
        if: runner.os == 'Linux'
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: ./web/run-cross-backend-e2e.sh --reference vk --expect-fail ssr,ui

      # **The strongest form of the same question, and the reason this leg is
      # worth its runner minutes.** On Linux the browser renders on SwiftShader
      # and the reference on lavapipe: two software rasterisers, so `ssr` and
      # `ui` have to be excused there. Here both halves are **the same Metal
      # device** — the harness above ran at `adapter hardware`, and this renders
      # the same scenes natively through `CRCBL_GPU=mtl` on the machine
      # that just drew them. Same GPU, same driver, no committed reference
      # between them that could have drifted with both.
      #
      # **So it carries no `--expect-fail`**, and that is a claim rather than an
      # omission: run 32387226623's macOS leg matched **11 of 11** goldens with
      # no excuse list, so a mismatch here is a disagreement between this
      # backend and `crcbl-mtl` on one device, which is exactly what this gate
      # is for. If one ever appears, the answer is to read the diff artifact,
      # not to add a name here.
      #
      # This is also the heir to `cross-backend image compare (vk vs wgpu)` on a
      # second platform: every golden scene rather than three, and a browser against a
      # genuinely separate implementation rather than a second abstraction over
      # one driver. It reuses the readbacks the step above produced, so neither
      # the wasm build nor the browser run is repeated — what it adds is a native
      # `crcbl-cli` build and one screenshot per scene.
      - name: Hold the browser's pixels against Metal's
        if: runner.os == 'macOS'
        run: ./web/run-cross-backend-e2e.sh --reference mtl

      # The rendered frame, the golden and the diff, for every scene that did
      # not match — including the two excused ones, whose numbers are the record
      # the `--expect-fail` list is held to. None of the three can be
      # reconstructed from the step log.
      - name: Upload the golden diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: render-harness-golden-diff-${{ matrix.label }}
          path: target/golden-diff
          if-no-files-found: warn
          retention-days: 7

  deploy:
    name: deploy to GitHub Pages
    # **`demos` as well as `build`, since 2026-08-28.** The browser gates used
    # to be steps of `build`, so waiting for `build` was waiting for them. Now
    # that they are their own jobs, dropping them from this list would publish
    # a site no gate had passed.
    needs: [build, demos]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Scoped to this job alone. Nothing here compiles or runs repository code:
    # it downloads the artifact the `build` job produced and hands it to Pages.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: site
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v5
