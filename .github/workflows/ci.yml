name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# Least privilege by default; a future release job opts itself up to
# `contents: write` at job level.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # A CI panic with no backtrace costs a whole re-run.
  RUST_BACKTRACE: 1
  # Opt JS-based actions into Node 24 ahead of the GitHub default flip, so
  # upstream incompatibility surfaces here rather than on a release day.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

concurrency:
  group:
    ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref
    }}
  # Never cancel a tag run mid-flight — a half-cancelled release is worse than a
  # slow one. No tags exist yet; wiring it now costs nothing.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Every job carries `timeout-minutes`. A wedged step otherwise burns the full
# 6-hour runner budget silently; the nextest `slow-timeout` in
# `.config/nextest.toml` is the same guard one level down, per test.
jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - run: cargo fmt --all --check
      # `--all` covers the workspace, and `crates/crcbl-net/fuzz` is its own
      # workspace, so it is invisible to the line above. The check used to live
      # in the `decoder-fuzz` job, which pins a nightly toolchain that carries
      # no `cargo-fmt` — so it failed on rustup rather than on formatting, and
      # the fuzz target's actual drift went unreported. Formatting is checked
      # here, on the toolchain that does the formatting.
      - run: cargo fmt --manifest-path crates/crcbl-net/fuzz/Cargo.toml --check

  # # Why the e2e harnesses get a gate of their own
  #
  # Every e2e suite in this repo is `#[ignore]`d on top of its feature, so
  # `--all-features` is the run that skips it and the harness script is the only
  # thing that turns it on. That makes each script's summary parser the sole
  # guard against a suite that tested nothing — and nothing was checking the
  # guards. Five of them read nextest's cancelled `2/15 tests run` as a healthy
  # fifteen until `tools/nextest-summary.sh` replaced them.
  #
  # A guard nobody exercises is the defect it exists to catch, one level up. So
  # `tools/nextest-summary-test.sh` runs here, on every commit, against synthetic
  # summary lines it would be impossible to provoke from a real suite on demand:
  # a cancelled run, a zero-test run, an absent summary, one wrapped in the
  # colour escapes CI's own `CARGO_TERM_COLOR: always` produces.
  #
  # No toolchain and no build — `ubuntu-latest` ships `shellcheck`, and the
  # scripts under test are shell.
  shell:
    name: shell (e2e harness guards)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # `-x` follows the `source` lines, which is the whole point here: the
      # harnesses source `tools/nextest-summary.sh` and `vulkan-icd.sh`, and
      # without it every caller reports SC1091 and nothing about the callee.
      # The glob takes every script under a `tests/` directory, not just
      # `run-*`: the sourced-not-run helpers (`vulkan-icd.sh`,
      # `sway-session.sh`) are where the cross-crate knowledge lives, and `-x`
      # alone would only ever see them through a caller.
      #
      # **`apps/*/tests/` and `web/` are in it too, and were not.**
      # `crates/*/tests/*.sh` reads like "every harness" and is not: the samples
      # have harnesses of their own, and so does the browser side — five scripts
      # including both browser gates. `apps/quarry/tests/run-quarry-e2e.sh` was
      # outside this glob on the day it was written. A pattern that silently
      # matches less than its name claims is the shape this repo keeps removing.
      #
      # Widening it cost two real fixes rather than none: both browser runners
      # indented a multi-line list with `sed 's|^|  |'`, which SC2001 flags. They
      # use a read loop now, checked byte-for-byte against the `sed` — the
      # obvious `printf '  %s\n' "$NEWER"` rewrite is wrong, and indents only the
      # first line.
      - name: Lint every harness and the helpers they share
        run:
          shellcheck -x tools/*.sh crates/*/tests/*.sh apps/*/tests/*.sh
          web/*.sh
      - name: The summary guard rejects the runs it is there to reject
        run: ./tools/nextest-summary-test.sh

      # `docs/backlog.md` is the working record and its worth is that an entry
      # can be acted on months later. A moved file breaks that silently: the
      # reader greps the cited path, finds nothing, and concludes the work was
      # deleted rather than relocated. Prettier reads the file as prose and no
      # test opens it, so nothing else would notice.
      - name: The docs cite paths that exist
        run: ./tools/check-doc-citations.sh

  clippy:
    name: clippy (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          # Explicit scopes so it is visible which jobs share a cache. Coverage
          # can never share (llvm-cov injects `-C instrument-coverage`); the
          # cross-platform legs are keyed by runner OS automatically.
          shared-key: lint
      # `cpal` — `crcbl-audio`'s native output — links ALSA through `alsa-sys`,
      # whose build script shells out to `pkg-config alsa`. The runner image
      # does not carry `libasound2-dev`, so every linux job that compiles the
      # workspace for the host died in that build script before reaching a line
      # of our own code, and the whole board went red at once.
      #
      # Hardened, and shared: two runs hung twenty minutes on a silent apt
      # mirror and were cancelled by the job timeout. The action retries a
      # hung attempt as well as a failing one — see it for why those differ.
      - name: Install the ALSA headers cpal links against
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings
      # Every other job passes `--all-features`, so without this line nothing
      # ever compiles the crates as a consumer gets them. A feature that only
      # builds when its siblings are on is a broken feature, and it is invisible
      # to a workspace that always turns them all on.
      - run: cargo build --workspace --locked --no-default-features

      # **The same check for the two backends this runner cannot build.**
      # `crcbl-mtl` and `crcbl-dx12` compile only on their own platform jobs, and
      # every one of those passes `--all-features` — so the configuration a
      # developer gets by default was compiled nowhere, and a `use` that belongs
      # behind a feature gate broke silently once already.
      #
      # It rides this Linux job rather than a macOS matrix entry, which is what
      # made this look expensive: `cargo clippy --target` type-checks a platform
      # backend without that platform. Compiling only, and only these two crates,
      # so the cost is two target installs and two crate checks.
      - name: Type-check the platform backends as a consumer gets them
        run: |
          set -euo pipefail
          rustup target add aarch64-apple-darwin x86_64-pc-windows-msvc
          cargo clippy -p crcbl-mtl --all-targets --locked --no-default-features \
            --target aarch64-apple-darwin -- -D warnings
          cargo clippy -p crcbl-dx12 --all-targets --locked --no-default-features \
            --target x86_64-pc-windows-msvc -- -D warnings

      # **And their documentation, for the same reason and on the same targets.**
      # The `rustdoc` job runs `cargo doc` against `wasm32-unknown-unknown`,
      # which compiles not one line of either of these crates — `crcbl-mtl` is
      # `#[cfg(target_os = "macos")]` from its crate root down and `crcbl-dx12`
      # is the same on Windows. Measured 2026-08-21: a link to a non-existent
      # item inside a `cfg(macos)` impl left that command reporting success while
      # `aarch64-apple-darwin` reported `unresolved link`, and three real errors
      # in the Metal counter-query slice were found this way.
      #
      # It rides this step's two `rustup target add`s rather than a job of its
      # own, which is the whole reason it is cheap. `--all-features` here, unlike
      # the clippy lines above, so it matches what the `rustdoc` job documents.
      - name: Document the platform backends on their own targets
        env:
          RUSTDOCFLAGS: -D warnings
        run: |
          set -euo pipefail
          cargo doc --locked --all-features --no-deps -p crcbl-mtl \
            --target aarch64-apple-darwin
          cargo doc --locked --all-features --no-deps -p crcbl-dx12 \
            --target x86_64-pc-windows-msvc

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: docs
      # ALSA headers for `cpal`; see the action for why it retries.
      - name: Install the ALSA headers cpal links against
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      # `--no-deps`: only our own docs are our problem. Catches broken
      # intra-doc links, which is what a workspace of cross-referencing crates
      # accumulates fastest.
      - run: cargo doc --workspace --all-features --no-deps --locked

  machete:
    name: cargo-machete (unused deps)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned, like `cargo-fuzz@0.13.1` and `SLANG_VERSION` below: a tool
      # installed as "latest" changes what CI enforces without a commit, and a
      # new `cargo-machete` heuristic turning a green repo red is indistinguish-
      # able from a regression.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-machete@0.9.2
      - run: cargo machete

  prettier:
    name: prettier (markdown, web, workflows)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned exactly, for the reason `cargo-machete` above is: prettier's
      # defaults are what this repo formats against, and they move between
      # releases. An unpinned "latest" would rewrite files nobody edited and
      # turn the board red without a commit, which is indistinguishable from a
      # regression.
      #
      # `git ls-files` rather than a glob: only tracked files are the repo's to
      # format, and a glob would walk `target/` and any `node_modules` a local
      # run left behind. `-z`/`--null` and `xargs -0` because a tracked path is
      # allowed to contain a space.
      #
      # This gate exists because thirteen files had drifted before it did —
      # both other workflows, four engine scripts, four demo pages and two
      # docs. Nothing catches that without a check, since the formatter is only
      # ever run by whoever remembers to.
      #
      # Its first run found something worse and is the reason `.prettierrc`
      # exists: the repo had **no** prettier config, and prettier searches
      # upward from each file, so every local run here had been picking up a
      # config in the developer's home directory. Thirty-six files were
      # formatted to settings the repository did not contain, and a clone into
      # a different home directory would have reformatted all of them. The
      # config is now committed and says what this tree is actually formatted
      # to.
      - name: check formatting
        run: >-
          git ls-files -z '*.md' '*.js' '*.mjs' '*.json' '*.yml' '*.yaml'
          '*.css' '*.html' | xargs -0 npx --yes prettier@3.8.3 --check

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      # Pinned: `deny.toml`'s `skip` list is written against this version's
      # `crate = "name@version"` spelling, and its `multiple-versions = "deny"`
      # gate is calibrated against what this version reports.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny@0.19.7
      - run: cargo deny --all-features check

  # The only job that compiles the `cfg(target_arch = "wasm32")` code at all.
  #
  # `crcbl-shell` (the Web/canvas backend, P5), `crcbl-wgpu` (the WebGPU target,
  # P5.3b) and `crcbl-hal` all carry wasm-gated code that was added deliberately
  # and then compiled by nothing: every other job in this file runs on a host
  # target, so a `#[cfg(target_arch = "wasm32")]` block could stop compiling and
  # no gate would notice. That is the same argument this file makes for the
  # macOS/Windows jobs — "platform code is validated *exclusively* here, so
  # these jobs are load-bearing from day one".
  #
  # It is `check`/`clippy` rather than `test`: `wasm32-unknown-unknown` has no
  # test harness without a browser runner, and the thing at risk is the code
  # compiling, not the browser behaving.
  #
  # **The whole workspace, minus two crates.** This used to name four crates,
  # because the rest of the workspace pulled `ash` and `cpal` unconditionally.
  # P5.5 target-gated cpal and P5.6 target-gated `crcbl-vk` out of the umbrella,
  # so a deny-list is now shorter than an allow-list — and an allow-list is what
  # let the umbrella and the sample stop building for wasm without any job
  # noticing. Everything not excluded here, `apps/breakout` and the `crcbl`
  # umbrella included, is expected to build. Adding a member to this list is a
  # deliberate edit that has to say why:
  #
  # * `crcbl-vk` `dlopen`s `libvulkan.so.1` through `ash`, and `libloading` has
  #   no wasm build at all. There is no Vulkan in a browser and there is no
  #   version of this crate that could exist there.
  # * `crcbl-cli` is a command-line tool — argv, exit codes, a filesystem, PNG
  #   files on disk, and `crcbl::screenshot`, which is native-only for the same
  #   blocking reason `Instance::create_device` is. `wasm32-unknown-unknown` has
  #   none of those. The browser's entry point is the sample's wasm module, not
  #   a CLI.
  #
  # `apps/breakout` is the reason this matters at P5: the phase gate is the
  # sample playable in a browser, and the dependency graph underneath it is the
  # thing that broke first.
  wasm32:
    name: build + clippy (wasm32)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          target: wasm32-unknown-unknown
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: wasm32
      # The P5 deliverable, named on its own so a failure says which half broke
      # before the workspace sweep buries it in a hundred other crates.
      - run: cargo check --locked --target wasm32-unknown-unknown -p breakout
      - run: >-
          cargo check --locked --workspace --exclude crcbl-vk --exclude
          crcbl-cli --target wasm32-unknown-unknown
      - run: >-
          cargo clippy --locked --all-features --workspace --exclude crcbl-vk
          --exclude crcbl-cli --target wasm32-unknown-unknown -- -D warnings
      # The `docs` job runs rustdoc on the host only, and every sample's
      # `web.rs` is behind `#[cfg(target_arch = "wasm32")]` — so the one module
      # in each game that is *entirely* documentation (a symbol table, a
      # call-ordering diagram, the ABI the JS shim is written against) was the
      # one module no docs gate had ever read. Four samples were carrying
      # broken intra-doc links when this was added.
      #
      # The whole wasm-capable workspace, not just the samples: the engine
      # crates had 24 of the same failures — public documentation linking to
      # items that are `#[cfg(not(target_arch = "wasm32"))]`, chiefly
      # `Instance::create_device` and `crcbl::backend::open`, both of which are
      # absent on wasm *on purpose* so a browser build fails to compile rather
      # than failing at run time. The exclusions match the `cargo clippy` line
      # above: neither crate builds for this target at all.
      - run: >-
          cargo doc --locked --all-features --no-deps --workspace --exclude
          crcbl-vk --exclude crcbl-cli --target wasm32-unknown-unknown
        env:
          RUSTDOCFLAGS: -D warnings

  # Linux is the developer's daily driver, so it carries the full gate.
  test-linux:
    name: test (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # NOTE: when Git LFS is enabled (P9, per `.gitattributes`), every
      # `actions/checkout` in this file must gain `lfs: true` in the same
      # commit, or CI silently tests against pointer files.
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # ALSA headers for `cpal`; see the action for why it retries.
      - name: Install the ALSA headers cpal links against
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      # nextest does not run doctests — without this step every `//!`/`///`
      # example in the engine is unexecuted documentation.
      - run: cargo test --doc --workspace --all-features --locked
      # `crates/crcbl-shaders/clusters/*.dag` is a committed bake artifact, on
      # the terms `spirv/` is: the builder that produces it
      # (`crcbl_scene::cluster_dag`) is in a crate `crcbl-render` may not depend
      # on, so the DAG reaches the renderer as data. This is the anti-rot gate —
      # "someone changed the simplifier and forgot to regenerate" — and it is
      # the same check the `shaders` job runs against the SPIR-V, one directory
      # over.
      #
      # It lives in this job rather than that one because it needs a Rust
      # toolchain and no shader compiler at all, which is the exact opposite of
      # what the `shaders` job installs; the tests above have already built
      # everything it links.
      - name: Check the committed cluster DAG against its builder
        run:
          cargo run --locked -p crcbl-shaders --example cook-clusters -- --check
      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: junit-linux
          path: target/nextest/ci/junit.xml
          if-no-files-found: warn

  # Development happens on Linux only: macOS and Windows code paths are
  # validated *exclusively* here, so these jobs are load-bearing from day one
  # and must stay green even while the platform crates are empty.
  test-cross-platform:
    name: build + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # Windows and macOS runners are roughly 2x slower than Linux.
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      - run: cargo build --workspace --locked
      # Clippy runs here too, not just on Linux: `cfg`-gated platform code is
      # invisible to the Linux lint pass, so a macOS/Windows-only backend would
      # otherwise never be linted at all.
      - run:
          cargo clippy --workspace --all-targets --all-features --locked -- -D
          warnings
      # **No `--run-ignored all` here, and that is the whole design.**
      # `docs/plan/12-testing.md` reserves the workspace sweep as the run that
      # deliberately does *not* execute the ignored suites, so it stays green on
      # a machine with no compositor, no X server, no Vulkan loader and no GPU —
      # which these runners are. `--all-features` compiles `vk-e2e`, `wgpu-e2e`
      # and `render-e2e` here, so turning the ignored set on would try to open a
      # Vulkan device on a runner with no loader and fail for reasons that are
      # not about this workspace.
      #
      # What that sweep covers on these two runners is `crcbl-mtl`'s and
      # `crcbl-dx12`'s **pure** tests — the format tables, the layout arithmetic,
      # the handle tagging — which is exactly what the placement rule says
      # belongs in an ungated `src/` test. Their device tests are `#[ignore]`d
      # and run in the `mtl e2e` and `dx12 e2e` jobs, plus the DX12 adapter
      # report step below.
      - run: cargo nextest run --workspace --all-features --locked --profile ci
      # # Why the AppKit session gets a step of its own, and no job of its own
      #
      # It is already in the sweep above, so this runs it a second time — for
      # 1.2 seconds, against a workspace that is already built. What the second
      # run buys is the two things the sweep cannot give it.
      #
      # **`--no-tests fail` is the macOS shape of the count check.**
      # `tests/appkit_session.rs` is the *only* executable coverage the AppKit
      # backend has, it is `harness = false`, and it is behind no feature — so
      # nothing anywhere would go red if it stopped being built or was renamed.
      # `docs/plan/12-testing.md` calls a silently-skipped e2e job a known trap;
      # this is that trap's macOS shape, and naming the target explicitly is what
      # closes it. `tests/run-win32-e2e.ps1` does the same thing by parsing
      # nextest's summary, because its suite is feature-gated and `#[ignore]`d
      # and there is something to turn on. Here there is not, which is also why
      # this is a step rather than the separate job the Win32 suite needs.
      #
      # **`--success-output immediate` prints the session's own narrative.**
      # That target owns its `main` and reports every step it reached — the
      # capability set, the configured size, what AppKit said about the first
      # responder, what the window server's keyboard delivered. nextest captures
      # a passing test's stdout, so all of that is invisible on a green run,
      # which is the run where a reader most wants to see which optional path
      # (a key window, an injected event) actually happened. Nobody on this team
      # has a Mac to run it on.
      - name: The AppKit window session, named rather than swept up
        if: runner.os == 'macOS'
        run: >-
          cargo nextest run --locked -p crcbl-shell --test appkit_session
          --no-tests fail --success-output immediate

      # # The DX12 adapter report, for the same reason as the step above
      #
      # `crcbl-dx12`'s enumeration tests print one line per adapter carrying its
      # `ResourceBindingTier`, its `HighestShaderModel`, whether SM6.6 dynamic
      # resources are supported, and the derived renderer tier. **That line is
      # the answer to a question `docs/backlog.md` says to settle before
      # committing to the DX12 phase**: whether WARP — D3D12's software
      # rasteriser, which ships in Windows — clears Tier A. If it does, this
      # runner can render, and Windows gains the golden-image coverage it has
      # never had; if it does not, `crcbl-wgpu` already covers Tier B here and
      # DX12's justification is Xbox plus tooling.
      #
      # nextest captures a passing test's stdout, so on a green run — the run
      # where you actually want to read a measurement — the line is invisible.
      # `--success-output immediate` is what publishes it, and `--no-tests fail`
      # is the same count check the macOS step makes: this crate is behind no
      # feature, so nothing else would go red if its suite stopped being built.
      #
      # **`--run-ignored all` is load-bearing, and `--no-tests fail` would not
      # have caught its absence.** The tests that open a real `ID3D12Device` —
      # including `the_pinned_adapter_opens_a_device_and_names_itself`, which is
      # what prints the line this step exists for — are now `#[ignore]`d, so that
      # `crates/crcbl-dx12/tests/run-dx12-e2e.sh` can select exactly them and
      # guard on their count. Without this flag the step would run the crate's
      # pure tests, print no adapter line at all, and still pass: tests *did*
      # run, so the count check sees nothing wrong. The flag also keeps this
      # runner's unpinned enumeration covered, which is the half the `dx12 e2e`
      # job cannot give — that one pins WARP on purpose.
      #
      # Read the verdict off `sm66-dynamic-resources`, **not** off
      # `renderer-tier`. Every adapter reports Tier B in the enumeration slice
      # because `COMPUTE`, `TIMELINE_SEMAPHORE` and the two indirect features
      # wait on calls no slice has written yet — that is the backend's gap, not
      # the hardware's.
      #
      # The known-red exclusion comes from `crates/crcbl-dx12/tests/known-red.txt`,
      # the same file `run-dx12-e2e.sh` reads. Those are repros of an open defect
      # that are kept on purpose and would otherwise fail this step too — this
      # job runs the crate's ignored tests just as that harness does, only
      # without pinning WARP. That harness checks every name in the file still
      # selects exactly one test, so a stale entry fails there rather than
      # silently excluding nothing here.
      - name: The DX12 adapter report, named rather than swept up
        if: runner.os == 'Windows'
        shell: bash
        run: |
          names=$(grep -v '^[[:space:]]*#' crates/crcbl-dx12/tests/known-red.txt | grep -v '^[[:space:]]*$')
          filter=()
          if [[ -n "$names" ]]; then
            expression=""
            while read -r name; do
              echo "ci: excluding known-red ${name}"
              expression="${expression:+${expression} + }test(${name})"
            done <<< "$names"
            filter=(-E "not (${expression})")
          fi
          cargo nextest run --locked -p crcbl-dx12 --run-ignored all --no-tests fail \
            --success-output immediate "${filter[@]}"

  # The only job that runs the Wayland backend against a real compositor.
  # `docs/plan/12-testing.md` schedules "scripted resize/mode-switch sequences
  # against the real backends under a nested compositor (sway headless / Xvfb)
  # in CI" for P0, and calls a silently-skipped e2e job a known trap — so this
  # job is required like every other one (no `continue-on-error`), and the
  # harness itself fails when the suite reports zero tests run.
  wayland-e2e:
    name: wayland e2e (nested sway)
    runs-on: ubuntu-latest
    # Compositor startup plus a full compile of the shell crate's test targets.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # `libwayland-client0` and `libxkbcommon0`, not their `-dev` packages:
      # the backend resolves both with `dlopen` at runtime rather than linking
      # them, so the runtime packages are all it needs — and the fact that this
      # job passes without the `-dev` packages is itself the check that no
      # `DT_NEEDED` crept in. libxkbcommon is what turns a keymap into keysyms
      # and text; without it the suite's `ShellCaps::TEXT_IME` assertion is the
      # thing that fails, which is the intended signal.
      # `mesa-vulkan-drivers` serves two purposes now: wlroots wants *a*
      # renderer even on a headless backend, and since P1.1 the sandbox runs
      # here on `crcbl-vk` — against lavapipe, since a CI runner has no GPU.
      # `vulkan-validationlayers` is not optional: the sandbox is launched with
      # `CRCBL_VK_VALIDATION=1`, and `docs/plan/02-vulkan-backend.md`'s "zero
      # validation errors" gate cannot be met by a job that never loaded the
      # layer.
      # `libasound2-dev`, and the reason is new: `crcbl` re-exports
      # `crcbl-audio` as of the umbrella slice, so **every** binary that links
      # the umbrella now links cpal and ALSA — this job did not compile
      # `crcbl-audio` before and does now. See the `clippy (linux)` job for the
      # `-dev`-versus-runtime argument.
      - name: Install sway and the ALSA headers cpal links against
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            sway libasound2-dev libwayland-client0 libxkbcommon0 libvulkan1
            mesa-vulkan-drivers vulkan-validationlayers
      # Starts headless sway in a private XDG_RUNTIME_DIR, polls for the socket
      # with a deadline and a liveness check on the child, runs the
      # `#[ignore]`d suite with `--features wayland-e2e`, and dumps the
      # compositor log tail on any failure.
      - name: Run the suite under headless sway
        run: crates/crcbl-shell/tests/run-wayland-e2e.sh

  # The only job that runs the X11 backend against a real X server.
  # `docs/plan/12-testing.md` schedules "scripted resize/mode-switch sequences
  # against the real backends under a nested compositor (sway headless / Xvfb)
  # in CI" for P0 — this is the Xvfb half — and calls a silently-skipped e2e
  # job a known trap, so this job is required like every other one (no
  # `continue-on-error`), and the harness itself fails when the suite reports
  # zero tests run.
  x11-e2e:
    name: x11 e2e (Xvfb)
    runs-on: ubuntu-latest
    # Server startup plus a full compile of the shell crate's test targets.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Runtime packages, not their `-dev` counterparts: the backend resolves
      # every one of these with `dlopen` rather than linking them, so the
      # runtime packages are all it needs — and the fact that this job passes
      # without the `-dev` packages is itself the check that no `DT_NEEDED`
      # crept in. `libxcb-randr0` and `libxcb-xinput0` are the monitor and
      # raw-motion extensions, both of which the suite asserts are present;
      # `libxcb-xtest0` is used only by the harness's peer client, to
      # synthesize real input. `libxkbcommon-x11-0` is what turns the server's
      # keymap into keysyms and text, and without it the suite's
      # `ShellCaps::TEXT_IME` assertion is what fails — the intended signal.
      # The three Vulkan packages arrived with P1.1: the sandbox runs here on
      # `crcbl-vk` against lavapipe, with validation on. X11 is the interesting
      # half of the seam's extent rule — `currentExtent` is a real size and
      # `minImageExtent == maxImageExtent == currentExtent`, so the shell and
      # the server disagreeing has no legal swapchain at all.
      # `libasound2-dev`, and the reason is new: `crcbl` re-exports
      # `crcbl-audio` as of the umbrella slice, so **every** binary that links
      # the umbrella now links cpal and ALSA — this job did not compile
      # `crcbl-audio` before and does now. See the `clippy (linux)` job for the
      # `-dev`-versus-runtime argument.
      #
      # `openbox` is the second pass below. It is a *stacking* window manager,
      # which is the load-bearing property: the suite and the sandbox assert on
      # the geometry a window asked for, and a tiling manager would resize
      # every window to fill the screen and make "windowed" and "borderless"
      # the same size. It is also the smallest EWMH-complete option packaged —
      # `--no-install-recommends` keeps it to a handful of X libraries, where
      # `marco` or `xfwm4` would drag in half a desktop.
      - name: Install Xvfb, openbox, the X client libraries and the ALSA headers
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            xvfb openbox libasound2-dev libxcb1 libxcb-randr0 libxcb-xinput0
            libxcb-xtest0 libxkbcommon0 libxkbcommon-x11-0 libvulkan1
            mesa-vulkan-drivers vulkan-validationlayers
      # Starts Xvfb on a private display number, polls for its socket with a
      # deadline and a liveness check on the child, runs the `#[ignore]`d suite
      # with `--features x11-e2e`, and dumps the server log tail on any
      # failure.
      #
      # The suite runs **twice**, and neither pass is a variant of the other: a
      # window manager is a separate program on this platform, and whether one
      # is running changes the focus policy, the decorations, the size hints,
      # the reparenting and whether a fullscreen request can be granted at all.
      # Both answers are executed rather than one being assumed from the other.
      - name: Run the suite under Xvfb, with no window manager
        run: crates/crcbl-shell/tests/run-x11-e2e.sh
      - name: Run the suite under Xvfb, with openbox managing
        run: CRCBL_E2E_X11_WM=openbox crates/crcbl-shell/tests/run-x11-e2e.sh

  # The only job that runs the Win32 backend end to end, and the P5C W4
  # deliverable. `docs/plan/ROADMAP.md`'s 2026-08-04 correction is the reason it
  # can exist at all: `windows-latest` is a desktop, so the shell is reachable
  # from a test process that never draws anything, exactly as the X11 backend was
  # from its first slice.
  #
  # **Its own job rather than a step in `build + test (windows-latest)`**, and
  # not for tidiness. `docs/plan/12-testing.md` calls a silently-skipped e2e job
  # a known trap, and the counter-measure is a harness that fails when the suite
  # reports zero tests run — which needs the suite to be the only thing in the
  # run whose count is being read. Folded into a job that also runs the whole
  # workspace's unit tests, "did the e2e suite run?" is not a question the
  # output can answer.
  #
  # There is nothing to install. The two Linux e2e jobs each install a window
  # system and half a dozen client libraries because their harness has to start
  # one; this runner boots with a window station, a desktop, a cursor sitting on
  # it and a 1024×768 display, which is what the suite is written against.
  win32-e2e:
    name: win32 e2e (real desktop)
    runs-on: windows-latest
    # A Windows runner is roughly 2x slower than a Linux one, and this compiles
    # the shell crate's test targets and both helper binaries from cold.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Runs the `#[ignore]`d suite with `--features win32-e2e`, serialised
      # because the foreground window, the cursor and the clipboard are one of
      # each per session, and fails when the reported test count is zero or
      # unreadable.
      - name: Run the suite against the runner's desktop
        shell: pwsh
        run: crates/crcbl-shell/tests/run-win32-e2e.ps1

  # The only job that drives a D3D12 device this repository chose.
  #
  # # What a green run here IS evidence of
  #
  # This runs `crcbl-dx12`'s device tests — the `#[ignore]`d ones, which is how
  # that crate spells "needs a live `ID3D12Device`" and how `--run-ignored only`
  # in the harness selects exactly them — and it pins the adapter to **WARP**,
  # D3D12's software rasteriser, which ships in Windows and is this backend's
  # lavapipe. So this covers adapter enumeration against a live
  # DXGI (including `EnumWarpAdapter` and the software/hardware classification),
  # device and queue creation, buffers in all three `MemoryLocation`s with
  # host-visible writes and readback, images, image views, samplers and the
  # descriptor heaps behind them, command allocator and command-list recording,
  # `ID3D12Fence` waits, deferred retirement of resources a submission still
  # references, buffer-to-buffer and buffer-to-image copies, a render-pass clear
  # read back texel by texel, a vertex-pulled triangle WARP actually drew and
  # read back, and a `DXGI_SWAP_EFFECT_FLIP_DISCARD` swapchain created, acquired,
  # presented and resized on a real `HWND`.
  #
  # It runs the same tests the `windows-latest` leg of `test-cross-platform`
  # runs in its "DX12 adapter report" step, and that duplication is the point
  # rather than an oversight: that step passes `--run-ignored all` with no pin,
  # so it runs them on `adapters()[0]`, which is whatever DXGI listed first, and
  # this job runs them on the adapter it names. On today's runner those are the
  # same device; on a runner that grows a GPU they stop being, and only one of
  # the two jobs would still be testing the software path. `vk-e2e` pins
  # lavapipe for exactly this reason. (The `--workspace --all-features` sweep in
  # that job is *not* the other copy: it deliberately leaves the ignored set
  # alone, so what it runs of this crate is its pure tests.)
  #
  # It also covers the **offscreen ring** twice over: once at a shape chosen so
  # the texels can be asserted exactly, and once at the shape
  # `crcbl::screenshot::OffscreenSetup` actually builds — the preferred (sRGB)
  # format, the engine's frame extent, and the barrier sequence
  # `draw_and_readback` records, which leaves the image in `TransferSrc` and
  # declares `Undefined` on the next trip round. The second of those is new and
  # is a **reproduction attempt**: see the frame step below for what it is
  # reproducing. It may be the first thing in this job to go red, and that is
  # the finding rather than a regression in it.
  #
  # # What it is NOT evidence of
  #
  # **The picture.** Every test above asserts a clear, a copy or a refusal;
  # nothing here compares a rendered frame against a golden. That is the frame
  # step at the end of this job, and it is not a gate yet.
  #
  # An `ImageViewDesc` whose format differs from its image's is refused, and
  # that is a decision rather than a gap — `crcbl_dx12::device` argues it.
  #
  # There is nothing to install: `windows-latest` boots into a session with a
  # window station and a desktop, which is what the swapchain tests need, and
  # WARP is part of the OS.
  dx12-e2e:
    name: dx12 e2e (software adapter)
    runs-on: windows-latest
    # A Windows runner is roughly 2x slower than a Linux one, and this compiles
    # the backend's test target from cold.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # `shell: bash` is Git Bash, which `windows-latest` ships; the harness
      # needs `mktemp`, `tee`, `sed` and `grep` and nothing a Windows shell
      # lacks. Its header argues the choice against `run-win32-e2e.ps1`'s.
      #
      # It exports `CRCBL_DX12_ADAPTER=warp`, and fails when the suite reports
      # zero tests, when it was cancelled part-way, when it never named the
      # adapter it opened, or when the adapter it named is not the software
      # rasteriser that was pinned.
      #
      # It also exports `CRCBL_DX12_VALIDATION=1` and checks, off the suite's own
      # output again, that the suite said whether the debug layer was on. See
      # that script's header for why the layer matters more here than a
      # validation layer usually does.
      #
      # **And that is now a gate rather than a report.** Every device test in the
      # crate ends by asserting a clean `ID3D12InfoQueue` — zero errors and zero
      # warnings, `crcbl-vk`'s line — and, before it looks at the messages, that
      # the layer was on at all. So a runner without Windows' *Graphics Tools*
      # optional feature fails this job loudly instead of passing while checking
      # nothing; `CRCBL_DX12_VALIDATION=0` is the one way to run it there, and
      # the log then says the run checked no validation.
      - name: Drive a D3D12 device pinned to WARP
        shell: bash
        run: crates/crcbl-dx12/tests/run-dx12-e2e.sh

      # # A frame through ForwardRenderer, on D3D12 — a measurement, not a gate
      #
      # Ran on `dc846ff` and again on `0354eec` with `CRCBL_ADAPTER=cpu`. Both
      # times the HAL suite above passed **155/155 on WARP** and then the frame
      # failed in `OffscreenSetup::open`, before drawing:
      #
      #   a GPU backend opens: HAL: CreateCommittedResource (buffer) failed:
      #   The GPU device instance has been suspended. … (0x887A0005)
      #
      # The second run is the informative one: adapter choice was the first
      # theory and the pin did not change the outcome. That buffer is
      # `ForwardRenderer`'s first, and `DXGI_ERROR_DEVICE_REMOVED` is reported at
      # the **next** call rather than the offending one — so what it says is that
      # something before it broke the device, and the code alone names neither
      # the call nor the mistake.
      #
      # **This is a gate again, because both named causes are fixed.** It was
      # `continue-on-error` while the frame failed for reasons this backend
      # could only report: a constant buffer view rounded to D3D12's 256-byte
      # requirement while its buffer stayed 16 bytes, and three draw-generation
      # buffers that `crcbl-render` put on an upload heap and bound writable —
      # which D3D12 refuses outright, since its upload heap pins a resource to a
      # state no shader can write from. The first is fixed in `crcbl-dx12`; the
      # second in `crcbl-render`, by giving the frame a clear dispatch so those
      # three can be `DeviceLocal`.
      #
      # What is still unproven is the clear pass itself: it is a new compute
      # pipeline, root signature and descriptor table on this backend, and no
      # D3D12 device has run it. A failure here now names its own cause —
      # `GetDeviceRemovedReason` and the drained debug layer are wired into
      # every device-removed report, and the harness confirms the layer loaded.
      #
      - name: Draw a frame through ForwardRenderer on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-render-e2e.sh

      # The same HAL-seam behaviours on this backend, from the one agnostic
      # binary. It replaces per-backend copies that had drifted apart; without
      # this step the tests deleted from `vk_e2e`/`wgpu_e2e` would be a net loss
      # of coverage rather than a consolidation.
      # **The other direction of the parity contract**, on this backend. See the
      # lavapipe job's copy for why a capable device cannot exercise it: every
      # capability gated on a device feature is declared supported when the
      # feature is granted, so only "declared supported must work" ever runs.
      # `CRCBL_SEAM_WITHHOLD=all` opens the device with no optional feature and
      # puts those rows on the refusal side.
      #
      # Scoped to the one test: the reviewed-divergence snapshot and the
      # pipeline-layout ceiling describe the capable configuration and
      # legitimately do not hold here.
      - name: Check the refusal half of the parity contract on WARP
        env:
          CRCBL_GPU: dx12
          CRCBL_SEAM_WITHHOLD: all
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: >
          crates/crcbl/tests/run-hal-seam-e2e.sh -E
          'test(every_declared_capability_behaves_the_way_it_was_declared)'

      - name: Run the HAL seam suite on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-hal-seam-e2e.sh

      # The draw-generation buffers, read back and compared against the CPU
      # oracle. Same consolidation as the step above it and from the same
      # migration: `crates/crcbl/tests/draw_gen_e2e/` is what
      # `crates/crcbl-vk/tests/vk_e2e/`'s `cull.rs`, `cull_stats.rs` and most of
      # `draw_gen.rs` became, so until this step existed D3D12 had the goldens of
      # the step above and no check on a single GPU-written number.
      #
      # It needs the same device the ForwardRenderer step needs and nothing more.
      - name: Check the draw generation on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-draw-gen-e2e.sh

      # The forward pass's own state: the froxel grid and its overflow counter,
      # the shadow atlas read back as depth, the reflectivity attachment, and
      # reversed-Z discriminated against a conventional projection. Same
      # consolidation and same migration as the two steps above —
      # `crates/crcbl/tests/forward_e2e/` is what `vk_e2e`'s `lights.rs`,
      # `shadow.rs` and `depth_probe.rs` became — and until this step existed
      # D3D12 had no check on a single atlas texel or froxel count.
      #
      # It needs the same device the ForwardRenderer step needs and nothing more.
      - name: Check the forward pass on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-forward-e2e.sh

      # The sprite pass and the two generators in front of it, against the nine
      # goldens that moved out of `crates/crcbl-vk/tests/` with the tests. Same
      # consolidation and same migration as the three steps above —
      # `crates/crcbl/tests/sprite_e2e/` is what `vk_e2e`'s `sprite/` subtree,
      # `menu.rs`, `nine_slice.rs` and `button_skin.rs` became — and until this
      # step existed D3D12 had no evidence that a single sprite quad was drawn.
      #
      # This backend has the most to say about the readback: it and wgpu are the
      # two that refuse an image-to-buffer copy whose row pitch is not a multiple
      # of 256, where Vulkan and Metal take a tightly packed row. The menu
      # module's 416-wide framebuffers are the only frames in the suite that are
      # not aligned by accident, so the fixture pads every row and says so with
      # `BufferImageCopy::buffer_row_length`.
      - name: Draw the sprite pass on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-sprite-e2e.sh

      # The last of the five clusters, and the only one whose migration was a
      # redesign: `crates/crcbl/tests/mesh_e2e/` is the backend-agnostic half of
      # `vk_e2e/mesh.rs` — the four lit-mesh goldens, the `Rgba16Float` scene
      # target, the transient pool under a resize storm and the uniform
      # level-of-detail cut. The half that stayed opens devices demanding
      # `MESH_SHADER | TASK_SHADER` and asserts on the path selected, which WARP
      # has none of, so before this step D3D12's only evidence about the lit mesh
      # was `render_e2e`'s cube golden.
      - name: Draw the lit mesh on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-mesh-e2e.sh

      # `crates/crcbl/tests/tiling_e2e.rs`, which until this step existed had
      # never run anywhere but by hand: its own header claimed
      # `run-render-e2e.sh` supplied the backend, and that script passes
      # `--test render_e2e`. It draws two greybox floor quads through
      # `ForwardRenderer` and asserts a 2 m surface shows about twice the grid
      # cells of a 1 m one — the whole of what `GpuMaterial::TILING_PHYSICAL`
      # buys over stretching one authored tile.
      #
      # It needs nothing this backend has not already proven in the step above
      # it: the `Repeat` sampler physical tiling reads through is one
      # `ForwardRenderer::with_scene` creates for every scene, so a runner that
      # drew the cube can draw this.
      - name: Count the physical tiling on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-tiling-e2e.sh

      # **The one suite whose `#[ignore]` named a script CI never ran.** Every
      # ignored test in this workspace says which runner reaches it, and every
      # one of those runners appears in a workflow except this one — so
      # `gltf_e2e.rs` executed on no machine but a developer's until 2026-08-20.
      # It goes wherever `run-tiling-e2e.sh` goes, for the reason that step gives:
      # both draw through the `ForwardRenderer::with_scene` path every scene
      # takes, so a runner that can count tiles can import a document.
      - name: Draw an imported glTF on WARP
        shell: bash
        env:
          CRCBL_GPU: dx12
          CRCBL_ADAPTER: cpu
          CRCBL_DX12_VALIDATION: '1'
        run: crates/crcbl/tests/run-gltf-e2e.sh

      # The two backends nobody on this team can run locally are the two whose
      # golden diffs were being discarded: this job and the Metal one wrote
      # `target/golden-diff/` on a failure and uploaded nothing, so the one
      # artifact that could diagnose a cross-target divergence died with the
      # runner. The vk jobs have uploaded theirs since they were written.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-warp
          path: target/golden-diff/
          if-no-files-found: ignore

  # The CLI/headless pillar's own end-to-end check: `crcbl new` scaffolds a
  # project, the project *compiles*, it lints clean, and it runs its loop
  # headless. `docs/plan/11-cli-headless.md` makes the CLI the substrate every
  # later suite is built on, and `docs/plan/12-testing.md` calls a
  # silently-skipped e2e job a known trap — so this job is required like every
  # other one, and the harness fails when the suite reports zero tests run.
  #
  # It needs no display and no GPU: the scaffolded game runs against
  # `HeadlessShell`. What it does need is a full engine compile into a throwaway
  # target directory, which is why the suite is feature-gated and `#[ignore]`d
  # rather than part of `test-linux`.
  cli-e2e:
    name: cli e2e (scaffold builds and runs)
    runs-on: ubuntu-latest
    # A cold engine compile plus the scaffolded project's own.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # `crcbl` re-exports `crcbl-audio` as of the umbrella slice, so the CLI —
      # and every project it scaffolds — links cpal and ALSA. This job did not
      # compile `crcbl-audio` before and does now. See the `clippy (linux)` job
      # for the `-dev`-versus-runtime argument.
      #
      # The Vulkan loader and lavapipe are here so the scaffolded game runs
      # against a *driver* rather than the null backend: the template now hosts
      # `crcbl::engine::Loop` and declares a real render graph, and a run that
      # recorded calls instead of executing them would not notice a pass that
      # cannot compile. See `CRCBL_CLI_E2E_BACKEND` below.
      #
      # `sway` and `libwayland-client0` are what let the harness run the
      # generated project **windowed** as well as headless — the half
      # `--headless` cannot reach, and the first thing anybody does with a
      # scaffold. The harness starts its own headless compositor through
      # `crcbl-shell`'s `sway-session.sh`; without sway installed it says so and
      # fails, because in CI a skipped pass is the trap
      # `docs/plan/12-testing.md` names.
      - name: Install sway, the ALSA headers, the Vulkan loader and lavapipe
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            sway libasound2-dev libwayland-client0 libvulkan1
            mesa-vulkan-drivers
      # Scaffolds into a temporary directory, builds it with its own
      # `CARGO_TARGET_DIR`, checks `rustfmt` and `clippy` on the generated
      # source, runs the template's own unit tests, runs
      # `crcbl run --headless`, and runs it once more with a window on it.
      #
      # No ICD pin, unlike the `vk e2e` job. That job pins lavapipe because the
      # *software path* is what it is there to test; this one asks a weaker
      # question — does the template's render graph run against a driver at all
      # — which any driver answers. `mesa-vulkan-drivers` is the only one
      # installed above, so today that is lavapipe either way.
      - name: Run the scaffold suite
        env:
          CRCBL_CLI_E2E_BACKEND: vk
        run: crates/crcbl-cli/tests/run-cli-e2e.sh

  # `docs/plan/12-testing.md` schedules "lavapipe render e2e + golden-image
  # tooling" for P1 and the Vulkan plan's corrections make it "a hard P1 gate,
  # not 'if practical' — a gate cannot be optional". This is that job: the
  # `crcbl-vk` suite plus the sandbox's own frame, entirely headless, against
  # the software rasteriser.
  #
  # It is deliberately a *second* implementation rather than a cheaper copy of
  # the developer's. Lavapipe and radv disagree in ways that matter — P1.1 found
  # a spec violation that radv shrugs off and lavapipe segfaults on — and any
  # code that quietly assumes one vendor's feature set is a bug this job exists
  # to catch. Since P1.2 it also carries the golden-image gate, where the two
  # disagreeing is not a bug but the measurement the tolerance is built from:
  # they differ by one level on 3.8% of the triangle, which `crcbl-golden`'s
  # docs record and its tolerance is calibrated against.
  vk-e2e:
    name: vk e2e (lavapipe)
    runs-on: ubuntu-latest
    # A software rasteriser is slow, but this suite renders 64x48.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # `libvulkan1` is the loader — which `crcbl-vk` `dlopen`s rather than
      # links, so its absence is a clean `OpenError::NoLoader` and not a dead
      # process. `mesa-vulkan-drivers` brings lavapipe. `vulkan-tools` is only
      # for the harness's `vulkaninfo --summary` dump, which is the first thing
      # anyone reads when this job goes red.
      # `libasound2-dev` is the odd one out in this list: the ALSA headers
      # `cpal` links against rather than anything Vulkan. See the `clippy` job.
      - name: Install the Vulkan loader, lavapipe and the validation layers
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            libvulkan1 mesa-vulkan-drivers vulkan-validationlayers vulkan-tools
            libasound2-dev
      # The ICD is pinned rather than discovered: a GitHub runner that grew a
      # GPU tomorrow would otherwise silently stop testing the software path,
      # which is the one path every other developer's machine does not have.
      - name: Run the suite against lavapipe
        env:
          # `VK_LOADER_DEBUG: all` sat here for one commit and belonged on
          # `vk e2e (lavapipe, windows)`, which is where it is now — that job's
          # header records what the misplacement cost.
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: crates/crcbl-vk/tests/run-vk-e2e.sh
      # **The Vulkan arm of `crates/crcbl/tests/render_e2e.rs`, and the reason
      # its goldens can be trusted.** That test draws the cube, sprite and UI
      # scenes through the engine's own renderers on whichever backend
      # `CRCBL_GPU` names, and it exists for the Metal arm in the `mtl-e2e` job
      # — but a golden only stays honest while something keeps re-deriving it,
      # and the Metal arm currently cannot (see that job for why). This step is
      # what keeps them from rotting: the references were blessed on lavapipe,
      # so this comparison is bit-identical and any drift is loud rather than
      # absorbed by the rasteriser tolerance.
      #
      # `CRCBL_VK_ICD`, not `VK_DRIVER_FILES` written out here. This step first
      # exported Debian's `lvp_icd.x86_64.json` directly and failed with
      # `ERROR_INCOMPATIBLE_DRIVER`, which the loader also says for a manifest
      # naming a driver it cannot use — so the message named neither the file
      # nor the mistake. `run-render-e2e.sh` now resolves the name through the
      # same `crcbl_pin_vk_icd` this job's other steps use, which is what makes
      # the two spellings a non-issue instead of a runner-specific guess.
      - name: Draw a frame through ForwardRenderer on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-render-e2e.sh

      # The same HAL-seam behaviours on this backend, from the one agnostic
      # binary. It replaces per-backend copies that had drifted apart; without
      # this step the tests deleted from `vk_e2e`/`wgpu_e2e` would be a net loss
      # of coverage rather than a consolidation.
      - name: Run the HAL seam suite on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-hal-seam-e2e.sh

      # The draw-generation buffers, read back and compared against the CPU
      # oracle. This is the Vulkan arm of the suite `vk_e2e`'s `cull.rs`,
      # `cull_stats.rs` and most of `draw_gen.rs` became — the same checks the
      # step above this job's `run-vk-e2e.sh` used to make, now made from a
      # binary that names no backend so the other three jobs make them too.
      # **quarry's milestones, asserted rather than looked at.** The sample's
      # device suite runs on the `Null` backend under a bare `cargo test`, where
      # every assertion about a picture reports itself skipped — honest, and
      # useless as a gate. This is the step that makes it evidence.
      #
      # It runs here rather than only on a developer's GPU because the numbers
      # it asserts turn out not to be a driver's: measured on 2026-08-19, the
      # per-cluster cuts and the drawn levels are **identical** on radv and on
      # lavapipe, and only the rasterised pixel counts differ — by five of
      # 49,152 at the widest. The suite was written on that observation, which
      # is why it compares counts and levels rather than images.
      #
      # The runner refuses a run whose substance skipped: `CRCBL_GPU=null`
      # passes all nine tests and it still exits non-zero, because no frame
      # reported a per-cluster cut.
      # **The other direction of the parity contract, which a capable device
      # cannot exercise.** With everything asked for, `crcbl-vk` declares all 24
      # capabilities supported — so the step above runs "declared supported must
      # work" 24 times and "declared unsupported must refuse" not once.
      # Thirteen of those capabilities are gated on a device feature, so opening
      # the device with none of them puts them on the refusal side and makes
      # that arm run.
      #
      # Scoped to the one test on purpose. The reviewed-divergence snapshot and
      # the pipeline-layout ceiling describe the *capable* configuration and
      # legitimately do not hold on a device opened with nothing; they are the
      # wide run's to assert.
      #
      # It found three real mis-declarations in `crcbl-vk` the day it was
      # written — see that commit — which is the argument for keeping it.
      - name: Check the refusal half of the parity contract on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_SEAM_WITHHOLD: all
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: >
          crates/crcbl/tests/run-hal-seam-e2e.sh -E
          'test(every_declared_capability_behaves_the_way_it_was_declared)'

      - name: Measure the quarry sample on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/quarry/tests/run-quarry-e2e.sh

      - name: Check the draw generation on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-draw-gen-e2e.sh

      # The forward pass's own state — the froxel grid, the shadow atlas as
      # depth, the reflectivity attachment, reversed-Z against a conventional
      # control. This is the Vulkan arm of the suite `vk_e2e`'s `lights.rs`,
      # `shadow.rs` and `depth_probe.rs` became: the same checks the step above
      # this job's `run-vk-e2e.sh` used to make, now made from a binary that
      # names no backend so the other three jobs make them too.
      - name: Check the forward pass on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-forward-e2e.sh

      # The sprite pass, the nine-slice, the button skin and the shared menu.
      # This is the Vulkan arm of the suite `vk_e2e`'s `sprite/` subtree,
      # `menu.rs`, `nine_slice.rs` and `button_skin.rs` became: the same checks
      # and the same nine goldens the step above this job's `run-vk-e2e.sh` used
      # to make, now made from a binary that names no backend so the other three
      # jobs make them too. The references were blessed on Vulkan, so this is the
      # arm that would notice a change in the pass itself rather than a driver
      # disagreement.
      - name: Draw the sprite pass on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-sprite-e2e.sh

      # The lit mesh, its four goldens, its HDR scene target, its resize storm
      # and the uniform level-of-detail cut. This is the Vulkan arm of
      # `crates/crcbl/tests/mesh_e2e/`, the backend-agnostic half of
      # `vk_e2e/mesh.rs` — the last of the five clusters to move and the only one
      # whose migration was a redesign, because half of that file demands
      # `MESH_SHADER | TASK_SHADER` and asserts on the path selected. That half
      # stayed and still runs in this job's `run-vk-e2e.sh` above.
      #
      # **The four references are blessed on Vulkan**, so this is the arm that
      # would notice a change in the renderer itself rather than a driver
      # disagreement — the same standing the sprite step above has.
      # `mesh_clusters.png` is the loosest reference in the tree and its measured
      # headroom is in `docs/backlog.md`.
      - name: Draw the lit mesh on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-mesh-e2e.sh

      # `crates/crcbl/tests/tiling_e2e.rs`, which until this step existed had
      # never run in CI at all: its own header claimed `run-render-e2e.sh`
      # supplied the backend, and that script passes `--test render_e2e`, so the
      # binary was compiled by every `--all-features` build and selected by
      # nothing. The assertion — a 2 m surface shows about twice the grid cells
      # of a 1 m one, which is the whole of what `GpuMaterial::TILING_PHYSICAL`
      # buys over stretching one authored tile — had only ever been run by hand.
      #
      # A counted property rather than a golden, so it is not a second copy of
      # the step above: it reads a *ratio* off two frames and commits no image,
      # which is why it survives the rasteriser differences a reference would
      # have to be blessed against.
      - name: Count the physical tiling on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-tiling-e2e.sh

      # See the WARP step of the same name: this suite's `#[ignore]` named a
      # runner no workflow invoked. Measured on lavapipe before it was added
      # here, not only on the workstation's discrete card.
      - name: Draw an imported glTF on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: crates/crcbl/tests/run-gltf-e2e.sh
      # The only frame in the tree drawn from an **application's** `SceneDesc`
      # rather than from `crcbl_render::scene::demo`, which is what makes it
      # worth its own step: the step above proves the engine's own residents
      # reach the device, and this one proves the description path a game
      # actually uses does. A description that arrived short by a mesh, a
      # material row or a page layer draws a perfectly plausible room, so the
      # suite asserts where the frame is bright and dark before it compares the
      # golden at all.
      #
      # Added because the golden existed and nothing ran it — it passed on three
      # configurations on the author's machine and on none in CI, which is a
      # check that cannot fail where it matters.
      - name: Draw lantern's room on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/lantern/tests/run-lantern-golden.sh
      # The first playable sample, against a real driver. `run-vk-e2e.sh` drives
      # `--package sandbox` and every other harness script does too, so until
      # this step existed nothing outside breakout's own unit tests ever ran the
      # binary — and nothing at all ran it on Vulkan. It renders the whole board
      # (forward cube plus the UI pass's quads for the ball and forty bricks),
      # so a validation error in the UI compositing path fails here.
      - name: Run breakout headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package breakout -- --headless --frames
          60 --backend vk
      # The same binary again, and this time somebody looks at the frame.
      #
      # The step above proves breakout runs on a real driver without a
      # validation error; it cannot tell a correct board from a black one, and
      # neither can `apps/breakout/tests/headless.rs`, which compares tick counts
      # and a summary line. `docs/plan/12-testing.md` asks each sample for a
      # determinism check *and* a golden frame, and this is the second half:
      # `--screenshot` writes the frame the run presented and the suite compares
      # it, after asserting the frame holds a board at all.
      #
      # Driving the compiled binary rather than a scene the test rebuilt is the
      # point — the flag is `crcbl::args::Common`'s, so what lands in the PNG is
      # what a player would have seen.
      - name: Draw breakout's board on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/breakout/tests/run-breakout-golden.sh
      # The library seam, against a real driver. `apps/bare` writes its own
      # loop against the public API instead of plugging into the engine's, and
      # it exists so that "crcbl is usable as a plain library" stays a property
      # somebody checks. Compiling it proves the types are public; running it on
      # Vulkan proves the sequence a consumer would write actually presents.
      - name: Run bare headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package bare -- --headless --frames 30
          --backend vk
      # The remaining samples, which until these steps existed appeared
      # **nowhere** in this workflow or in `cron.yml`. Their unit tests run in
      # the workspace sweep, so the game logic is covered — but nothing ever
      # launched the binary, and a unit test cannot reach a driver. Each of
      # these renders a different pass mix through the engine (`space`/`sky`/
      # `arena` plus two `sprites` passes and `ui-composite`), so a validation
      # error or a lost frame in a path breakout does not exercise now fails
      # here instead of shipping. Same frame budget and flags as breakout
      # above: 60 frames is larger than the swapchain's image count, which is
      # what makes a backend that never returns an acquired image time out
      # rather than pass.
      - name: Run asteroids headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package asteroids -- --headless --frames
          60 --backend vk
      # **Each of the four samples now gets a second step, right after the one
      # that ran it, and this one looks at the frame.** A headless run proves
      # its sample reaches a real driver without a validation error; it cannot
      # tell a correct frame from a black one, and neither can the crates' own
      # unit tests, which compare simulation state and never a pixel.
      # `docs/plan/12-testing.md` asks each sample for a determinism check *and*
      # a golden frame, and these are the second half: `--screenshot` writes the
      # frame the run presented and each suite compares it, after asserting the
      # frame holds its own subject at all — asteroids' rocks, flappy's sky and
      # ground band, horde's field of enemies, hud's two bars.
      #
      # Driving the compiled binary rather than a scene the test rebuilt is the
      # point — the flag is `crcbl::args::Common`'s, so what lands in each PNG
      # is what a player would have seen.
      - name: Draw asteroids' field on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/asteroids/tests/run-asteroids-golden.sh
      - name: Run flappy headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package flappy -- --headless --frames 60
          --backend vk
      - name: Draw flappy's course on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/flappy/tests/run-flappy-golden.sh
      - name: Run horde headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package horde -- --headless --frames 60
          --backend vk
      # Prefilled, unlike the step above: a headless horde never leaves its
      # title screen, so the only frame a plain run can offer has none of the
      # scale sample's subject on it. `--prefill` is `apps/horde`'s own fixture
      # and `tests/golden.rs` says how much and why.
      - name: Draw horde's field on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/horde/tests/run-horde-golden.sh
      # **The viewer is driven through its tests, not its binary, and that is
      # deliberate.** Every step above runs a sample's executable headless; the
      # viewer's needs a `.glb` on disk, and glTF fixtures in this workspace are
      # built in code rather than vendored — `crcbl-scene`'s `gltf_fixture`
      # explains why, and both it and the viewer's copy are `#[cfg(test)]`. Its
      # tests already assemble a document and drive import → convert → frame →
      # draw → debug panel, so pointing them at lavapipe reaches a driver
      # without checking a binary blob into the tree or widening a test-only
      # module to suit CI.
      #
      # `CRCBL_GPU` is what selects it. An unparseable name panics rather than
      # falling back, so this step cannot quietly become a second `Null` run —
      # the trap `hal_seam_e2e`'s backend pin exists for.
      - name: Run the viewer's suite against lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: cargo test --locked --quiet --package viewer
      # The UI system's own fixture, and the only sample whose frame is a clear
      # plus `ui-composite` and nothing else — no sprite pass at all. That makes
      # it the one step here that would catch a UI-pass validation error with no
      # sprite pass in front of it to have tripped first.
      - name: Run hud headless against lavapipe
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_VK_VALIDATION: '1'
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: >-
          cargo run --locked --quiet --package hud -- --headless --frames 60
          --backend vk
      # The only golden in the tree whose frame is a clear plus `ui-composite`
      # and nothing else — no sprite pass in front of a UI regression to have
      # tripped first, which is what makes this step worth its own run.
      - name: Draw hud's panels on lavapipe
        env:
          CRCBL_GPU: vk
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: apps/hud/tests/run-hud-golden.sh
      # `docs/plan/12-testing.md`: "diffs uploaded as CI artifacts on failure".
      # The reference, what lavapipe actually rendered, and a red-marked diff of
      # the two — enough to tell "the tolerance is too tight" from "the triangle
      # moved" without reproducing the run. `if: failure()` because a passing run
      # writes nothing.
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-lavapipe
          path: target/golden-diff/
          if-no-files-found: ignore

  # # The same suite, on the platform that actually ships this backend
  #
  # `crcbl::backend` registers `Dx12` with `auto: false`, so **Vulkan is what a
  # Windows game gets unless it asks for something else** — and until this job,
  # `crcbl-vk` had never been executed on Windows by anything. The
  # `windows-latest` leg of `test-cross-platform` compiles it and runs the unit
  # tests, which open no device; `dx12 e2e (software adapter)` drives a device on this runner
  # but through a different backend entirely. Every line of `crcbl-vk` that talks
  # to a loader, a driver or a swapchain was covered on Linux only.
  #
  # It is `vk-e2e`'s twin rather than a variant: same script, same pin, same
  # rasteriser family. What differs is everything underneath — a different loader
  # build, a different Mesa build, `LoadLibrary` instead of `dlopen`, and a
  # validation layer from LunarG rather than from Debian.
  #
  # # The runner has neither of the two things Vulkan needs, and they are separate
  #
  # 1. **The loader**, `vulkan-1.dll`. `actions/runner-images`' Windows 2025
  #    README lists no Vulkan SDK, runtime or loader (checked against image
  #    20260719.202.1), and there is no GPU driver on the image to have brought
  #    one — so it must be installed. `run-vk-e2e.sh` probes `PATH` for it and
  #    fails by name, because a missing loader otherwise arrives as every test
  #    panicking with the same message.
  # 2. **A driver**, since the runner has no GPU. That is lavapipe, exactly as on
  #    Linux, pinned below.
  #
  # And a third thing this suite in particular needs: **the validation layer**.
  # `ValidationReport::assert_clean` asserts `enabled` before it asserts clean, so
  # every test in the suite fails when the layer was never loaded — there is no
  # configuration of this job that runs the tests without it. Debian packages the
  # layer (`vulkan-validationlayers`); on Windows it ships in the LunarG SDK and
  # nowhere else that publishes a binary — Khronos' own
  # `Vulkan-ValidationLayers` releases carry Android artifacts only.
  #
  # # What is installed, from where, and what was rejected
  #
  # * **The SDK** comes from `jakoch/install-vulkan-sdk-action`, pinned to
  #   `v1.6.0` — an exact tag, because that repository publishes no rolling `v1`
  #   to pin to the way `taiki-e/install-action@v2` is pinned. The SDK version is
  #   pinned separately, and is what actually decides what lands. Taking the
  #   action is a supply-chain decision and the alternative was measured before
  #   making it: LunarG ships the Windows SDK only as a 288 MiB Qt-installer
  #   executable (`vulkan_sdk.zip` is that `.exe`, served under another name),
  #   which has to be run elevated with the right silent flags. Nobody on this
  #   team has a Windows machine to get those flags right on, and a wrong guess
  #   costs a CI round trip each — which is the one thing this action has already
  #   debugged.
  # * **Rejected: `vulkan-runtime-components.zip`.** That one *is* a plain zip
  #   (18 MiB, `x64/vulkan-1.dll` and `x64/vulkaninfo.exe`, no installer), and it
  #   would be the obvious pinned download in the style of `slangc` and `dxc`
  #   above. It carries no layers, and this suite cannot run without them.
  # * **Rejected: the action's own `install_lavapipe`.** It resolves
  #   `jakoch/rasterizers`' `versions.json` at run time and takes whatever
  #   `latest` says — and its Windows entry is the stale `lavapipe-win64` one
  #   (Mesa 25.2.5), not the current `lavapipe-x64`. An unpinned rasteriser
  #   silently redecides what the golden-image gate compares against; this file
  #   pins `slangc`, `dxc`, `spirv-tools` and `cargo-nextest` for that reason and
  #   lavapipe is no different. The step below downloads the pinned asset itself,
  #   which is six lines.
  #
  # The lavapipe archive's ICD manifest names its driver **relative to itself** —
  # `..\..\..\bin\vulkan_lvp.dll` — so the extracted layout is load-bearing and
  # the step verifies the manifest still resolves rather than merely that the two
  # files exist. No registry registration is involved anywhere here:
  # `crates/crcbl-vk/tests/vulkan-icd.sh` exports `VK_DRIVER_FILES` and
  # `VK_ICD_FILENAMES` from `CRCBL_VK_ICD`, and the Windows loader reads both.
  #
  # # Three rounds under Git Bash, and what they actually measured
  #
  # This job ran three times through `run-vk-e2e.sh` and never reached a driver.
  # Every guard it carries reported truthfully across all three — it selects all
  # 73 tests and nothing ever passed vacuously — and two real causes were found
  # and fixed on the way. Both are still in the tree because each is correct
  # independently of this job:
  #
  # 1. The manifest reached the loader in Git Bash's `C:/…` form. `cygpath -w`
  #    converts it, and `vulkan-icd.sh` still does that for anyone running the
  #    bash harness under Git Bash.
  # 2. Exporting the loader's variables *from* Git Bash does not reach a native
  #    child. The steps below write them to `GITHUB_ENV` instead, where the
  #    process that reads them is already native, and `crcbl_pin_vk_icd` defers
  #    to an existing value.
  #
  # What stopped it was `windows_read_data_files_in_registry: Registry lookup
  # failed`, which the loader prints both when `VK_DRIVER_FILES` was never seen
  # and when it was read and every driver in it was declined.
  #
  # # Correction: `VK_LOADER_DEBUG` was never set on this job
  #
  # The reading that turned the environment from a suspect into a conclusion —
  # "`VK_LOADER_DEBUG=all` produced no loader debug output whatever, so the loader
  # is ignoring its own switch, so it is not reading its environment at all" —
  # does not survive re-reading the commit that added it. `06dbf26` put
  # `VK_LOADER_DEBUG: all` in the **`vk-e2e`** job's run step, on Linux; this
  # job's run step never carried it. A loader that prints no debug output when its
  # debug switch was never set is a loader behaving normally, and the `Registry
  # lookup failed` line it *did* print is one the loader emits at its default
  # level without any switch at all.
  #
  # So that measurement says nothing, and the environment is a hypothesis again
  # rather than a settled cause. It is still the best hypothesis — `dx12 e2e
  # (software adapter)` runs under `shell: bash` and works, but it passes nothing
  # a *native DLL* reads: `CRCBL_DX12_ADAPTER` is read by our own Rust code, which
  # is why the two jobs are not evidence about each other. This round moves both
  # variables at once, deliberately, because each round trip costs an hour:
  # `VK_LOADER_DEBUG` now sits on this job's run step, and the suite runs from
  # `pwsh`.
  #
  # # `shell: pwsh`, and a second harness rather than a second shell
  #
  # `crates/crcbl-vk/tests/run-vk-e2e.ps1` is the Windows twin of
  # `run-vk-e2e.sh`, which is untouched and stays the Linux one. A native process
  # launching a native process puts no environment translation anywhere in the
  # chain from the shell to `vulkan-1.dll`, which is the whole point — and it is a
  # measurement either way, since a loader that still cannot see `VK_DRIVER_FILES`
  # from here was never blocked by the environment and the next round should look
  # at the manifest and the driver instead.
  #
  # It carries every guard its bash twin does — the pin, the loader probe, the
  # `vulkaninfo` dump, the zero-tests trap, the cancelled-part-way trap,
  # `CRCBL_VK_EXPECT_ADAPTER` against the adapter the *suite* reports, and the
  # sync-validation reach — and adds one: it prints the loader's variables as the
  # *harness process* holds them, which is one process closer to the loader than
  # a step's own environment dump and is the reading three rounds did not have.
  # `run-win32-e2e.ps1` is the precedent for the shape.
  #
  # # Nothing below has ever executed
  #
  # There is no Windows machine on this team. Every step in this job was written
  # against documentation, release metadata and archive listings read on Linux.
  # The `.ps1` has been parsed and PSScriptAnalyzer-checked on Linux, and its
  # nextest, adapter, reach and sandbox parsing were exercised end to end against
  # a real Linux Vulkan run — which says the script is correct PowerShell and
  # correct parsing, and nothing about `windows-latest`. Expect a round trip. If
  # the loader is reached, the likeliest first failure is the golden images: this
  # leg renders on a different Mesa build from the one the references were blessed
  # on, and `crcbl-golden`'s `Tolerance::RASTERISER` was measured between radv and
  # *one* lavapipe rather than between two. After that, whether this LunarG layer
  # build reports the record-time hazard `validation_gate` demands.
  vk-e2e-windows:
    name: vk e2e (lavapipe, windows)
    runs-on: windows-latest
    # A Windows runner is roughly 2x slower than a Linux one, this compiles the
    # backend's test targets from cold, the suite renders on a software
    # rasteriser, and the SDK installer alone is a 288 MiB download and an
    # install. `vk e2e (lavapipe)` gets 30 minutes on Linux.
    timeout-minutes: 60
    env:
      # Pinned, and the two pins are independent: the SDK decides the loader and
      # the validation layer, the Mesa build decides the rasteriser the golden
      # images are compared against. LunarG prunes older SDKs from
      # `https://vulkan.lunarg.com/sdk/versions/windows.json` over time, so a
      # bump here is an ordinary maintenance edit — the download step fails
      # loudly rather than falling back to `latest`.
      VULKAN_SDK_VERSION: 1.4.357.0
      LAVAPIPE_RELEASE: '20260730'
      LAVAPIPE_ASSET: lavapipe-x64-26.1.5.zip
      LAVAPIPE_ROOT: C:\lavapipe
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Installs to `C:\VulkanSDK\<version>`, exports `VULKAN_SDK`, and puts the
      # SDK's `bin` on `PATH`. It sets `VK_LAYER_PATH` on Linux and macOS only —
      # on Windows it leaves layer discovery to the registry keys the installer
      # writes. The next step does not rely on that: it finds the layer manifest
      # and exports the variable itself, so a registration that silently did not
      # happen is a failed step rather than a suite that runs with no layer.
      - name: Install the pinned LunarG Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          install_runtime: true
      # # The loader and the layer, found rather than assumed
      #
      # Both are searched for under `VULKAN_SDK` instead of being spelled out,
      # because the SDK's layout has moved between releases — 1.4.350.0 relocated
      # the Linux loader into `lib/VulkanLoader/lib`, and a hardcoded path is how
      # a version bump turns into a green job that installed nothing. A search
      # that finds nothing prints the tree and fails, which is the only outcome
      # that cannot be mistaken for coverage.
      #
      # `x86` copies are excluded explicitly: the SDK ships both architectures
      # and a 32-bit loader on `PATH` in front of the 64-bit one would fail to
      # load into this process for a reason nothing in the suite could explain.
      - name: Check the loader and the validation layer actually landed
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sdk = $env:VULKAN_SDK
          if (-not $sdk -or -not (Test-Path $sdk)) {
              throw "crcbl vk e2e (windows): VULKAN_SDK is '$sdk', which does not exist — the SDK step installed nothing."
          }
          Write-Host "crcbl vk e2e (windows): VULKAN_SDK=$sdk"

          $loader = Get-ChildItem -Path $sdk -Recurse -File -Filter 'vulkan-1.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\x86\\' } | Select-Object -First 1
          if (-not $loader) {
              Get-ChildItem -Path $sdk -Recurse -File -Depth 3 | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "crcbl vk e2e (windows): no 64-bit vulkan-1.dll under $sdk — there is no Vulkan loader on this runner."
          }
          Write-Host "crcbl vk e2e (windows): loader $($loader.FullName)"
          Add-Content -Path $env:GITHUB_PATH -Value $loader.DirectoryName

          $manifest = Get-ChildItem -Path $sdk -Recurse -File -Filter 'VkLayer_khronos_validation.json' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\x86\\' } | Select-Object -First 1
          if (-not $manifest) {
              Get-ChildItem -Path $sdk -Recurse -File -Filter '*.json' | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "crcbl vk e2e (windows): no VkLayer_khronos_validation.json under $sdk. Every test in this suite asserts the layer was loaded, so the whole run would fail."
          }
          $libraryPath = (Get-Content -Raw $manifest.FullName | ConvertFrom-Json).layer.library_path
          Write-Host "crcbl vk e2e (windows): layer $($manifest.FullName) -> $libraryPath"
          if (-not (Get-ChildItem -Path $sdk -Recurse -File -Filter 'VkLayer_khronos_validation.dll' -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -notmatch '\\x86\\' } | Select-Object -First 1)) {
              throw "crcbl vk e2e (windows): the layer manifest exists but no VkLayer_khronos_validation.dll does."
          }
          # Set rather than left to the registry: this is the same argument
          # `vulkan-icd.sh` makes for the ICD, one level up. The loader honours
          # it on Windows exactly as it does elsewhere.
          Add-Content -Path $env:GITHUB_ENV -Value "VK_LAYER_PATH=$($manifest.DirectoryName)"
          # **The registry, because this runner is elevated.** The loader prints
          # "Loader is running with elevated permissions. Environment variable
          # VK_LAYER_PATH will be ignored" and does the same for
          # VK_DRIVER_FILES, VK_ICD_FILENAMES and VK_ADD_DRIVER_FILES — it
          # discards every environment path when the process has elevated
          # privileges, deliberately, so a lower-privileged caller cannot inject
          # a DLL into one. GitHub's Windows runners are elevated, so no shell
          # and no path form was ever going to work. What the loader does read
          # while elevated is HKLM, which is where a normally-installed driver
          # registers itself.
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\ExplicitLayers' `
            -Name $manifest.FullName -PropertyType DWord -Value 0 -Force | Out-Null
          Write-Host "crcbl vk e2e (windows): registered layer $($manifest.FullName)"
      # The archive is `bin/`, `lib/` and `share/vulkan/icd.d/` with no wrapping
      # directory, and the manifest's `library_path` climbs three levels out of
      # `share/vulkan/icd.d` to reach `bin` — so extracting it anywhere as a
      # whole works and extracting the two files individually would not. The
      # resolved path is checked, not the two files' existence, because that is
      # the difference between "the archive arrived" and "the loader can follow
      # it".
      #
      # **The manifest is globbed, not named**, and this is the step that owns
      # that decision. `vulkan-icd.sh`'s `crcbl_pin_vk_icd` searches for a
      # sibling manifest because Debian ships `lvp_icd.x86_64.json` and Arch
      # ships `lvp_icd.json`; that is Linux packaging knowledge and there is no
      # second packager of lavapipe for Windows to disagree with the first, so
      # `run-vk-e2e.ps1` does not reimplement it. What *can* drift here is the
      # pinned asset above changing the name when it is bumped, and the glob is
      # where that belongs — one step, next to the pin it is about, still failing
      # with the whole file listing when nothing matches.
      - name: Install the pinned lavapipe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $url = "https://github.com/jakoch/rasterizers/releases/download/$env:LAVAPIPE_RELEASE/$env:LAVAPIPE_ASSET"
          $zip = Join-Path $env:RUNNER_TEMP 'lavapipe.zip'
          Write-Host "crcbl vk e2e (windows): downloading $url"
          Invoke-WebRequest -Uri $url -OutFile $zip
          New-Item -ItemType Directory -Force -Path $env:LAVAPIPE_ROOT | Out-Null
          Expand-Archive -Path $zip -DestinationPath $env:LAVAPIPE_ROOT -Force

          $icdFile = Get-ChildItem -Path $env:LAVAPIPE_ROOT -Recurse -File -Filter 'lvp_icd*.json' -ErrorAction SilentlyContinue |
              Select-Object -First 1
          if (-not $icdFile) {
              Get-ChildItem -Path $env:LAVAPIPE_ROOT -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "crcbl vk e2e (windows): $env:LAVAPIPE_ASSET carried no lvp_icd*.json anywhere."
          }
          $icd = $icdFile.FullName
          $libraryPath = (Get-Content -Raw $icd | ConvertFrom-Json).ICD.library_path
          $driver = [System.IO.Path]::GetFullPath((Join-Path (Split-Path $icd) $libraryPath))
          Write-Host "crcbl vk e2e (windows): $icd -> $libraryPath -> $driver"
          if (-not (Test-Path $driver)) {
              Get-ChildItem -Path $env:LAVAPIPE_ROOT -Recurse -File | ForEach-Object { Write-Host "  $($_.FullName)" }
              throw "crcbl vk e2e (windows): the ICD manifest resolves to $driver, which does not exist — the archive was not extracted as a whole."
          }
          # The loader reads these, and Git Bash could not hand them over:
          # exporting them there left the loader on its registry lookup, which is
          # what it does when the variable never arrived. Set here, the process
          # that reads them is already native.
          #
          # All three in the native `C:\…` form, including `CRCBL_VK_ICD` — which
          # the bash harness needed with forward slashes, because Git Bash's
          # `[ -f ]` takes only that spelling. `run-vk-e2e.ps1` has no such
          # constraint, so nothing here converts a path any more.
          Add-Content -Path $env:GITHUB_ENV -Value "VK_DRIVER_FILES=$icd"
          # Registered for the same reason the layer is: an elevated loader
          # ignores VK_DRIVER_FILES. The variable stays set so a future
          # non-elevated runner keeps working and so the harness can still print
          # what it was asked for, but HKLM is what actually selects lavapipe
          # here. `CRCBL_VK_EXPECT_ADAPTER` is what proves which one answered,
          # and it is now the only thing that can.
          New-Item -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' -Force | Out-Null
          New-ItemProperty -Path 'HKLM:\SOFTWARE\Khronos\Vulkan\Drivers' `
            -Name $icd -PropertyType DWord -Value 0 -Force | Out-Null
          Write-Host "crcbl vk e2e (windows): registered driver $icd"
          Add-Content -Path $env:GITHUB_ENV -Value "VK_ICD_FILENAMES=$icd"
          Add-Content -Path $env:GITHUB_ENV -Value "CRCBL_VK_ICD=$icd"
      # **`CRCBL_VK_EXPECT_ADAPTER` is what makes the pin a check.**
      # `CRCBL_VK_ICD` offers the loader a manifest; the loader may decline it,
      # and it refuses a missing manifest and an unusable one with the same
      # error. Without this the suite would still run, still pass, and be
      # evidence about whatever driver the loader found. `dx12 e2e (software
      # adapter)` checks its own pin the same way, off the suite's adapter line.
      #
      # Between them, the harness fails this job when there is no loader on
      # `PATH`, when `CRCBL_VK_ICD` resolves to nothing, when the suite ran zero
      # tests, when the run was cancelled part-way, when it never opened a
      # device, when the adapter it opened is not lavapipe, and when it stopped
      # reporting how far the validation layer can see. The layer itself is gated
      # inside the suite: `ValidationReport::assert_clean` fails on a report from
      # an instance that never loaded one, and
      # `a_deliberate_violation_is_caught_by_the_layer` commits a real spec
      # violation and asserts the layer noticed.
      - name: Run the suite against lavapipe
        shell: pwsh
        env:
          # The loader's own search log, on the job that needs it. Its summary
          # line is ambiguous — `Registry lookup failed to get ICD manifest
          # files` appears both when `VK_DRIVER_FILES` was never seen and when it
          # was read and every driver in it was declined — and `all` makes the
          # loader say which manifest it opened, whether it loaded the DLL, and
          # why it dropped it. It was set on the Linux job by mistake for the
          # three rounds that were trying to read it here.
          VK_LOADER_DEBUG: all
          CRCBL_VK_EXPECT_ADAPTER: llvmpipe
          CRCBL_VK_SYNC_VALIDATION: '1'
        run: crates/crcbl-vk/tests/run-vk-e2e.ps1

      # **The one agnostic suite this configuration lost, put back.** Until
      # `ba0c49f` on 2026-08-18 `depth_probe` lived in `run-vk-e2e.ps1`'s suite
      # above, and Vulkan-on-Windows is the only place its
      # `reversed_z_puts_the_nearer_surface_in_front_and_standard_z_would_not`
      # has ever failed — five times in one evening, shading one primitive to the
      # clear colour with zero validation errors and zero DRED breadcrumbs. The
      # migration moved it into `forward_e2e`, which runs on Windows under
      # **dx12/WARP**, on Linux under vk and wgpu and on macOS under Metal — every
      # combination except this one. So the six quiet days since were a closed
      # channel rather than evidence, and this step reopens it.
      #
      # **`shell: bash`, and it is not a new risk on this job.** The dx12 job runs
      # three of these harnesses on `windows-latest` the same way, and
      # `crcbl_pin_vk_icd` in `crates/crcbl-vk/tests/vulkan-icd.sh` already
      # converts the manifest to a native path through `cygpath` under MSYS — a
      # loader that reads `C:/...` as no pin at all is a fight this repository has
      # already had and recorded there.
      #
      # **No ICD is named here on purpose.** The lavapipe step above writes
      # `CRCBL_VK_ICD`, `VK_DRIVER_FILES` and `VK_ICD_FILENAMES` into `GITHUB_ENV`
      # from the manifest it actually found in the archive, so naming a path here
      # would be a second copy of a value that is discovered rather than known.
      # That is the opposite of the Linux arm, which hardcodes its distribution's
      # path because there it *is* known.
      #
      # **This suite carries no golden**, which is what makes it the safe one to
      # add: `forward_e2e` calls `crcbl_golden::compare` zero times and names no
      # `Tolerance`, so the "references blessed against another Mesa build" risk
      # this job's header names does not reach it. It is 13 counted-property
      # checks, and they pass on lavapipe — measured on Linux lavapipe before this
      # step was written. `draw_gen_e2e`, `hal_seam_e2e`, `gltf_e2e` and the
      # tiling suite are golden-free on the same measurement and could follow;
      # they are left out of this change so that a failure here names one thing.
      - name: Check the forward pass on lavapipe
        shell: bash
        env:
          CRCBL_GPU: vk
        run: crates/crcbl/tests/run-forward-e2e.sh
      # The golden images are the likeliest failure once the loader is reached,
      # and the one that cannot be diagnosed from a log: this leg renders on a
      # *different* Mesa build from the Linux leg, and `crcbl-golden`'s
      # `Tolerance::RASTERISER` was measured between radv and one lavapipe rather
      # than between two. The reference, what this runner drew, and a red-marked
      # diff are what tell "the tolerance is too tight" from "Windows draws a
      # different triangle".
      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-lavapipe-windows
          path: target/golden-diff/
          if-no-files-found: ignore

  mtl-e2e:
    name: mtl e2e (macos-latest)
    runs-on: macos-latest
    # macOS runners are roughly 2x slower than Linux; see `build + test`.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      # **The MSL half of `docs/plan/02-vulkan-backend.md`'s fourth shader
      # portability rule** — "validate all four artifacts, not one".
      # `crates/crcbl-shaders/tools/compile-shaders.sh` runs `spirv-val` over the
      # SPIR-V and
      # `crates/crcbl-shaders/tests/wgsl_validation.rs` runs naga over the WGSL,
      # both on Linux. The MSL can be checked **nowhere else**: `xcrun metal` is
      # macOS-only, `newLibraryWithSource:` needs a device, and no open-source
      # tool parses MSL. So this is the only job in the matrix that can say the
      # committed `.metal` even compiles, and it runs before the Rust build
      # because it needs none of it.
      #
      # It is deliberately unconditional and deliberately counts. A glob that
      # matched nothing would compile nothing and exit 0, which is the
      # silently-skipped gate `docs/plan/12-testing.md` names as a known trap and
      # every e2e script here already guards against.
      #
      # `-c -o /dev/null` compiles to AIR and discards it: what is asserted is
      # that the Metal front end accepts the artifact, not that a `.metallib`
      # gets built — `crcbl-mtl` hands the source to
      # `newLibraryWithSource:options:error:` at run time anyway.
      - name: Compile every committed MSL artifact with xcrun metal
        run: |
          set -eo pipefail
          COMPILED=0
          for SOURCE in crates/crcbl-shaders/msl/*.metal; do
              if [ ! -e "$SOURCE" ]; then
                  break
              fi
              echo "crcbl shaders: compiling $SOURCE"
              xcrun metal -c "$SOURCE" -o /dev/null
              COMPILED=$((COMPILED + 1))
          done
          if [ "$COMPILED" -eq 0 ]; then
              echo "crcbl shaders: no msl/*.metal were compiled, so this step" >&2
              echo "  checked nothing — the artifacts moved or the glob is wrong." >&2
              exit 1
          fi
          echo "crcbl shaders: $COMPILED MSL artifact(s) compiled"
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: test
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.140
      # Nothing to install: Metal ships with the OS, and the crate links it
      # through `objc2` rather than `dlopen`ing anything.
      #
      # **One test is held out, and it is not a claim about this backend.**
      # `a_layer_swapchain_acquires_a_drawable_and_presents_it` is `#[ignore]`d
      # because a detached `CAMetalLayer` in a headless container has no
      # surface to vend a drawable from, so `nextDrawable` returns nil or
      # blocks. The script's `--run-ignored only` sweeps it up with every other
      # device test and a block would burn the timeout, so the filter below
      # names it. Every other `#[ignore]` in the crate marks a test that opens a
      # Metal device, and every one of them runs here. The filter lives here
      # rather than in the script because a person on a real Mac, with a real
      # window server, should run that test.
      #
      # **`--no-fail-fast`, because the first run found a hang and then hid the
      # rest of the answer.** Run 31040839716 stopped at test 45 of 106 and
      # cancelled the remaining 59 — including three of the four draw tests,
      # which is exactly the set this job exists to report on. A GPU hang here
      # surfaces as a `DeviceLost` error rather than a block, so letting the
      # suite finish costs under a second per faulting test.
      #
      # # The draw hang was ours, and the call was `setDepthStencilState:nil`
      #
      # Six draw tests were quarantined here across three rounds. Every draw
      # this backend recorded faulted on this runner with
      # `kIOGPUCommandBufferCallbackErrorHang`, every encoder reporting
      # `completed` and none faulted — while the crate's own render-pass clear
      # test, which was never filtered, passed in the same runs. (That test has
      # since been deleted; `crates/crcbl/tests/hal_seam_e2e.rs` owns the clear
      # for every backend.) The device was never the limitation: run 31037470086 ran
      # a compute dispatch and two triangle draws on this same image from a
      # standalone Swift script.
      #
      # A ten-probe bisect on `6a59e89` named the call. Each probe was a
      # hand-encoded pass — this crate's own `MTLDevice`, queue, texture,
      # `MTLRenderPipelineState` and `crcbl_mtl::fault` command-buffer
      # descriptor, a combination already shown to pass — plus exactly one of
      # the calls `crcbl_mtl::command`'s `bind_graphics_pipeline` emits beside
      # `setRenderPipelineState:`. **Seven passed, three failed**, and one call
      # is in all three failures:
      #
      # * `setDepthStencilState:` with **nil** hung. The same call with a
      #   default `MTLDepthStencilState` object passed, which is what splits
      #   the selector from its argument.
      # * `setCullMode:`, `setFrontFacingWinding:`, `setTriangleFillMode:`,
      #   `setDepthClipMode:` and `setDepthBias:slopeScale:clamp:` each passed
      #   on its own, so none of them is the fault.
      # * The other two failures were the whole-replay probe and the positive
      #   control — this backend's own path with a pipeline bound and no draw
      #   at all. Both make the nil call, and the singles cleared everything
      #   else either of them adds.
      #
      # Metal documents nil as "restore the default depth/stencil state", so
      # this is a driver bug on the paravirtual GPU rather than misuse. It is
      # fixed on our side regardless, because it costs one object per device:
      # `crcbl_mtl::pipeline`'s `default_depth_stencil_state` builds an
      # always-pass, never-write state at device open, every pipeline that
      # declares no depth/stencil state carries that instead, and the `Option`
      # that could reach Metal as nil no longer exists in the crate. The
      # substitution cannot change an image — the state tests nothing and
      # writes nothing — and `crcbl_mtl::device`'s
      # `a_pipeline_without_depth_state_binds_the_devices_default_rather_than_nil`
      # asserts both halves without a draw, so it runs on this device too.
      #
      # **Five of the six come out of the filter on that fix**, and they are
      # every quarantined test that draws:
      # `a_metal_triangle_draw_paints_the_centre_and_leaves_the_corners_clear`,
      # `a_triangle_draw_into_a_bgra_target_paints_the_same_image`,
      # `the_engines_own_triangle_draws_through_a_bind_group`,
      # `a_metal_indexed_draw_reads_the_bound_index_range` and
      # `a_multi_draw_indirect_emits_every_argument_structure`. Every one of
      # them draws into a colour-only pass, which is exactly the case whose
      # pipeline bound nil. The sixth is the layer swapchain above, which is
      # unrelated and stays out.
      #
      # **The probes are gone with the answer.** A probe set that keeps running
      # after it has answered is noise, and its positive control was expected
      # to fault, which would keep this job red forever.
      #
      # **Nothing here has been verified.** There is no Metal device on this
      # team's machines; `cargo clippy --target aarch64-apple-darwin` compiles
      # this crate and runs none of it. This job is the first thing that runs
      # the fix. Two earlier hypotheses released these same tests and were
      # wrong — the render-target format (settled by the BGRA twin faulting
      # byte-identically to its RGBA one, run 31080128007) and the long draw
      # argument forms (settled by `025cf90`, whose short selectors hung
      # identically). This one differs in that a probe reproduced the hang from
      # a single call and its twin did not, rather than being inferred from
      # what was left.
      #
      # # This is the first Metal run under validation
      #
      # The harness exports `MTL_DEBUG_LAYER=1`, both of its violation modes as
      # `abort`, and `MTL_SHADER_VALIDATION=1`, and prints what it set — so a
      # green run states what it checked instead of inheriting it. None of the
      # seventy-odd device tests has ever run under any of that.
      #
      # **Metal reports differently from the other two backends and the gate is
      # honestly weaker.** There is no message list to count: an API misuse is
      # printed and then aborts, so it arrives here as a killed test process
      # rather than as a failed assertion. What `crcbl_mtl::fault` asserts at
      # every device test's teardown is that Metal really interposed its
      # validation layer, and that no command buffer the device submitted ended
      # in `MTLCommandBufferStatus::Error` — which is where shader validation's
      # findings and every GPU fault arrive. That crate's `fault` module argues
      # all of it; `run-mtl-e2e.sh`'s header repeats the summary.
      - name: Run the Metal suite, minus the one test with no window server
        run: >-
          crates/crcbl-mtl/tests/run-mtl-e2e.sh --no-fail-fast -E 'not
          test(a_layer_swapchain_acquires_a_drawable_and_presents_it)'

      # # The renderer on Metal
      #
      # `crates/crcbl/tests/render_e2e.rs` draws one frame of each of the cube,
      # sprite and UI scenes and compares them against the goldens the `vk e2e`
      # job re-derives on lavapipe. It closes `docs/backlog.md`'s "the render
      # layer runs on Vulkan and wgpu" on a second backend — and the sprite and
      # UI frames are the first time `sprite.slang` and `ui.slang` are compared
      # against anything on MSL at all.
      #
      # **It ran once before, on `878f582`, and hung** — every draw this backend
      # recorded did, because `bind_graphics_pipeline` passed nil to
      # `setDepthStencilState:`. That is fixed, and the five draw tests
      # quarantined for it now pass on this runner, so the reason this step was
      # held is gone.
      #
      # What is unmeasured is the picture, not the frame. The golden was blessed
      # on lavapipe and compared with `Tolerance::RASTERISER`, calibrated for the
      # radv-versus-lavapipe difference; Metal is a third rasteriser nobody has
      # compared. A large pixel delta is a tolerance question, and a structural
      # mismatch or a blank frame is a finding about the backend — the comparison
      # prints enough to tell them apart.
      #
      # Metal's validation switches are set here too, because this step does not
      # go through `run-mtl-e2e.sh` and would otherwise be the one Metal run in
      # the matrix with no checking at all — the same reason the D3D12 twin of
      # this step sets `CRCBL_DX12_VALIDATION`.
      #
      # **API validation only. `MTL_SHADER_VALIDATION` is deliberately absent,
      # and that is a finding rather than a preference.** With it on — Metal
      # logs it as "Metal GPU Validation Enabled" — this step's UI scene came
      # back with five distinct colours against a floor of six, so something
      # that draws stopped drawing. GPU validation traps an out-of-bounds
      # shader access instead of letting it return whatever was in memory, so
      # the frame changing under it points at a real out-of-bounds read in the
      # UI path rather than at the switch. The HAL suite above runs *with* it
      # and is clean, which narrows it further: whatever it is, it is in the
      # renderer's path and not the backend's.
      #
      # Left off here so this step keeps gating the picture, and recorded in
      # `docs/backlog.md` for somebody with a Mac. Turning it back on is how
      # that investigation starts.
      - name: Draw a frame through ForwardRenderer on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          # `nslog`, not `abort`: Metal asserts on an env value it does not
          # recognise rather than ignoring it, and `abort` is not one it takes.
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-render-e2e.sh

      # The same HAL-seam behaviours on this backend, from the one agnostic
      # binary. It replaces per-backend copies that had drifted apart; without
      # this step the tests deleted from `vk_e2e`/`wgpu_e2e` would be a net loss
      # of coverage rather than a consolidation.
      # **The other direction of the parity contract**, on this backend. See the
      # lavapipe job's copy for why a capable device cannot exercise it: every
      # capability gated on a device feature is declared supported when the
      # feature is granted, so only "declared supported must work" ever runs.
      # `CRCBL_SEAM_WITHHOLD=all` opens the device with no optional feature and
      # puts those rows on the refusal side.
      #
      # Scoped to the one test: the reviewed-divergence snapshot and the
      # pipeline-layout ceiling describe the capable configuration and
      # legitimately do not hold here.
      - name: Check the refusal half of the parity contract on Metal
        env:
          CRCBL_GPU: mtl
          CRCBL_SEAM_WITHHOLD: all
        run: >
          crates/crcbl/tests/run-hal-seam-e2e.sh -E
          'test(every_declared_capability_behaves_the_way_it_was_declared)'

      - name: Run the HAL seam suite on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-hal-seam-e2e.sh

      # The draw-generation buffers on Metal — the backend with the most to say
      # here, because it is the one on `GeometryPath::IndirectPerBatch` and the
      # one whose `fillBuffer:range:value:` repeats a *byte* rather than a word.
      # Until this step existed no Metal run had read a single GPU-written
      # draw-generation number; the ForwardRenderer step above compares pictures,
      # and a wrong `first_index` naming the same range draws the right picture.
      #
      # Same validation switches as the two renderer steps, for the reason argued
      # at the ForwardRenderer one — `MTL_SHADER_VALIDATION` deliberately absent.
      - name: Check the draw generation on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-draw-gen-e2e.sh

      # The forward pass's own state on Metal. Until this step existed no Metal
      # run had read a single shadow-atlas texel or froxel count: the goldens the
      # ForwardRenderer step compares are exactly what a shadow pass that
      # rendered nothing produces, because every surface is then lit and no
      # artifact appears anywhere.
      #
      # Same validation switches as the renderer steps, for the reason argued at
      # the ForwardRenderer one — `MTL_SHADER_VALIDATION` deliberately absent.
      - name: Check the forward pass on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-forward-e2e.sh

      # The sprite pass on Metal. Until this step existed no Metal run had drawn
      # a sprite quad at all: `render_e2e`'s `sprite` scene is the screenshot
      # path's black-box golden and makes none of the placement, frame-selection,
      # filtering or seam claims this suite does.
      #
      # Same validation switches as the renderer steps, for the reason argued at
      # the ForwardRenderer one — `MTL_SHADER_VALIDATION` deliberately absent.
      - name: Draw the sprite pass on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-sprite-e2e.sh

      # The lit mesh on Metal — the last of the five clusters, and the one whose
      # migration was a redesign rather than a move. Half of `vk_e2e/mesh.rs`
      # opens devices demanding `MESH_SHADER | TASK_SHADER` and asserts on the
      # geometry path selected; Metal has no mesh stage, so that half stayed on
      # Vulkan and this step is the rest: the four lit-mesh goldens, the
      # `Rgba16Float` scene target's linear values, the transient pool under a
      # resize storm and the uniform level-of-detail cut.
      #
      # Metal is also the backend on `GeometryPath::IndirectPerBatch`, which is
      # what makes the uniform cut here worth a step of its own: it is the only
      # granularity this backend has, and until now nothing had read the level it
      # selected on anything but Vulkan.
      #
      # Same validation switches as the renderer steps, for the reason argued at
      # the ForwardRenderer one — `MTL_SHADER_VALIDATION` deliberately absent.
      - name: Draw the lit mesh on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-mesh-e2e.sh

      # The physical-tiling count on Metal. It draws through `ForwardRenderer`,
      # so the same validation switches the step above sets apply here and for
      # the same reason — `MTL_SHADER_VALIDATION` deliberately absent, as
      # argued at the ForwardRenderer step.
      #
      # This suite draws no UI pass, so the finding that held that switch off
      # does not arise here; leaving it off anyway keeps the two renderer steps
      # comparable rather than making this one the odd configuration nobody
      # else runs.
      - name: Count the physical tiling on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-tiling-e2e.sh

      # See the WARP step of the same name. This arm is the one with no local
      # measurement behind it — there is no Metal device here — so it is the arm
      # to read first if the suite goes red.
      - name: Draw an imported glTF on Metal
        env:
          CRCBL_GPU: mtl
          MTL_DEBUG_LAYER: '1'
          MTL_DEBUG_LAYER_ERROR_MODE: nslog
          MTL_DEBUG_LAYER_WARNING_MODE: nslog
        run: crates/crcbl/tests/run-gltf-e2e.sh

      - name: Upload golden-image diffs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-diff-metal
          path: target/golden-diff/
          if-no-files-found: ignore
  shaders:
    name: shaders (committed artifacts match their sources)
    runs-on: ubuntu-latest
    # Raised from 10 when `dxc` was added: its archive is around 492 MiB and
    # dominates the job's wall clock. See the install step.
    timeout-minutes: 20
    env:
      SLANG_VERSION: '2026.14'
      # Pinned in `crates/crcbl-shaders/tools/compile-shaders.sh` and repeated
      # here, exactly as the
      # Slang version is. The script checks what the binary *reports* rather
      # than this tag — a `dxc` does not know which release it came from — so a
      # mismatched download fails the check step rather than silently producing
      # different bytes.
      DXC_RELEASE: 'v1.9.2607'
      DXC_ASSET: 'linux_dxc_2026_07_29.x86_x64.tar.gz'
      SPIRV_TOOLS_VERSION: '2026.1-1'
      SPIRV_TOOLS_MAJOR: '2026.1'
    steps:
      - uses: actions/checkout@v7
      # `spirv-val` and `spirv-dis`: the script validates every fresh artifact
      # against Vulkan 1.3 and reads the entry points back out of it rather than
      # trusting the manifest to have been written by hand.
      #
      # **Pinned, for the same reason `slangc` and `dxc` are.** This used to be
      # a bare `apt-get install spirv-tools`, which takes whatever the runner
      # image carries — and on 2026-08-09 that was SPIRV-Tools **v2025.1**,
      # which rejects a valid mesh shader over
      # `VUID-PrimitiveTriangleIndicesEXT-…-07054`, claiming the indices
      # decoration is used without `OutputTrianglesEXT` on a module that plainly
      # declares it on both entry points reading the decorated variable. It is
      # an upstream validator bug, fixed between v2025.1 and v2026.x: the same
      # artifact is accepted by v2026.1 and v2026.3, and rendered correctly by
      # radv and lavapipe. Both validators were run against it locally to
      # establish that rather than infer it.
      #
      # The `.deb` comes from Ubuntu's own pool at a fixed version, because
      # LunarG publishes no repository for the SDK this pins to. A validator is
      # part of an artifact's provenance exactly as much as the compiler that
      # emitted it, and an unpinned one means CI and a developer can disagree
      # about whether an artifact is valid with neither able to reproduce the
      # other — which is what happened.
      - name: Install the pinned spirv-tools
        run: |
          # Bounded and retried, because an unwrapped fetch here took a green
          # board down: this step hung twenty minutes on a stalled connection
          # and the job hit its own timeout, which GitHub reports as
          # **cancelled** — indistinguishable from somebody pushing over the
          # run. `.github/actions/apt-packages` makes this argument at length;
          # these fetches were simply never given the same treatment.
          curl -sSfL --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 120 -o /tmp/spirv-tools.deb \
            "http://archive.ubuntu.com/ubuntu/pool/universe/s/spirv-tools/spirv-tools_${SPIRV_TOOLS_VERSION}_amd64.deb"
          # Best-effort, and deliberately not chained to the install: a refresh
          # that uses its whole timeout must not consume the attempt after it.
          timeout 120 sudo apt-get update \
            || echo "the refresh did not finish; installing against the lists we have"
          timeout 180 sudo apt-get install -y --no-install-recommends /tmp/spirv-tools.deb
          # A validator that is not the pin is what this step exists to prevent,
          # so it is checked rather than trusted.
          FOUND="$(spirv-val --version | head -1)"
          echo "crcbl shaders: $FOUND"
          case "$FOUND" in
          *"SPIRV-Tools v${SPIRV_TOOLS_MAJOR}"*) ;;
          *)
              echo "crcbl shaders: spirv-val is '$FOUND', not the pinned" >&2
              echo "  v${SPIRV_TOOLS_MAJOR}. v2025.1 and earlier reject valid" >&2
              echo "  mesh shaders; that is why this is pinned." >&2
              exit 1
              ;;
          esac
      # The `glibc-2.27` build, not the default one: the default is linked
      # against a newer glibc than the runner image is guaranteed to carry, and
      # a toolchain that works on one runner generation and not the next is the
      # failure mode this whole design exists to avoid.
      - name: Install the pinned slangc
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 -o slang.tar.gz \
            "https://github.com/shader-slang/slang/releases/download/v${SLANG_VERSION}/slang-${SLANG_VERSION}-linux-x86_64-glibc-2.27.tar.gz"
          mkdir -p "${RUNNER_TEMP}/slang"
          tar xzf slang.tar.gz -C "${RUNNER_TEMP}/slang"
          echo "CRCBL_SLANGC=${RUNNER_TEMP}/slang/bin/slangc" >>"$GITHUB_ENV"
      # **This download is around 492 MiB**, which is the bulk of this job's
      # wall-clock time and worth knowing before adding another step beside it.
      # Microsoft ships one Linux archive covering every tool; there is no
      # compiler-only asset to take instead.
      #
      # `bin/dxc` finds its own `lib/libdxcompiler.so` and `lib/libdxil.so`
      # through an RPATH, so no `LD_LIBRARY_PATH` is exported here — and
      # `libdxil.so` is what *signs* the container. An unsigned one hashes and
      # compares like any other artifact and is then refused by every real D3D12
      # driver, which is why the script checks the container digest of every
      # file it generates.
      - name: Install the pinned dxc
        run: |
          curl -fsSL --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 20 --max-time 180 -o dxc.tar.gz \
            "https://github.com/microsoft/DirectXShaderCompiler/releases/download/${DXC_RELEASE}/${DXC_ASSET}"
          mkdir -p "${RUNNER_TEMP}/dxc"
          # `--strip-components=1` because the archive wraps everything in a
          # directory named after the asset, so without it the binary's path
          # would carry the release's date and every bump would move it.
          tar xzf dxc.tar.gz -C "${RUNNER_TEMP}/dxc" --strip-components=1
          chmod +x "${RUNNER_TEMP}/dxc/bin/dxc"
          echo "CRCBL_DXC=${RUNNER_TEMP}/dxc/bin/dxc" >>"$GITHUB_ENV"
      - name: Check the committed artifacts against their sources
        run: crates/crcbl-shaders/tools/compile-shaders.sh --check

  decoder-fuzz:
    name: decoder fuzz (libFuzzer)
    runs-on: ubuntu-latest
    # The fuzzer is independently bounded below; this remains the guard for a
    # compiler, runner, or libFuzzer regression that ignores its run limit.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: nightly-2026-07-02
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: decoder-fuzz
          workspaces: crates/crcbl-net/fuzz -> target
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-fuzz@0.13.1
      # ALSA headers for `cpal`; see the `clippy` job for why. The fuzz target
      # is `crcbl-net`'s, but `cargo test` on its manifest builds the workspace
      # dependency graph that reaches `crcbl-audio`.
      - name: Install the ALSA headers cpal links against
        timeout-minutes: 8
        uses: ./.github/actions/apt-packages
        with:
          packages: libasound2-dev
      # The fuzz target's formatting is checked by the `rustfmt` job: this
      # toolchain is pinned to a nightly with no `cargo-fmt` in it.
      - name: Replay named corpus assertions
        run: >-
          cargo test --manifest-path crates/crcbl-net/fuzz/Cargo.toml --locked
          --test corpus
      # A fixed seed and nonzero run count make this a bounded, reproducible
      # execution of every decoder over both the committed corpus and mutations.
      #
      # `--target` is spelled out because `cargo fuzz` defaults it to the triple
      # **cargo-fuzz itself was built for**, and the binary that lands here is
      # the prebuilt `x86_64-unknown-linux-musl` one (install-action has no
      # recipe for cargo-fuzz@0.13.1 and falls back to cargo-binstall, which
      # picks the static build). Without this the job asked the toolchain for a
      # musl std it does not have and reported it as "sanitizer is incompatible
      # with statically linked libc" — a message about a target nobody chose.
      - name: Fuzz hostile decoder packets
        run: >-
          cargo fuzz run --fuzz-dir crates/crcbl-net/fuzz --target
          x86_64-unknown-linux-gnu decoder crates/crcbl-net/fuzz/corpus/decoder
          -- -runs=10000 -seed=20260730 -max_len=65537 -timeout=10
      - name: Verify fuzz lockfile stayed current
        run: git diff --exit-code -- crates/crcbl-net/fuzz/Cargo.lock
      - name: Upload decoder fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: decoder-fuzz-artifacts
          path: |
            crates/crcbl-net/fuzz/artifacts/decoder/
            crates/crcbl-net/fuzz/coverage/decoder/
          if-no-files-found: ignore

  coverage:
    name: coverage (linux)
    runs-on: ubuntu-latest
    # Instrumented build plus a full suite re-run.
    timeout-minutes: 45
    env:
      # Measured on this commit: 77.59% of lines locally, 77.43% on the runner
      # once this job got a Vulkan driver (see the install step). The floor sits
      # just below it so a genuine regression fails and normal churn does not.
      # Verified locally: `--fail-under-lines 76` exits 0 and `78` exits 1.
      #
      # Raised from 75, which was calibrated at 76.73% on a developer machine
      # and had never been enforced by a run that got this far.
      COVERAGE_FLOOR: '76'
    steps:
      - uses: actions/checkout@v7
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          # Not in rust-toolchain.toml — see the comment there.
          components: llvm-tools-preview
          cache: false
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: coverage
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov@0.8.7,cargo-nextest@0.9.140
      # ALSA headers for `cpal`; see the `clippy` job for why.
      #
      # The Vulkan loader and lavapipe are here for a different reason: without
      # a driver, every `crcbl-vk` and `crcbl-wgpu` test still *runs* and still
      # passes, because each one opens the backend and returns early when there
      # is none. Same test count, a fifth of the code executed — measured, once
      # this job could compile again: `device.rs` 3.97% against 63.39% on a
      # machine with a driver, `command.rs` 7.01% against 57.39%, `pipeline.rs`
      # 28.69% against 78.12%, and the workspace total 72.06% against 77.57%.
      # A coverage number that says how much of the *backend* code a runner
      # happens to be able to reach is not measuring the test suite.
      - name: Install the ALSA headers, the Vulkan loader and lavapipe
        timeout-minutes: 10
        uses: ./.github/actions/apt-packages
        with:
          packages: >-
            libasound2-dev libvulkan1 mesa-vulkan-drivers
      # Pinned to the software ICD for the reason `vk-e2e` pins it: a runner
      # that grew a GPU tomorrow would otherwise change what this job measures
      # without a commit.
      - name: Run tests under instrumentation
        env:
          CRCBL_VK_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          CRCBL_WGPU_ICD: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run:
          cargo llvm-cov --no-report nextest --workspace --all-features --locked
      - name: Generate lcov report
        run: cargo llvm-cov report --lcov --output-path lcov.info
      - name: Coverage summary
        run: cargo llvm-cov report --summary-only
      # The gate. It was deferred with a TODO whose reason ("every crate is
      # empty in P0") stopped being true several phases ago, and a coverage job
      # that only prints a number enforces nothing.
      #
      # COVERAGE_FLOOR is set just below the measured line coverage, so it fails
      # on a real regression and not on rounding. `docs/plan/12-testing.md` asks
      # for per-crate floors (core/phys/net high, backend crates looser);
      # `cargo llvm-cov` gates the workspace as a whole, so this is the
      # workspace floor and the per-crate split waits for tooling that can
      # express it. Raise the number when coverage rises — never lower it to
      # make a red build green.
      - name: Enforce the coverage floor
        run: cargo llvm-cov report --fail-under-lines "${COVERAGE_FLOOR}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: lcov.info
          if-no-files-found: warn
