# A hand-run probe: can any hosted macOS image execute a Metal shader?
#
# `docs/backlog.md`'s "Metal cannot execute a shader in CI" was measured on
# `macos-latest` alone — one image, one GPU, one draw — and the conclusion drawn
# from it is that only a self-hosted Mac closes the gap. This asks the cheap
# questions first, and asks them of every image GitHub still offers:
#
#   1. Which `MTLDevice` does each image hand out? Only `macos-latest` was ever
#      looked at, and it is one label pointing at one of these.
#   2. Does a **compute** dispatch execute? Every test the backend gates behind
#      `mtl-e2e` is a draw, so the hang is known for the rasteriser and unknown
#      for everything else. If compute runs, most of the shader coverage the
#      gap describes becomes reachable in CI.
#   3. Does the dynamic index into a `thread`-address-space array matter?
#      `docs/backlog.md` lists replacing it with a branchless select as an
#      unrun experiment; two draws instead of one settle it here for free.
#
# **This is a probe, not a gate — it prints evidence and exits 0.** A red leg
# means the runner or the toolchain, not the answer; the answer is in the
# `verdict=` lines. It is `workflow_dispatch` only and lives in its own file so
# that dispatching it does not rerun `ci.yml`'s macOS and Windows builds, which
# bill at ten times the Linux rate to answer nothing asked here.
#
# **Delete this workflow once the answers are in `docs/backlog.md`.** A probe
# left behind after it has been read is a job nobody runs and everybody skips.
name: Metal GPU probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: which GPU (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The hang this is looking for is a hang: the Swift script bounds each wait
    # itself, and this is the outer bound if the bound fails.
    timeout-minutes: 15
    strategy:
      # A retired image label is itself a result — that leg fails with no
      # matching runner, which is the answer for that image.
      fail-fast: false
      matrix:
        os: [macos-13, macos-14, macos-15, macos-26]
    steps:
      - name: What this runner is
        run: |
          sw_vers
          uname -m
          sysctl -n machdep.cpu.brand_string || true

      # Metal is asked directly rather than through `system_profiler`, which
      # describes the *display* subsystem — a headless VM may report none at all,
      # while still handing `MTLCopyAllDevices` the device the backend opens.
      - name: What Metal has, and whether it runs anything
        run: |
          cat > "${RUNNER_TEMP}/probe.swift" <<'SWIFT'
          import Metal
          import Foundation

          // Every wait is bounded, because a hung command buffer is the outcome
          // being tested for and `waitUntilCompleted` would take the whole job
          // down with it rather than reporting.
          let deadline = DispatchTimeInterval.seconds(60)

          func settle(_ buffer: MTLCommandBuffer, _ label: String) -> Bool {
              let done = DispatchSemaphore(value: 0)
              buffer.addCompletedHandler { _ in done.signal() }
              buffer.commit()
              if done.wait(timeout: .now() + deadline) == .timedOut {
                  print("verdict=\(label): TIMED OUT after \(deadline)")
                  return false
              }
              if let error = buffer.error {
                  print("verdict=\(label): FAULTED \(error)")
                  return false
              }
              return true
          }

          let devices = MTLCopyAllDevices()
          print("MTLCopyAllDevices=\(devices.count)")
          for device in devices {
              print("name=\(device.name) low-power=\(device.isLowPower) "
                  + "headless=\(device.isHeadless) removable=\(device.isRemovable) "
                  + "unified-memory=\(device.hasUnifiedMemory) "
                  + "argument-buffers-tier=\(device.argumentBuffersSupport.rawValue)")
          }

          guard let device = MTLCreateSystemDefaultDevice() else {
              print("system-default=none — nothing further to ask")
              exit(0)
          }
          print("system-default=\(device.name)")

          guard let queue = device.makeCommandQueue() else {
              print("verdict=queue: could not be created")
              exit(0)
          }

          // # 1. Compute
          //
          // `i * i` over 64 threads, checked against the same expression the
          // kernel computes — the assertion cannot pass on a device that wrote
          // nothing, because the buffer starts zeroed and index 1 onwards is not.
          let computeSource = """
          #include <metal_stdlib>
          using namespace metal;
          kernel void square(device uint *out [[buffer(0)]],
                             uint i [[thread_position_in_grid]]) {
              out[i] = i * i;
          }
          """
          let width = 64
          do {
              let library = try device.makeLibrary(source: computeSource, options: nil)
              let function = library.makeFunction(name: "square")!
              let pipeline = try device.makeComputePipelineState(function: function)
              let out = device.makeBuffer(length: width * MemoryLayout<UInt32>.stride,
                                          options: .storageModeShared)!
              let buffer = queue.makeCommandBuffer()!
              let encoder = buffer.makeComputeCommandEncoder()!
              encoder.setComputePipelineState(pipeline)
              encoder.setBuffer(out, offset: 0, index: 0)
              // Whole threadgroups rather than `dispatchThreads`, which needs
              // non-uniform threadgroup support this is in no position to assume
              // of a virtualised device. 64 divides into two groups of 32.
              encoder.dispatchThreadgroups(MTLSize(width: 2, height: 1, depth: 1),
                                           threadsPerThreadgroup: MTLSize(width: 32, height: 1, depth: 1))
              encoder.endEncoding()
              if settle(buffer, "compute") {
                  let values = out.contents().bindMemory(to: UInt32.self, capacity: width)
                  let wrong = (0..<width).filter { values[$0] != UInt32($0 * $0) }
                  if wrong.isEmpty {
                      print("verdict=compute: EXECUTED, \(width) squares correct")
                  } else {
                      print("verdict=compute: RAN BUT WRONG at \(wrong.prefix(8))")
                  }
              }
          } catch {
              print("verdict=compute: could not build — \(error)")
          }

          // # 2 and 3. Two draws that differ only in how the vertex is chosen
          //
          // `array` is the shape `crcbl-mtl`'s triangle uses and the shape that
          // hung; `select` is the branchless form `docs/backlog.md` names as the
          // unrun experiment. Same geometry, same assertion — so a split verdict
          // says the dynamic index is the fault and a matching one says it is not.
          let drawSource = """
          #include <metal_stdlib>
          using namespace metal;
          vertex float4 vertexArray(uint vid [[vertex_id]]) {
              float2 corners[3] = { float2(-1, -1), float2(3, -1), float2(-1, 3) };
              return float4(corners[vid], 0, 1);
          }
          vertex float4 vertexSelect(uint vid [[vertex_id]]) {
              float x = vid == 1 ? 3.0 : -1.0;
              float y = vid == 2 ? 3.0 : -1.0;
              return float4(x, y, 0, 1);
          }
          fragment float4 fragmentGreen() { return float4(0, 1, 0, 1); }
          """
          let side = 64
          func draw(_ vertexName: String, _ library: MTLLibrary) {
              let descriptor = MTLRenderPipelineDescriptor()
              descriptor.vertexFunction = library.makeFunction(name: vertexName)!
              descriptor.fragmentFunction = library.makeFunction(name: "fragmentGreen")!
              descriptor.colorAttachments[0].pixelFormat = .bgra8Unorm
              let pipeline: MTLRenderPipelineState
              do {
                  pipeline = try device.makeRenderPipelineState(descriptor: descriptor)
              } catch {
                  print("verdict=\(vertexName): pipeline would not build — \(error)")
                  return
              }

              let target = MTLTextureDescriptor.texture2DDescriptor(
                  pixelFormat: .bgra8Unorm, width: side, height: side, mipmapped: false)
              target.usage = [.renderTarget, .shaderRead]
              target.storageMode = .shared
              let texture = device.makeTexture(descriptor: target)!

              let pass = MTLRenderPassDescriptor()
              pass.colorAttachments[0].texture = texture
              pass.colorAttachments[0].loadAction = .clear
              // Red, so a green centre can only have come from the fragment
              // shader and not from the clear.
              pass.colorAttachments[0].clearColor = MTLClearColor(red: 1, green: 0, blue: 0, alpha: 1)
              pass.colorAttachments[0].storeAction = .store

              let buffer = queue.makeCommandBuffer()!
              let encoder = buffer.makeRenderCommandEncoder(descriptor: pass)!
              encoder.label = vertexName
              encoder.setRenderPipelineState(pipeline)
              encoder.drawPrimitives(type: .triangle, vertexStart: 0, vertexCount: 3)
              encoder.endEncoding()
              guard settle(buffer, vertexName) else { return }

              var texel = [UInt8](repeating: 0, count: 4)
              texture.getBytes(&texel, bytesPerRow: 4,
                               from: MTLRegionMake2D(side / 2, side / 2, 1, 1),
                               mipmapLevel: 0)
              // BGRA: green is byte 1.
              if texel[1] > 0xC0 && texel[2] < 0x40 {
                  print("verdict=\(vertexName): EXECUTED, centre is bgra\(texel)")
              } else {
                  print("verdict=\(vertexName): RAN BUT WRONG, centre is bgra\(texel)")
              }
          }

          do {
              let library = try device.makeLibrary(source: drawSource, options: nil)
              draw("vertexArray", library)
              draw("vertexSelect", library)
          } catch {
              print("verdict=draw: could not build — \(error)")
          }
          SWIFT
          swift "${RUNNER_TEMP}/probe.swift"
