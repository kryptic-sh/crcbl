[package]
name = "flappy"
description = "Flappy — the engine's second game, and the test that it has no breakout-shaped assumptions"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary**, for the reason
# `apps/breakout/Cargo.toml` sets out at length: the same loop has to be
# reachable from `main.rs` (argv, exit codes) and from a browser's JS shim, and
# a bin crate has no linkable artifact for the second.
#
# The lib is not called `flappy`. A lib and a bin of the same name in one
# package write the same `flappy.wasm`, which cargo calls an output filename
# collision and which means the file the Pages deploy picks up is whichever
# target finished last.
[lib]
name = "crcbl_flappy"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "flappy"
path = "src/main.rs"

# Deliberately a subset of breakout's list. Every dependency here is one this
# slice actually calls; the audio, storage and graphics crates arrive with the
# slices that use them, so `cargo machete` stays meaningful.
[dependencies]
crcbl = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-input = { workspace = true }
crcbl-server = { workspace = true }
crcbl-client = { workspace = true }
crcbl-core = { workspace = true }
crcbl-audio = { workspace = true }
crcbl-store = { workspace = true }
# The sheet description the sprite pass draws from, and the reader for the pair
# `build.rs` bakes. `load`, not `bake`: this half never sees a `.crpix`, and a
# shipped binary that linked the PNG *encoder* would be linking it to encode
# nothing.
crcbl-sprite = { workspace = true, features = ["load"] }
glam = { workspace = true }
log = { workspace = true }

# The other half, and the other feature. Cargo resolves build-dependency
# features separately from normal ones, so `bake`'s PNG encoder reaches the
# build script and not the game.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
