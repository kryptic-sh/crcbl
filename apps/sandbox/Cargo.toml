[package]
name = "sandbox"
description = "Crucible dev playground — the first window lives here"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# One engine dependency, exactly like a game scaffolded by `crcbl new`: the
# sandbox is the reference consumer, so anything it needs that the umbrella does
# not re-export is a gap in the umbrella, not a reason to add a second path
# dependency here. `log` was the last exception and is now `crcbl::log`.
[dependencies]
crcbl = { workspace = true }

# The helpers this sample's own unit tests read a frame back with — `ui_text`,
# `row_value` and `headless_common`, each a fact about an engine surface that
# every sample had written out for itself. A dev-dependency, so it reaches no
# shipped binary; see `apps/crcbl-sample-test/Cargo.toml`.
[dev-dependencies]
crcbl-sample-test = { workspace = true }

[lints]
workspace = true

[features]
# Steamworks in the sandbox: init under Valve's shared test app 480 on a
# windowed run, pump once a frame, log the player's identity and the overlay,
# and pause the way focus loss does when the overlay opens. Off by default,
# because a sandbox run should not touch a developer's Steam client unless
# asked; Steamworks slice 1b's manual step (in `docs/backlog.md`) is what it
# exists to check by hand.
steam = ["crcbl/steam"]
