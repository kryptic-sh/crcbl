[package]
name = "hud"
description = "The UI system's living fixture: a game-style HUD built from draw-list primitives and nothing else"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, like every other sample**, and for both of
# the reasons `apps/breakout/Cargo.toml` gives at length: `src/main.rs` owns argv
# and the exit code, `src/web.rs` is an `extern "C"` entry point a browser's JS
# shim drives once per `requestAnimationFrame`, and a bin crate has no linkable
# artifact for the second.
#
# `cdylib` is what `wasm32-unknown-unknown` links into a `.wasm`; `rlib` is what
# `main.rs` links against. Both are needed — a `cdylib`-only lib cannot be a
# dependency of the binary in the same package.
#
# The lib is not called `hud`. A lib and a bin of the same name in one package
# write the same `hud.wasm`, which cargo calls an output filename collision.
[lib]
name = "crcbl_hud"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "hud"
path = "src/main.rs"

# One engine dependency. No `build-dependencies`: this sample is **exempt from
# sample rule 11** (`.crpix` art through the sprite pass) and its own plan doc
# says why — its subject is the widget system, and a sprite sheet in front of it
# would be showing something else. So there is no `build.rs` and no bake step.
[dependencies]
crcbl = { workspace = true }

# `tests/golden.rs`'s image I/O — loading the PNG the binary wrote and comparing
# it against the reference. A dev-dependency on `crcbl-golden`'s own manifest
# terms: nothing here reaches the shipped game. The *encoder* the binary uses is
# `crcbl`'s, which links the same crate on native — see
# `crates/crcbl/Cargo.toml`.
[dev-dependencies]
crcbl-golden = { workspace = true }

[lints]
workspace = true

[features]
# `tests/golden.rs` — the frame the compiled binary presents under
# `--screenshot`, off a real device, against a checked-in golden. Feature-gated
# *and* `#[ignore]`d, the same pair `crcbl`'s `render-e2e` and breakout's
# `golden-e2e` use: a plain `cargo test --workspace --all-features` on a machine
# with no GPU must stay green, and `tests/run-hud-golden.sh` is the only thing
# that turns it on — and it fails when the suite reports zero tests run.
golden-e2e = []
