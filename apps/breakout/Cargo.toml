[package]
name = "breakout"
description = "Breakout — first playable Crucible sample"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# One engine dependency, same pattern as apps/sandbox: the game names `crcbl`
# and nothing else. `log` is for per-event debug logging.
# Direct ECS/net/input/server/client deps because the umbrella does not
# re-export them (per `docs/plan/ROADMAP.md`, samples are the consumers).
[dependencies]
crcbl = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-input = { workspace = true }
crcbl-server = { workspace = true }
crcbl-client = { workspace = true }
crcbl-core = { workspace = true }
crcbl-audio = { workspace = true }
crcbl-store = { workspace = true }
glam = { workspace = true }
log = { workspace = true }

[lints]
workspace = true
