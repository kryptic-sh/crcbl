[package]
name = "breakout"
description = "Breakout — first playable Crucible sample"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary.** P5.8 needs the same loop
# reachable from `main.rs` (argv, exit codes) and from a browser's JS shim
# (`src/web.rs`, an `extern "C"` entry point the shim drives once per
# `requestAnimationFrame`). A bin crate has no linkable artifact for the second,
# so the game moved into `src/lib.rs` and both callers are thin.
#
# `cdylib` is what `wasm32-unknown-unknown` links into a `.wasm`; `rlib` is what
# `main.rs` links against. Both are needed — a `cdylib`-only lib cannot be a
# dependency of the binary in the same package.
#
# The lib is **not** called `breakout`. A lib and a bin with the same name in
# one package write the same `breakout.wasm`, which cargo reports as an "output
# filename collision" and says may become a hard error — and which, until then,
# means the file the Pages deploy picks up is whichever target finished last.
# One of the two is the game as a `cdylib` and the other is a `main` that calls
# `std::env::args`; they must not be able to trade places.
[lib]
name = "crcbl_breakout"
crate-type = ["cdylib", "rlib"]

# **One engine dependency, which is what this crate always claimed and did not
# have.** The umbrella used to re-export the graphics stack alone, so the
# simulation half — ECS, physics, input, net, server, client, audio, store,
# sprite — was eleven workspace paths named right here. All nine are
# `crcbl::ecs`, `crcbl::phys`, … now, `glam` is `crcbl::math` and `log` is
# `crcbl::log`, so a sample depends on `crcbl` and the standard library and on
# nothing else. `apps/sandbox` was the only consumer that ever looked like this;
# all five do now.
[dependencies]
crcbl = { workspace = true }

# The build script's half, and the other feature. `crcbl` re-exports
# `crcbl-sprite`'s reader; it does not re-export the PNG *encoder*, and it
# should not. Cargo resolves build-dependency features separately from normal
# ones, so naming the crate here is what keeps `bake` out of the shipped
# binary — and is the one dependency a sample still spells for itself.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
