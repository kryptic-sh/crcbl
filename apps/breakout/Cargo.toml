[package]
name = "breakout"
description = "Breakout — first playable Crucible sample"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary.** P5.8 needs the same loop
# reachable from `main.rs` (argv, exit codes) and from a browser's JS shim
# (`src/web.rs`, an `extern "C"` entry point the shim drives once per
# `requestAnimationFrame`). A bin crate has no linkable artifact for the second,
# so the game moved into `src/lib.rs` and both callers are thin.
#
# `cdylib` is what `wasm32-unknown-unknown` links into a `.wasm`; `rlib` is what
# `main.rs` links against. Both are needed — a `cdylib`-only lib cannot be a
# dependency of the binary in the same package.
#
# The lib is **not** called `breakout`. A lib and a bin with the same name in
# one package write the same `breakout.wasm`, which cargo reports as an "output
# filename collision" and says may become a hard error — and which, until then,
# means the file the Pages deploy picks up is whichever target finished last.
# One of the two is the game as a `cdylib` and the other is a `main` that calls
# `std::env::args`; they must not be able to trade places.
[lib]
name = "crcbl_breakout"
crate-type = ["cdylib", "rlib"]

# **Eleven engine dependencies, not one.** `apps/sandbox` names `crcbl` and
# nothing else; breakout cannot, because the umbrella re-exports only the
# graphics stack (`core`, `shell`, `hal`, `render`, `shaders`, `ui`) and the
# simulation half — ECS, physics, input, net, server, client, audio, store — has
# no re-export. `docs/plan/ROADMAP.md` puts samples on the consumer side of that
# line deliberately, so the paths are named here rather than hidden; the comment
# that used to claim "one engine dependency" was counting the first line only.
#
# The umbrella growing `crcbl::ecs`/`::phys`/`::net`/… is what would collapse
# this list, and is the change to make when the simulation crates stabilise.
# `glam` is here for the `DVec3` the physics seam speaks; `log` for per-event
# debug logging.
[dependencies]
crcbl = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-input = { workspace = true }
crcbl-server = { workspace = true }
crcbl-client = { workspace = true }
crcbl-core = { workspace = true }
crcbl-audio = { workspace = true }
crcbl-store = { workspace = true }
# The sheet description the sprite pass draws from, and the reader for the pair
# `build.rs` bakes. `load`, not `bake`: this half never sees a `.crpix`, and a
# shipped binary that linked the PNG *encoder* would be linking it to encode
# nothing.
crcbl-sprite = { workspace = true, features = ["load"] }
glam = { workspace = true }
log = { workspace = true }

# The other half, and the other feature. Cargo resolves build-dependency
# features separately from normal ones, so `bake`'s PNG encoder reaches the
# build script and not the game.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
