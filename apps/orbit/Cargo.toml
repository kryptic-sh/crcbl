[package]
name = "orbit"
description = "Orbit — the physics pillar's acceptance test: launch, orbit, timewarp, land"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, like every other sample.** `src/main.rs` owns
# argv and the exit code, `src/web.rs` is an `extern "C"` entry point a browser's
# JS shim drives once per `requestAnimationFrame`, and a bin crate has no
# linkable artifact for the second. See `apps/breakout/Cargo.toml` at length.
#
# The lib is not called `orbit`: a lib and a bin of the same name in one package
# write the same `orbit.wasm`, which cargo calls an output filename collision.
[lib]
name = "crcbl_orbit"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "orbit"
path = "src/main.rs"

[dependencies]
crcbl = { workspace = true }
# The flight is written in `f64` vectors throughout — `crcbl::phys` speaks
# `glam`'s and so does this sample, rather than converting at every call.
glam = { workspace = true }

# The build script's half: `build.rs` bakes `assets/*.crpix`, the flight UI's
# markers, navball and chrome, and it needs `crcbl-sprite`'s PNG *encoder*,
# which `crcbl` does not re-export. Named here rather than as a normal
# dependency so `bake` stays out of the shipped binary — `apps/towers/Cargo.toml`
# has the same pair.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

# The helpers this sample's own unit tests read a frame back with — `ui_text`,
# `row_value` and `headless_common`, each a fact about an engine surface that
# every sample had written out for itself. A dev-dependency, so it reaches no
# shipped binary; see `apps/crcbl-sample-test/Cargo.toml`.
[dev-dependencies]
crcbl-sample-test = { workspace = true }

[lints]
workspace = true
