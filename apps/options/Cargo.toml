[package]
name = "options"
description = "The settings acceptance test: a screen that writes a player's settings and reads them back"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, like every other sample.** `src/main.rs` owns
# argv and the exit code; `src/web.rs` carries the `__crcbl_options_*` ABI the
# page at `/demos/options/` is driven through.
#
# The lib is not called `options`: a lib and a bin of the same name in one
# package write the same `options.wasm`, which cargo calls an output filename
# collision.
[lib]
name = "crcbl_options"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "options"
path = "src/main.rs"

# One engine dependency — the mixer and the synthesiser `src/audio.rs` plays
# through are `crcbl::audio`, which is a re-export. No `build-dependencies`:
# this sample is **exempt from sample rule 11** (`.crpix` art through the sprite
# pass) on the same ground `apps/hud` is — its subject is a screen — and its own
# plan doc says so.
[dependencies]
crcbl = { workspace = true }

[lints]
workspace = true
