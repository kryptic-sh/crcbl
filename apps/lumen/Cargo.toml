[package]
name = "lumen"
description = "Lumen — the lighting acceptance fixture: one room, every effect"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, like every other sample**, and here with a
# third caller: `tests/golden.rs` is an integration test, and an integration test
# can only reach the room it renders through a lib target — a bin crate has no
# linkable artifact. `src/main.rs` owns argv and the exit code, and `src/web.rs`
# is the `extern "C"` entry point a browser's JS shim drives once per
# `requestAnimationFrame`, which `docs/plan/sample/13-lumen.md`'s Scope asks for.
#
# `cdylib` is what `wasm32-unknown-unknown` links into a `.wasm`; `rlib` is what
# `main.rs` and the golden suite link against. Both are needed — a `cdylib`-only
# lib cannot be a dependency of the binary in the same package.
#
# The lib is not called `lumen`: a lib and a bin of the same name in one package
# write the same file, which cargo calls an output filename collision.
[lib]
name = "crcbl_lumen"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lumen"
path = "src/main.rs"

# One engine dependency, like every other sample — with the `scene` feature on,
# which is what this sample is the first consumer of. `crcbl::render::scene`'s
# `Geometry::Flat` carries a `MeshClusters` and nothing above the seam can build
# one: §3.5 makes the cluster build a bake step, so an application that
# describes its own resident meshes needs `crcbl::scene::build_meshlets`. Every
# other sample leaves the feature off and links no glTF parser.
[dependencies]
crcbl = { workspace = true, features = ["scene"] }

# The golden suite's image I/O — comparison, diffs and PNG encoding. A
# dev-dependency, which is the whole of `crcbl-golden`'s own manifest rule: it
# reaches no shipped binary.
[dev-dependencies]
crcbl-golden = { workspace = true }

[lints]
workspace = true

[features]
# `tests/golden.rs` — the fixed camera's frame off a real device, against a
# checked-in golden. Feature-gated *and* `#[ignore]`d, the same pair
# `crcbl`'s `render-e2e` uses: a plain `cargo test --workspace --all-features`
# on a machine with no GPU must stay green, and `tests/run-lumen-golden.sh` is
# the only thing that turns it on — and it fails when the suite reports zero
# tests run.
golden-e2e = []
