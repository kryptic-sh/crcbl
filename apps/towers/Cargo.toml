[package]
name = "towers"
description = "Towers — a co-op tower defense; the solo loop on a scene-file map, three tower kinds and ten waves"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# `cdylib` for the browser demo at `/demos/towers/`, `rlib` so the binary and the
# tests share one crate — the same pair every sample uses. See
# `apps/breakout/Cargo.toml` for why both names are needed.
[lib]
name = "crcbl_towers"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "towers"
path = "src/main.rs"

# One engine dependency, like every other sample — with two features on.
#
# `greybox` is what the field is built out of. The ground slab, the lane the
# creeps walk, the build pads, the creeps and the towers are every one of them a
# `crcbl::greybox` primitive over the map in `src/map.rs` that the colliders are
# written from too.
#
# `scn` is the scene *format* half of `crcbl::scene` — the `.scn/` directory the
# path and the plots are read out of, `assets/scenes/field.scn/` — without the
# glTF importer, which nothing here reads. The same feature `apps/breakout` and
# `apps/puppet` ask for, and for the same reason.
[dependencies]
crcbl = { workspace = true, features = ["greybox", "scn"] }

# The helpers this sample's own unit tests read a frame back with — `ui_text`,
# `row_value` and `headless_common`, each a fact about an engine surface that
# every sample had written out for itself. A dev-dependency, so it reaches no
# shipped binary; see `apps/crcbl-sample-test/Cargo.toml`.
[dev-dependencies]
crcbl-sample-test = { workspace = true }

[lints]
workspace = true
