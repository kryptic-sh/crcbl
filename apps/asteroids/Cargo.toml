[package]
name = "asteroids"
description = "Asteroids — the churn sample: entities spawn and die every tick"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary**, for the reason
# `apps/flappy/Cargo.toml` sets out: the same loop has to be reachable from
# `main.rs` (argv, exit codes) and, in a later sub-slice, from a browser's JS
# shim — and a bin crate has no linkable artifact for the second. The browser
# half is not here yet; the shape is, so it does not have to be retrofitted.
#
# The lib is not called `asteroids`. A lib and a bin of the same name in one
# package write the same `asteroids.wasm`, which cargo calls an output filename
# collision.
[lib]
name = "crcbl_asteroids"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "asteroids"
path = "src/main.rs"

# A subset of flappy's list, and deliberately smaller: no `crcbl-audio` (no
# cues yet) and no `crcbl-store` (no best score yet). Each arrives with the
# sub-slice that uses it, so `cargo machete` stays meaningful.
[dependencies]
crcbl = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-input = { workspace = true }
crcbl-server = { workspace = true }
crcbl-client = { workspace = true }
crcbl-core = { workspace = true }
# The sheet description the sprite pass draws from, and the reader for the pair
# `build.rs` bakes. `load`, not `bake`: this half never sees a `.crpix`, and a
# shipped binary that linked the PNG *encoder* would be linking it to encode
# nothing.
crcbl-sprite = { workspace = true, features = ["load"] }
glam = { workspace = true }
log = { workspace = true }

# The other half, and the other feature. Cargo resolves build-dependency
# features separately from normal ones, so `bake`'s PNG encoder reaches the
# build script and not the game.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
