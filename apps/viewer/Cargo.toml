[package]
name = "viewer"
description = "Viewer — a glTF model viewer, and the asset pipeline's acceptance test"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends**, like every other sample that reaches a
# browser: `src/main.rs` natively and `src/web.rs` on `wasm32`.
#
# The browser half opens `src/shelf.rs`'s Suzanne over the page's own fetch
# source and lists the rest of the shelf on its panel; the document
# `src/demo_model.rs` generates is the fallback for a build whose site carries
# no shelf. `docs/plan/sample/05-viewer.md`'s V-F5 — "path argument natively,
# drop target in the browser" — is done on both hosts.
#
# The lib is not called `viewer`: a lib and a bin of the same name in one
# package write the same file, which cargo calls an output filename collision.
[lib]
name = "crcbl_viewer"
# `cdylib` for the browser demo — `web/build.sh` publishes this crate's
# `crcbl_viewer.wasm` — and `rlib` because the bin and the tests link the same
# library natively. Both, exactly as every other sample that reaches a browser.
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "viewer"
path = "src/main.rs"

# One engine dependency, like every other sample, with the `scene` feature on —
# this sample is what that feature is for. `crcbl::scene::import_gltf` reads the
# document and `crcbl::scene::gltf_render::build_render_scene` turns it into
# what `ForwardRenderer::with_scene` makes resident; the asset seam both sides
# name is `crcbl::assets`.
[dependencies]
crcbl = { workspace = true, features = ["scene"] }

# The tests write a `.glb` to a real directory and open it through the real
# `DirSource`, for the reason `crates/crcbl/tests/gltf_e2e.rs` gives: the key
# rule a document has to satisfy is the production one, and a mock source would
# not apply it. `src/shelf.rs`'s tests use one as an empty shelf root, which is
# how they check what an unfetched shelf reports without writing to the
# environment every other test in the process reads.
[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
