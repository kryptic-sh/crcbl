[package]
name = "horde"
description = "Horde — the scale sample: thousands of agents, one broadphase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary**, for the reason
# `apps/asteroids/Cargo.toml` sets out: the same loop has to be reachable from
# `main.rs` (argv, exit codes) and from a browser's JS shim, and a bin crate has
# no linkable artifact for the second. Only the first exists in this sub-slice;
# the shape is here from the start so the web sub-slice adds a module rather
# than restructuring the package.
#
# The lib is not called `horde`. A lib and a bin of the same name in one package
# write the same `horde.wasm`, which cargo calls an output filename collision.
[lib]
name = "crcbl_horde"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "horde"
path = "src/main.rs"

# **One engine dependency, which is what this crate always claimed and did not
# have.** The umbrella used to re-export the graphics stack alone, so the
# simulation half — ECS, physics, input, net, server, client, audio, store,
# sprite — was eleven workspace paths named right here. All nine are
# `crcbl::ecs`, `crcbl::phys`, … now, `glam` is `crcbl::math` and `log` is
# `crcbl::log`, so a sample depends on `crcbl` and the standard library and on
# nothing else. `apps/sandbox` was the only consumer that ever looked like this;
# all five do now.
[dependencies]
crcbl = { workspace = true }

# The build script's half, and the other feature. `crcbl` re-exports
# `crcbl-sprite`'s reader; it does not re-export the PNG *encoder*, and it
# should not. Cargo resolves build-dependency features separately from normal
# ones, so naming the crate here is what keeps `bake` out of the shipped
# binary — and is the one dependency a sample still spells for itself.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

# `tests/golden.rs`'s image I/O — loading the PNG the binary wrote and comparing
# it against the reference. A dev-dependency on `crcbl-golden`'s own manifest
# terms: nothing here reaches the shipped game. The *encoder* the binary uses is
# `crcbl`'s, which links the same crate on native — see
# `crates/crcbl/Cargo.toml`.
[dev-dependencies]
crcbl-golden = { workspace = true }

[lints]
workspace = true

[features]
# `tests/golden.rs` — the frame the compiled binary presents under
# `--screenshot`, off a real device, against a checked-in golden. Feature-gated
# *and* `#[ignore]`d, the same pair `crcbl`'s `render-e2e` and breakout's
# `golden-e2e` use: a plain `cargo test --workspace --all-features` on a machine
# with no GPU must stay green, and `tests/run-horde-golden.sh` is the only thing
# that turns it on — and it fails when the suite reports zero tests run.
golden-e2e = []
