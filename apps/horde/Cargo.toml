[package]
name = "horde"
description = "Horde — the scale sample: thousands of agents, one broadphase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with two front ends, not a binary**, for the reason
# `apps/asteroids/Cargo.toml` sets out: the same loop has to be reachable from
# `main.rs` (argv, exit codes) and from a browser's JS shim, and a bin crate has
# no linkable artifact for the second. Only the first exists in this sub-slice;
# the shape is here from the start so the web sub-slice adds a module rather
# than restructuring the package.
#
# The lib is not called `horde`. A lib and a bin of the same name in one package
# write the same `horde.wasm`, which cargo calls an output filename collision.
[lib]
name = "crcbl_horde"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "horde"
path = "src/main.rs"

# Shorter than asteroids' list, and deliberately: `crcbl-audio` and
# `crcbl-store` arrive with the sub-slices that use them, so `cargo machete`
# stays meaningful until then. `crcbl-sprite` arrived with this one.
[dependencies]
crcbl = { workspace = true }
crcbl-ecs = { workspace = true }
crcbl-net = { workspace = true }
crcbl-phys = { workspace = true }
crcbl-input = { workspace = true }
crcbl-server = { workspace = true }
crcbl-client = { workspace = true }
crcbl-core = { workspace = true }
# The sheet description the sprite pass draws from, and the reader for the pair
# `build.rs` bakes. `load`, not `bake`: this half never sees a `.crpix`, and a
# shipped binary that linked the PNG *encoder* would be linking it to encode
# nothing.
crcbl-sprite = { workspace = true, features = ["load"] }
glam = { workspace = true }
log = { workspace = true }

# The other half, and the other feature. Cargo resolves build-dependency
# features separately from normal ones, so `bake`'s PNG encoder reaches the
# build script and not the game.
[build-dependencies]
crcbl-sprite = { workspace = true, features = ["bake"] }

[lints]
workspace = true
