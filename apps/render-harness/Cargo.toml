[package]
name = "render-harness"
description = "Drives crcbl's backend-agnostic golden scenes through a browser GPU backend and reads each frame back, for the WebGPU parity gate"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# A `cdylib` so a browser can load it, and an `rlib` so a native `cargo check`
# and clippy compile the same code the wasm build does — the exports are
# `#[unsafe(no_mangle)]` only on `wasm32`, so the module type-checks everywhere
# and links its symbols only where a browser reaches them. There is no `[[bin]]`:
# the wasm is driven entirely from JS, and the one native artifact beside it is
# `examples/compare-readback.rs`, which never runs in a browser.
[lib]
name = "crcbl_render_harness"
crate-type = ["cdylib", "rlib"]

[dependencies]
crcbl = { workspace = true }

# The comparator half of the gate. A dev-dependency rather than a dependency
# because `examples/compare-readback.rs` is the only thing that names it, and it
# must stay out of the wasm: `crcbl-golden` reads and writes PNGs through
# `std::fs`, which a browser has none of.
[dev-dependencies]
crcbl-golden = { workspace = true }

[lints]
workspace = true
