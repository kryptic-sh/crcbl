[package]
name = "editor"
description = "The Crucible scene editor — open a scene, pick, edit, undo, save"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# **A library with one front end**, unlike the samples: `src/main.rs` natively
# and no `src/web.rs`. `docs/plan/08-editor.md`'s 2026-08-09 correction is that
# the editor is a native target — the asset browser, OS drag-drop import and the
# file watcher are all native-shaped and nobody has examined what a browser
# would do with them.
#
# It is still checked for `wasm32-unknown-unknown`, because the workspace's
# wasm job is a deny-list and this crate is not on it. Nothing here needs a
# `cfg`: the document is arithmetic over a `World`, and the one call that
# reaches a filesystem — `Document::save_to` — goes through
# `crcbl::store::NativeStorage`, which compiles everywhere and fails at run time
# where there is no directory. A browser build would therefore link and refuse
# to save, which is the honest answer until someone builds the browser half.
#
# The lib is not called `editor`: a lib and a bin of the same name in one
# package write the same file, which cargo calls an output filename collision.
[lib]
name = "crcbl_editor"
crate-type = ["rlib"]

[[bin]]
name = "editor"
path = "src/main.rs"

[dependencies]
# The engine, with the three features this tool needs beyond the default set.
#
# `scn` is the scene *format* half of `crcbl::scene` — the `.scn/` directory
# this editor opens. It is the same feature `apps/breakout` asks for, and for
# the same reason.
#
# `scene` is the glTF importer and its bridge to the renderer: a scene's
# `crcbl::scene_mesh::Mesh` rows name glTF assets, which the document measures
# (`MeshLibrary`) and the viewport draws (`app::meshes`). A native tool, so the
# parser it links costs no browser build anything.
#
# `greybox` is the one-call prototyping scene: the editor draws every entity
# that is not a mesh as `crcbl::greybox::GREYBOX_CUBE` scaled to its own
# extents, so that picture comes out of a pack the engine already ships rather
# than out of a mesh builder here.
crcbl = { workspace = true, features = ["greybox", "scn", "scene"] }

# **The vocabularies this build ships with.** A `.scn/` chunk cannot be read
# without the type its rows are of, so every tool that opens a scene carries a
# vocabulary; `crcbl::registry` is what one is, and `src/scene.rs` builds this
# build's out of four — the editor's own greybox block, and the three games
# whose committed scenes the workspace wants edited
# (`docs/plan/sample/07-towers.md`'s milestone 2 is the dogfood pass, and
# towers' field is the scene it edits).
#
# Slice 1's arrow was different in kind: `src/board.rs` was a hand-written list
# that could drift from the game's own, and `src/document.rs` was wired to it.
# Nothing in `src/` outside `scene.rs` names a game now, and a build that wants
# other scenes edits one function.
breakout = { workspace = true }
puppet = { workspace = true }
towers = { workspace = true }

[dev-dependencies]
tempfile = "3"
# The meshes' tests draw a real `.glb`, built by `crcbl-scene`'s fixture
# builder rather than vendored, on that module's argument: a checked-in binary
# is a fixture nobody reviewing a change can read.
crcbl-scene = { workspace = true, features = ["gltf-fixture"] }

# **`breakout`, `puppet` and `towers` are named through their `[lib]` names**
# (`crcbl_breakout`, `crcbl_puppet`, `crcbl_towers`) and `cargo machete` matches
# a dependency by its *package* name against the source text, so it cannot see
# any of the three uses. Measured 2026-09-16: machete reads `[dependencies]`
# only.
[package.metadata.cargo-machete]
ignored = ["breakout", "puppet", "towers"]

[lints]
workspace = true
