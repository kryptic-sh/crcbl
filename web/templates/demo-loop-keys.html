<!--
  The three keys the engine's loop keeps, whatever the game is. They belong to
  `crcbl-shell` rather than to any sample, so they are listed once: a fourth
  one appears on every demo's controls list from this file alone.

  Goes inside a page's `<ul class="keys">`, after that game's own rows.

  The rows are `pointer-only` and the last one is `touch-only`, because all
  three of these are **keys** and a phone has none. Saying so is better than
  printing <kbd>F11</kbd> at someone with no F11.

  The touch row no longer says "keyboard only" flatly, because that stopped
  being true of every demo: on-screen controls are `crcbl-ui` widgets a *game*
  draws, and horde draws a pause button — which opens the pause menu, whose
  fullscreen and debug-panel buttons a finger can then press. A demo with such a
  control lists it in its own rows above this include, so the row points there
  rather than naming a demo this shared file has no business knowing about.
-->
<li class="key-row pointer-only">
  <span>Pause and resume</span>
  <span><kbd>Esc</kbd></span>
</li>
<li class="key-row pointer-only">
  <span>Fullscreen</span>
  <span><kbd>F11</kbd></span>
</li>
<li class="key-row pointer-only">
  <span>Debug overlay</span>
  <span><kbd>F3</kbd></span>
</li>
<li class="key-row touch-only">
  <span>Pause, fullscreen and the debug overlay</span>
  <span>keys — unless a control for them is listed above</span>
</li>
