<!--
  The keys the engine's loop keeps, whatever the game is. They belong to the
  engine rather than to any sample, so they are listed once: another one
  appears on every demo's controls list from this file alone.

  Goes inside a page's `<ul class="keys">`, after that game's own rows.

  The rows are `pointer-only` and the last one is `touch-only`, because every
  one of these is a **key** and a phone has none. Saying so is better than
  printing <kbd>F11</kbd> at someone with no F11.

  The touch row no longer says "keyboard only" flatly, because that stopped
  being true of every demo: `crcbl::engine::PauseControl` is an on-screen button
  a game draws once a finger has arrived, and it opens the pause menu, whose
  fullscreen and debug-panel buttons a finger can then press. Every demo a
  finger can play draws it — breakout, flappy and horde — and each lists it in
  its own rows above this include, so this row points there rather than naming
  demos this shared file has no business knowing about. Asteroids and hud do not
  have it: asteroids has no touch controls at all (three concurrent controls
  have no good phone layout) and hud takes no game input.

  The console has a row of its own below, because unlike the three above it is
  reachable on every demo here rather than on the three with touch controls:
  `crcbl::engine::ConsoleButton` is drawn by the **loop** rather than by each
  sample, so no `apps/*` crate has to opt in. It appears under the same
  condition as the pause button — once a contact has arrived — beside it in the
  same corner, and it opens a panel that now draws its own on-screen keyboard.
  `docs/plan/52-debug-console.md` decision 6 recorded both halves as a gap.
-->
<li class="key-row pointer-only">
  <span>Pause and resume</span>
  <span><kbd>Esc</kbd></span>
</li>
<li class="key-row pointer-only">
  <span>Fullscreen</span>
  <span><kbd>F11</kbd></span>
</li>
<li class="key-row pointer-only">
  <span>Debug overlay</span>
  <span><kbd>F3</kbd></span>
</li>
<li class="key-row pointer-only">
  <span>Debug console</span>
  <span><kbd>`</kbd></span>
</li>
<li class="key-row touch-only">
  <span>Pause, fullscreen and the debug overlay</span>
  <span>keys — unless a control for them is listed above</span>
</li>
<li class="key-row touch-only">
  <span>Debug console, and its on-screen keyboard</span>
  <span
    >the <strong>CONSOLE</strong> button, once you have touched the canvas</span
  >
</li>
